const COURSE_SOURCE=" BRIEF CONCEPT PROPOSAL\nProposed Short Course to be offered by the Faculty of Education\n\nCourse Title\nTurning Knowledge into Action: Developing Action Competence For Sustainability Through Real-life Actions\nCourse Type\nShort Course\nTarget Participants\nBachelor, Master, Doctoral and Post-Doctoral Level (Open to All)\nDuration and Delivery\nFour weeks (approximately 50 learning hours)\nCourse requirements\nThe course requirements will include completion of:\nAsynchronous study and activities (15 hours); and, \nGroup work on Collective Action (15 hours)\nFinal Report on the Completed Action (15 hours)\nExpected class size\nUp to 150 participants\nCompletion\nCertificate of completion \n\nRationale and Course Description\n\nClimate change is happening now, and it is getting worse. Universities have a distinct role in the response to climate change, functioning simultaneously as sites of knowledge transfer and as platforms through which students and staff can deepen their understanding of sustainability. Beyond this educational role, however, universities also operate as transformative spaces: they connect education, business, and civil society, and in doing so create the conditions for collaborative action across sectors. However, knowledge alone is insufficient to drive change; what is required, in addition, is the capacity to act. Research on environmental education supports this distinction, demonstrating that action competence for sustainability, a concept developed by Jensen and Schnack (1997), can be deliberately strengthened through pedagogical intervention. Building on this premise, researchers at ActHub, a Finland-based association, have developed the Action Pathway method: a transformative, inquiry-based learning process in which students are invited to address a sustainability problem of their own choosing by, in effect, taking concrete action on it. Educating students to become agents of change capable of collective action is central to higher education's role in driving the wider societal transformation that sustainability demands.\n\nCourse Goal\nThe course aims to strengthen students' action competence for sustainability. Through\nthis development, students will become: 1. aware of possible and feasible action possibilities; 2. confident that their actions matter and 3. ready to act on issues that matter the most to them in their communities. As part of the final assignment of the course, students will collectively act on a concrete sustainability challenge they found most important and urgent, demonstrating improved action competence. \nLearning Outcomes\nBy the end of the course, participants will be able to: \nWork effectively in interdisciplinary & international teams, communicate and collaborate meaningfully\nUnderstand more about sustainability, its main areas and its interconnected nature \nDevelop systems-thinking, problem-solving, creativity and resilience skills \nDevelop action competence for sustainability and therefore be able to contribute to the well-being of themselves, their communities, nature and surroundings \n\nCourse Content\nWeek 1. Understand Sustainability & Get Inspired\nSelf-assessment of studentsâ€™ action competence for sustainability \nDevelop an understanding of what sustainability means (multidimensional, interconnected concept). What can sustainable development mean? Theories, concepts, policies. \nIntroducing meaningful action examples globally (movements, companies, community practices)\nReflection Task 1 \nStudents are presented with a list of sustainability challenges (provided by course authors) and select their most preferred societal, environmental or economic (sustainability-related) concrete problem area that they wish to make change in for the better. \nGroups are formed based on the sustainability problem categories. Students are working in groups of 5, and they go along the Action Pathway steps asynchronously. \nGroups meet at fixed times (provided by the course), placed in zoom rooms to discuss. \nLearn about the â€śrules of ethical group workâ€ť and agree to the rules in the end of this quiz. \n\nWeek 2. Knowing is not enough. The Planet needs action!\nWhy is it challenging to act for sustainability? Explaining the Action Competence theory-informed Action Pathway (5-step) method. \nGiving guidelines on group work. Roles and responsibilities to volunteer for. \nStudents go through steps 1-3 steps of the Action Pathway, and the problem categories and ideas will be listed for them in order to guide their exploration and future actions. \nBy the end of this week, each student group will have one concrete, feasible action plan that they wish to implement in their local community / communities during the following week(s). It is not a limitation if students come from different geographical locations. Guidance will be given for all scenarios. \nReflection Task 2\n- on the Action Pathway learning process and collaborative group work. \n\nWeek 3. â€śBe the Change You Wish to See in This Worldâ€ť - Act! \nStep 4 of the Action Pathway: Act. Groups are implementing their planned action in their communities. \nThey prepare recordings, photos, and notes for the final assignment (go viral challenge)\nReflection Task 3\n- On Action and its realities. How was the plan working? What were the main challenges, and how have they overcome them?\n\nWeek 4. Act & Go Viral\nHow to ensure that your good practices are heard by the right people? What would make this idea go viral? \nStudent groups are working on their final assignment to introduce their action and its immediate results. The means to share this action can be decided by the groups: video, image gallery with interview snippets, â€¦.\nAt the end of the course, students are invited to share their final report (voluntary) with the opportunity to be featured in the ActHub.\nSelf-assessment of action competence levels\n\nTeaching and Learning Approach\nBuilding on pedagogical approaches used in Finland, the course applies a holistic lens, developing learners' action competence for sustainability through the following approaches:\nCritical pedagogy\nReal-life examples & phenomenon-based learning\nInquiry-based learning \nCollaborative, interdisciplinary learning\nThe main approach is to combine teaching methods that unlock the potential of all participants and make them believe in how their actions matter and that they can do something about sustainability and that they should not act alone but rather thrive to collaborate with others for more meaningful impact. \n\n\nAssessment and Completion \nDuring the assessment, we will evaluate learnersâ€™ actions that they did as a result of the course and the Action Pathway method. After each week, there will be an activity (quiz, mini-task) that is compulsory to complete individually. The final assignment will be the collective, group action done either in the same area (if participants are located in the same geographical place) or the same actions done by all members in their own locations at the time. Each final assignment will be done per working group, and with the possibility to choose from different formats (further instructions will be given for each): video, interview, photo-catalogue report or poster. \n\nAssessment Criteria  \nThe course is evaluated on a pass or fail basis, with 5 compulsory tasks, including 4 personal tasks (after each week) and 1 group task (group action & report of their choice). \n\nAssignment components and weights\nWeek 1 task (15%)\nWeek 2 task (15%)\nWeek 3 task (15%)\nWeek 4 task (15%)\nFinal Group Assignment (40%)\n\nCompletion requirements \nParticipants must complete all four weeks, participate in at least 80% of required activities or approved alternatives, submit every task and assignment, obtain an overall score of at least 70%, and demonstrate active participation in group activities. The main result overall is to learn how to act collectively, work in groups and not only come up with solutions but learn how to implement them.\n\nCourse Delivery\n\tThe course was designed for self-facilitated learning. It fits well with almost all curricula and degree programmes, given that sustainability is an interdisciplinary concept connecting and laying the foundations of how we should think and behave as learners and global citizens. The course allows students to identify challenges that fit their level and gives them the opportunity to develop their action competence through real-life interactions and experiences. \nFacilitators, if needed, should have the understanding of inquiry-based learning and provide learners with just enough guidance to continue their learning in case they need some support. The main idea is that learners can and will be able to find the solutions and next steps eventually, thanks to the well-established Action Pathway method. \nFacilitation-related work might be needed during group work should some participants be reluctant to contribute fairly to the collective, collaborative learning project. To avoid situations such as these, groups are formed in the very beginning of the course, and all participants will read and agree to the â€śrules of ethical group workâ€ť that are meant to facilitate responsibility and commitment from all participants. Should some students miss their deadline to accept their group work rules task, their participation may be considered insufficient in the final assessment. \nCourse Evaluation\nEvaluation should include a pre-course needs survey, weekly feedback, portfolio assessment, and an end-of-course evaluation. Content should be reviewed before each offering to reflect current policies, publication practices, and AI technologies.\n\nHow would ActHub facilitate as a platform? \nPossible technological solutions? Reach-out tool. How should we design the platform\nFollow-up, long-term impact measuring \nTopics they are interested in locally and collecting data to inform development policy of the local communities \nSustainability topic, 4 theme to guide actions \n\n- How many students?\n- When would this start?\n- scientific readings + additional learning tasks\n\n\n\n\n";
