const COURSE_SOURCE=" BRIEF CONCEPT PROPOSAL\nProposed Short Course to be offered by the Faculty of Education\n\nCourse Title\nTurning Knowledge into Action: Developing Action Competence For Sustainability Through Real-life Actions\nCourse Type\nShort Course\nTarget Participants\nBachelor, Master, Doctoral and Post-Doctoral Level (Open to All)\nDuration and Delivery\nFour weeks (approximately 50 learning hours)\nCourse requirements\nThe course requirements will include completion of:\nAsynchronous study and activities (15 hours); and, \nGroup work on Collective Action (15 hours)\nFinal Report on the Completed Action (15 hours)\nExpected class size\nUp to 150 participants\nCompletion\nCertificate of completion \n\nRationale and Course Description\n\nClimate change is happening now, and it is getting worse. Universities have a distinct role in the response to climate change, functioning simultaneously as sites of knowledge transfer and as platforms through which students and staff can deepen their understanding of sustainability. Beyond this educational role, however, universities also operate as transformative spaces: they connect education, business, and civil society, and in doing so create the conditions for collaborative action across sectors. However, knowledge alone is insufficient to drive change; what is required, in addition, is the capacity to act. Research on environmental education supports this distinction, demonstrating that action competence for sustainability, a concept developed by Jensen and Schnack (1997), can be deliberately strengthened through pedagogical intervention. Building on this premise, researchers at ActHub, a Finland-based association, have developed the Action Pathway method: a transformative, inquiry-based learning process in which students are invited to address a sustainability problem of their own choosing by, in effect, taking concrete action on it. Educating students to become agents of change capable of collective action is central to higher education's role in driving the wider societal transformation that sustainability demands.\n\nCourse Goal\nThe course aims to strengthen students' action competence for sustainability. Through\nthis development, students will become: 1. aware of possible and feasible action possibilities; 2. confident that their actions matter and 3. ready to act on issues that matter the most to them in their communities. As part of the final assignment of the course, students will collectively act on a concrete sustainability challenge they found most important and urgent, demonstrating improved action competence. \nLearning Outcomes\nBy the end of the course, participants will be able to: \nWork effectively in interdisciplinary & international teams, communicate and collaborate meaningfully\nUnderstand more about sustainability, its main areas and its interconnected nature \nDevelop systems-thinking, problem-solving, creativity and resilience skills \nDevelop action competence for sustainability and therefore be able to contribute to the well-being of themselves, their communities, nature and surroundings \n\nCourse Content\nWeek 1. Understand Sustainability & Get Inspired\nSelf-assessment of students’ action competence for sustainability \nDevelop an understanding of what sustainability means (multidimensional, interconnected concept). What can sustainable development mean? Theories, concepts, policies. \nIntroducing meaningful action examples globally (movements, companies, community practices)\nReflection Task 1 \nStudents are presented with a list of sustainability challenges (provided by course authors) and select their most preferred societal, environmental or economic (sustainability-related) concrete problem area that they wish to make change in for the better. \nGroups are formed based on the sustainability problem categories. Students are working in groups of 5, and they go along the Action Pathway steps asynchronously. \nGroups meet at fixed times (provided by the course), placed in zoom rooms to discuss. \nLearn about the “rules of ethical group work” and agree to the rules in the end of this quiz. \n\nWeek 2. Knowing is not enough. The Planet needs action!\nWhy is it challenging to act for sustainability? Explaining the Action Competence theory-informed Action Pathway (5-step) method. \nGiving guidelines on group work. Roles and responsibilities to volunteer for. \nStudents go through steps 1-3 steps of the Action Pathway, and the problem categories and ideas will be listed for them in order to guide their exploration and future actions. \nBy the end of this week, each student group will have one concrete, feasible action plan that they wish to implement in their local community / communities during the following week(s). It is not a limitation if students come from different geographical locations. Guidance will be given for all scenarios. \nReflection Task 2\n- on the Action Pathway learning process and collaborative group work. \n\nWeek 3. “Be the Change You Wish to See in This World” - Act! \nStep 4 of the Action Pathway: Act. Groups are implementing their planned action in their communities. \nThey prepare recordings, photos, and notes for the final assignment (go viral challenge)\nReflection Task 3\n- On Action and its realities. How was the plan working? What were the main challenges, and how have they overcome them?\n\nWeek 4. Act & Go Viral\nHow to ensure that your good practices are heard by the right people? What would make this idea go viral? \nStudent groups are working on their final assignment to introduce their action and its immediate results. The means to share this action can be decided by the groups: video, image gallery with interview snippets, ….\nAt the end of the course, students are invited to share their final report (voluntary) with the opportunity to be featured in the ActHub.\nSelf-assessment of action competence levels\n\nTeaching and Learning Approach\nBuilding on pedagogical approaches used in Finland, the course applies a holistic lens, developing learners' action competence for sustainability through the following approaches:\nCritical pedagogy\nReal-life examples & phenomenon-based learning\nInquiry-based learning \nCollaborative, interdisciplinary learning\nThe main approach is to combine teaching methods that unlock the potential of all participants and make them believe in how their actions matter and that they can do something about sustainability and that they should not act alone but rather thrive to collaborate with others for more meaningful impact. \n\n\nAssessment and Completion \nDuring the assessment, we will evaluate learners’ actions that they did as a result of the course and the Action Pathway method. After each week, there will be an activity (quiz, mini-task) that is compulsory to complete individually. The final assignment will be the collective, group action done either in the same area (if participants are located in the same geographical place) or the same actions done by all members in their own locations at the time. Each final assignment will be done per working group, and with the possibility to choose from different formats (further instructions will be given for each): video, interview, photo-catalogue report or poster. \n\nAssessment Criteria  \nThe course is evaluated on a pass or fail basis, with 5 compulsory tasks, including 4 personal tasks (after each week) and 1 group task (group action & report of their choice). \n\nAssignment components and weights\nWeek 1 task (15%)\nWeek 2 task (15%)\nWeek 3 task (15%)\nWeek 4 task (15%)\nFinal Group Assignment (40%)\n\nCompletion requirements \nParticipants must complete all four weeks, participate in at least 80% of required activities or approved alternatives, submit every task and assignment, obtain an overall score of at least 70%, and demonstrate active participation in group activities. The main result overall is to learn how to act collectively, work in groups and not only come up with solutions but learn how to implement them.\n\nCourse Delivery\n\tThe course was designed for self-facilitated learning. It fits well with almost all curricula and degree programmes, given that sustainability is an interdisciplinary concept connecting and laying the foundations of how we should think and behave as learners and global citizens. The course allows students to identify challenges that fit their level and gives them the opportunity to develop their action competence through real-life interactions and experiences. \nFacilitators, if needed, should have the understanding of inquiry-based learning and provide learners with just enough guidance to continue their learning in case they need some support. The main idea is that learners can and will be able to find the solutions and next steps eventually, thanks to the well-established Action Pathway method. \nFacilitation-related work might be needed during group work should some participants be reluctant to contribute fairly to the collective, collaborative learning project. To avoid situations such as these, groups are formed in the very beginning of the course, and all participants will read and agree to the “rules of ethical group work” that are meant to facilitate responsibility and commitment from all participants. Should some students miss their deadline to accept their group work rules task, their participation may be considered insufficient in the final assessment. \nCourse Evaluation\nEvaluation should include a pre-course needs survey, weekly feedback, portfolio assessment, and an end-of-course evaluation. Content should be reviewed before each offering to reflect current policies, publication practices, and AI technologies.\n\nHow would ActHub facilitate as a platform? \nPossible technological solutions? Reach-out tool. How should we design the platform\nFollow-up, long-term impact measuring \nTopics they are interested in locally and collecting data to inform development policy of the local communities \nSustainability topic, 4 theme to guide actions \n\n- How many students?\n- When would this start?\n- scientific readings + additional learning tasks\n\n\n\n\n";

 const p=P();return p.members.map(m=>{const a=p.personal[m.id],text=kind==='challenge'?a.challenge:kind==='idea'?a.idea:a.observation;if(!text)return'';return`<div class="item"><div class="item-head"><h4>${e(m.name)}</h4><span class="pill personal">Saját hozzájárulás</span></div><p class="wrap">${e(text)}</p>${kind==='observation'&&a.observationSource?`<p><strong>Forrás / tapasztalat:</strong> ${e(a.observationSource)}</p>`:''}${kind==='idea'&&a.ideaContribution?`<p><strong>Ezt vállalnám:</strong> ${e(a.ideaContribution)}</p>`:''}${m.place?`<div class="item-meta">${e(m.place)}</div>`:''}</div>`}).filter(Boolean).join('')||empty('Még nem érkezett hozzájárulás','A résztvevők saját bejegyzései itt jelennek meg. A nézetváltóval kipróbálhatod a többi tag oldalát.','users');

function reflectionBody(week){const me=ME(),submitted=me.submissions[week],p=P();return`${notice('<strong>Csak a saját tanulásodról írj.</strong> A tervezett rendszerben ezt a résztvevő és az értékelő látná, nem a teljes csoport. Ebben a helyi prototípusban a nézetváltó nem hozzáférés-védelem.')}${F('i',`ref${week}a`,REFLECTIONS[week][0])}${F('i',`ref${week}b`,REFLECTIONS[week][1])}<hr class="divider"><h3>Heti visszajelzés</h3>${F('i',`feedback${week}`,'Hogyan haladtál ezen a héten?','select',{options:[['','Válassz egyet'],['good','Tudtam haladni'],['mixed','Volt, ami ment, és volt, ami nehéz volt'],['help','Segítségre van szükségem']]})}${F('i',`feedbackNote${week}`,'Mi segített, vagy milyen támogatás hiányzott?','textarea',{optional:true,rows:2})}${week===4?`${F('i','courseUseful','Mi volt a folyamat leghasznosabb része?','textarea',{optional:true,rows:2})}${F('i','courseImprove','Min változtatnál a következő kurzushoz?','textarea',{optional:true,rows:2})}`:''}${submitted?notice(`${icon('check','small')} <strong>${p.kind==='course'?'Helyben rögzített beadás':'Elmentett reflexió'}:</strong> ${dateTime(submitted.at)}. ${reflectionChanged(week)?'Azóta módosult a szöveg. A friss változatot ismét rögzítened kell.':'A mentett változat a saját portfóliódban is elérhető.'}`,reflectionChanged(week)?'warn':''):''}${p.kind==='course'?`<div class="small muted">Ez a ${week}. egyéni feladat. Súlya a kurzustervben: <strong>15%</strong>. A helyi rögzítés nem jelent egyetemi beküldést vagy automatikus értékelést.</div>`:''}`}
function reflectionSnapshot(week){const m=ME();return{a:m[`ref${week}a`]||'',b:m[`ref${week}b`]||'',feedback:m[`feedback${week}`]||'',note:m[`feedbackNote${week}`]||'',...(week===4?{useful:m.courseUseful||'',improve:m.courseImprove||''}:{})}}
function reflectionChanged(week){const sub=ME().submissions[week];return sub&&JSON.stringify(sub.content)!==JSON.stringify(reflectionSnapshot(week))}
function taskList(mine=false){const ts=P().tasks.filter(t=>!mine||t.owner===M().id);return ts.length?ts.map(t=>`<div class="item"><div class="task-row"><div><div class="task-title">${e(t.title)}</div><div class="task-info">${e(memberName(t.owner))} · ${t.date?e(dateStr(t.date)):'Még nincs határidő'}${t.place?' · '+e(t.place):''}</div></div><select aria-label="${e(t.title)} állapota" ${bind('task','status',t.id,true)}>${[['todo','Még előttem áll'],['doing','Dolgozom rajta'],['blocked','Elakadtam'],['done','Elvégeztem']].map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="item-meta"><button class="link-btn" data-action="edit-task" data-id="${t.id}">Szerkesztés</button></div></div>`).join(''):empty(mine?'Még nincs hozzád rendelt feladat':'Még nincs feladat a közös tervben',mine?'Vállalj konkrét részt a megvalósításból.':'Adjátok meg, minek kell megtörténnie, ki vállalja és mikorra.','flag')}
function contactList(){return P().contacts.length?P().contacts.map(c=>`<div class="item"><div class="item-head"><h4>${e(c.name)}</h4><span class="pill ${c.status==='replied'?'group':'plain'}">${({new:'Előkészítés',sent:'Megkeresve',replied:'Válasz érkezett',closed:'Lezárva'})[c.status]||'Előkészítés'}</span></div><p>${e(c.need)}</p><p>${e(c.email||'Nincs megadott e-mail')}</p>${c.source?`<div class="item-meta">Forrás: ${safeURL(c.source)?`<a href="${e(safeURL(c.source))}" target="_blank" rel="noopener noreferrer">hivatalos elérhetőség</a>`:e(c.source)} · ${c.verified?'Résztvevő ellenőrizte':'Még ellenőrizendő'}</div>`:''}<div class="actions" style="margin-top:12px">${button('Levélvázlat','draft-contact','small secondary',`data-id="${c.id}"`)}${button('Frissítés','edit-contact','small ghost',`data-id="${c.id}"`)}</div></div>`).join(''):empty('Milyen segítség hiányzik?','Személyt vagy szervezetet te adhatsz meg ellenőrzött, nyilvános elérhetőséggel. A prototípus nem keres az interneten és nem küld levelet.','mail')}
function evidenceList(){return P().evidence.length?P().evidence.map(v=>`<div class="item"><div class="item-head"><h4>${e(v.title)}</h4><span class="pill ${v.permission==='public'?'group':'plain'}">${({private:'Csak a projekthez',public:'Megosztásra egyeztetve',pending:'Egyeztetés szükséges'})[v.permission]||'Csak a projekthez'}</span></div><p class="wrap">${e(v.note)}</p><div class="item-meta"><span>${e(memberName(v.author))}</span><span>${dateStr(v.date)}</span><span>${({activity:'Tevékenység',result:'Közvetlen eredmény',learning:'Tanulság'})[v.kind]||'Dokumentáció'}</span></div>${v.url?`<div class="small" style="margin-top:8px"><a href="${e(safeURL(v.url))}" target="_blank" rel="noopener noreferrer">${icon('link','small')} Hivatkozás megnyitása</a></div>`:''}${v.fileId?`<div class="actions" style="margin-top:10px">${button(icon('download','small')+' '+e(v.fileName),'download-file','small secondary',`data-id="${v.fileId}"`)}${v.mime?.startsWith('image/')?button('Előnézet','preview-file','small ghost',`data-id="${v.fileId}"`):''}</div><img class="evidence-preview" id="preview-${v.fileId}" alt="${e(v.title)}" hidden>`:''}<div class="item-meta"><button class="link-btn" data-action="delete-evidence" data-id="${v.id}">Eltávolítás</button></div></div>`).join(''):empty('Még nincs dokumentáció','Adj hozzá jegyzetet, hivatkozást vagy helyben tárolt fájlt. A szöveges megfigyelés is lehet hasznos bizonyíték.','camera')}
function logList(mine=false){return P().logs.filter(l=>!mine||l.author===M().id).map(l=>`<div class="item"><div class="item-head"><h4>${e(memberName(l.author))} · ${dateStr(l.date)}</h4><span class="pill plain">Cselekvési napló</span></div><p class="wrap">${e(l.action)}</p><p class="wrap"><strong>Megfigyelés:</strong> ${e(l.observation)}</p></div>`).join('')||empty('Még nincs cselekvési napló','A megtörtént tevékenységet írd le, ne csak azt, amit terveztél.','file')}
function optionList(){const opts=allOptions(),g=P().group;return opts.length?opts.map(o=>`<div class="item ${g.selectedOption===o.id?'selected':''}"><div class="item-head"><h4>${e(o.title)}</h4><span class="pill plain">${e(o.author?memberName(o.author):'Közös ötlet')}</span></div>${o.why?`<p>${e(o.why)}</p>`:''}<div class="actions" style="margin-top:12px">${button(g.selectedOption===o.id?icon('check','small')+' Kiválasztva':'Ezt választjuk','choose-option',g.selectedOption===o.id?'small':'small secondary',`data-id="${o.id}"`)}${button(ME().preferredOption===o.id?'Ezt javaslom ✓':'Ezt javaslom','vote-option','small ghost',`data-id="${o.id}"`)}</div><div class="item-meta">${P().members.filter(m=>P().personal[m.id].preferredOption===o.id).map(m=>e(m.name)).join(', ')||'Még nincs személyes javaslat'}</div></div>`).join(''):empty('Először hozzatok ötleteket','A saját megfigyelés és ötlet lépésből automatikusan ide kerülnek a javaslatok. Közös ötletet külön is hozzáadhattok.','spark')}
function allOptions(){return [...P().members.map(m=>({id:'idea-'+m.id,title:P().personal[m.id].idea,why:P().personal[m.id].ideaWhy,author:m.id})).filter(o=>o.title),...P().options]}
function selectedOption(){return allOptions().find(o=>o.id===P().group.selectedOption)}
function selfComparison(){const m=ME();return SCALE.map((q,i)=>{const before=m['base'+i],after=m['end'+i];return`<div class="result-row" style="display:block"><strong>${e(q)}</strong><div class="result-bars"><div><div class="small muted">Kezdéskor: ${before?e(before)+'/5':'nincs adat'}</div><div class="score-bar"><span style="width:${Number(before||0)*20}%"></span></div></div><div><div class="small muted">Most: ${after?e(after)+'/5':'nincs adat'}</div><div class="score-bar after"><span style="width:${Number(after||0)*20}%"></span></div></div></div></div>`}).join('')+`<p class="small muted" style="margin-top:16px">Személyes önbeszámoló. A különbség önmagában nem bizonyítja a kurzus hatását; ebből nem számolunk érdemjegyet.</p>`}
function stepBody(id){const p=P(),g=p.group,me=ME();switch(id){
case 'w1-start':return `${notice('<span class="notice-label">Saját kiindulópont</span>A válaszokból a kurzus végén személyes összehasonlítás készül. Nincs elvárt „jó” pontszám. A kérdések a kurzuscélokra épülő prototípus-elemek; nem az eredeti, validált mérési kérdőív.') }<div class="row">${F('m','name','Hogyan szólíthatunk?','text',{id:M().id,placeholder:'A neved'})}${F('m','place','Hol kapcsolódsz be?','text',{id:M().id,placeholder:'Település / közösség',optional:true})}</div>${SCALE.map((q,i)=>rating('i','base'+i,q)).join('')}${F('i','needs','Miben szeretnél segítséget kapni a folyamat során?','textarea',{placeholder:'Például az első lépés megtalálásában, együttműködésben vagy a megvalósításban.'})}${F('i','background','Milyen tapasztalatot hozol magaddal?','textarea',{optional:true,rows:2})}`;
case 'w1-learn':return `${resourceBlock(1)}<div class="note orange-note"><span class="notice-label">Javasolt gondolkodási segédlet</span>Az alábbi kérdések a kurzusvázlat többdimenziós, összekapcsolt fenntarthatóság-szemléletét bontják munkalépésekre. Nem helyettesítik az oktató tananyagát.</div><details class="learning-block" open><summary>Ugyanaz az ügy, több nézőpont</summary><div><p><strong>Környezeti nézőpont:</strong> milyen természeti körülményhez, erőforráshoz vagy környezeti terheléshez kapcsolódik az ügy?</p><p><strong>Társadalmi nézőpont:</strong> kiket érint, kinek a szempontját nem hallottad még, és kinek a részvétele fontos?</p><p><strong>Gazdasági nézőpont:</strong> milyen idő, eszköz, költség vagy más erőforrás befolyásolja a lehetőségeket?</p></div></details>${F('i','connections','Mutass be egy összefüggést legalább két nézőpont között.','textarea',{placeholder:'A választott helyzetben ez azért kapcsolódik ahhoz, mert…'})}<h3 style="margin-top:25px">Egy cselekvés, amelyből tanulnál</h3>${F('i','inspiration','Milyen kezdeményezést ismertél meg a tananyagban vagy saját tapasztalatból?','text',{placeholder:'A kezdeményezés neve vagy rövid leírása'})}${F('i','inspirationSource','Hol ismerted meg?','text',{optional:true,placeholder:'Tananyag, személyes tapasztalat vagy hivatkozás'})}${F('i','inspirationWhy','Mi segítette, hogy az ötletből tényleges cselekvés legyen?')}`;
case 'w1-challenge':return `${F('i','category','Melyik tág problémakörhöz kapcsolódik az ügyed?','select',{options:[['','Válassz egyet'],['environment','Környezeti'],['social','Társadalmi'],['economic','Gazdasági'],['connected','Több területet összekapcsoló']],help:'A kurzusterv tág kategóriái. A szerzők által ígért részletes kihíváslista még nincs mellékelve.'})}${F('i','challenge','Milyen konkrét helyzeten szeretnél változtatni?','textarea',{placeholder:'Ne csak témát nevezz meg: írd le, mi történik, hol, és mi benne a probléma.'})}<div class="row">${F('i','challengeWhere','Hol jelenik meg?','text',{placeholder:'Helyszín vagy közösség'})}${F('i','challengeWho','Kiket érint?','text',{placeholder:'Érintettek'})}</div>${F('i','challengeWhy','Miért fontos neked ez az ügy?')}${notice(`${icon('users','small')} <strong>Ezt a hozzájárulást a csapat is látja.</strong> A nézet megosztása még nem jelent közös problémaválasztást. A csoportot a kurzusban az oktató állítja össze a témaválasztások alapján.`)}`;
case 'w1-team':return `${p.mode==='team'?`<h3>A csapatotok</h3><p class="small muted">A helyi prototípusban öt szerkeszthető hely van. Ez nem automatikus csoportosítás és nem online meghívó.</p>${p.members.map((m,i)=>`<div class="member-row"><span class="avatar ${i%2?'green':''}">${i+1}</span>${F('m','name','Név','text',{id:m.id,inline:true})}${F('m','place','Helyszín','text',{id:m.id,inline:true})}</div>`).join('')}`:notice('Ebben a projektben önállóan dolgozol. A közös lépések a saját projekted döntési pontjaiként működnek.')}<hr class="divider">${F('p','name','A projekt munkacíme','text')}${F('g','locationMode','Hogyan valósítjátok meg az akciót?','select',{live:true,options:[['one','Egy helyszínen, megosztott feladatokkal'],['many','Több helyszínen, közös akció helyi megvalósításaival']]})}${g.locationMode==='many'?notice('Egyeztessétek, mi lesz minden helyszínen közös, és mit lehet a helyi körülményekhez igazítani. Később minden feladathoz külön helyszín adható.'):''}${F('g','communication','Hol és hogyan tartjátok a kapcsolatot?','text',{placeholder:'Például a kurzus csoportos felületén, előre egyeztetett válaszidővel.'})}<div class="row">${F('g','meetingTime','Oktató által kijelölt csoportidőpont','datetime-local',{optional:true})}${F('g','meetingUrl','Zoom / csoportszoba hivatkozás','url',{optional:true,placeholder:'https://…'})}</div>${notice('Az időpontot és a csoportszobát az oktató adja meg. A prototípus nem foglal találkozót és nem küld meghívót.')}<h3>Hozott témák</h3>${participantContributions('challenge')}<hr class="divider">${F('g','rules','A közös munka megállapodása','textarea',{rows:6,help:'Szerkeszthető javaslat. Az eredeti kurzusvázlat nem tartalmazza az etikai szabályok végleges szövegét.'})}${F('g','teamFocus','Mi köt össze benneteket a választott ügyben?','textarea',{placeholder:'Most még közös témát kerestek, a konkrét akcióról a következő héten döntötök.'})}<h3>Személyes vállalások állapota</h3>${p.members.map(m=>`<div class="check-status"><span class="status-dot ${p.personal[m.id].agreement?'ok':'wait'}"></span>${e(m.name)} · ${p.personal[m.id].agreement?'elfogadta a megállapodást':'a következő egyéni lépésben fogadja el'}</div>`).join('')}`;
case 'w1-ethics':return `${notice('<strong>Javasolt gyakorlóhelyzetek.</strong> A végleges etikai kvízt a kurzus szerzőinek kell jóváhagyniuk. Itt a közös megállapodás megértését próbálhatod ki.')}<div class="draft-box">${e(g.rules)}</div><div class="quiz-question">1. Nem tudod időben befejezni a vállalt feladatot. Mi segíti a közös munkát?</div>${[['a','Megvárom, amíg valaki rákérdez.'],['b','Időben jelzem az akadályt, és vállalható módosítást egyeztetek.'],['c','Külön tervet kezdek, anélkül hogy szólnék.']].map(([v,l])=>`<label class="quiz-option"><input type="radio" ${bind('i','quiz1')} name="quiz1" value="${v}" ${me.quiz1===v?'checked':''}>${l}</label>`).join('')}<div class="quiz-question">2. A csapattagok eltérő megoldásokat javasolnak. Mi legyen a következő lépés?</div>${[['a','Automatikusan az első ötletet valósítjuk meg.'],['b','Külön-külön öt projektet indítunk egyeztetés nélkül.'],['c','Megvizsgáljuk a szempontokat, és rögzítünk egy közösen vállalható döntést.']].map(([v,l])=>`<label class="quiz-option"><input type="radio" ${bind('i','quiz2')} name="quiz2" value="${v}" ${me.quiz2===v?'checked':''}>${l}</label>`).join('')}${button('Válaszok ellenőrzése','check-quiz','small secondary')}<div id="quiz-feedback" aria-live="polite"></div><hr class="divider">${C('i','agreement','Elolvastam a megállapodást, vállalom a saját részemet, és jelzem, ha segítség kell.')}`;
case 'w2-input':return `${resourceBlock(2)}${notice('<span class="notice-label">Kapcsolódás az Action Pathway-hez</span>A kurzusterv a 2. héten az ötlépéses módszer első három lépését jelöli ki, de nem adja meg azok pontos megnevezését és instrukcióit. Az itt látható feladatok javasolt digitális segédletek ehhez a szakaszhoz.')}<details class="learning-block"><summary>Miért lehet nehéz eljutni a tudástól a cselekvésig?</summary><div>Vizsgáld meg a saját helyzetedet: nem világos az első lépés, bizonytalan a szereped, más segítsége kell, vagy túl nagynak tűnik az akció? Ne általában magyarázd meg a problémát; nevezd meg a saját akadályodat.</div></details>${F('i','barrier','Mi nehezítheti számodra a cselekvést?')}${F('i','observation','Milyen konkrét megfigyelést hozol a közös ügyhöz?','textarea',{placeholder:'Amit láttál, hallottál, megtapasztaltál vagy egy azonosítható forrásban olvastál.'})}${F('i','observationSource','Miből tudod ezt?','text',{placeholder:'Saját megfigyelés dátummal, beszélgetés vagy forrás'})}${F('i','assumption','Mit feltételezel, de még nem tudsz biztosan?','textarea',{optional:true,rows:2})}<hr class="divider">${F('i','idea','Mi lehetne egy konkrét, megvalósítható akció?','text',{placeholder:'Egy cselekvés, nem pusztán egy téma.'})}${F('i','ideaWhy','Milyen közvetlen változást vársz ettől?')}${F('i','ideaContribution','Te mivel tudnál hozzájárulni?','text')}${F('i','availableHours','Mennyi időt tudsz reálisan vállalni a megvalósításból?','text',{optional:true,placeholder:'Saját becslésed — nem azonos a kurzus teljes óraszámával.'})}`;
case 'w2-focus':return `<h3>A csapattól érkezett megfigyelések</h3>${participantContributions('observation')}<hr class="divider">${F('g','problem','Mi a pontos, közösen választott probléma?','textarea',{placeholder:'Mi történik, hol történik, kit érint, és miben szeretnétek változást?'})}${F('g','affected','Kiket kell meghallgatni vagy bevonni?','textarea',{rows:2})}${F('g','connections','Milyen szereplők, körülmények és okok kapcsolódnak egymáshoz?')}${F('g','unknowns','Mit kell még tisztáznotok, mielőtt döntötök?','textarea',{placeholder:'Azt is írjátok le, ha nincs nyitott kérdés.'})}${F('g','goal','Milyen közvetlen változás felé szeretnétek elmozdulni?','textarea',{placeholder:'Olyasmi, amire a kurzus ideje alatt tényleges ráhatásotok lehet.'})}`;

function helpCard(key){const h=HELP_ROUTES[key]||HELP_ROUTES.direction;return`<div class="card soft flat" style="margin:18px 0"><span class="eyebrow">Where you are → What's missing → What's next</span><h3 style="margin-top:12px">${h.title}</h3><p class="small">${h.text}</p>${h.prompts.map((q,i)=>`<div class="small" style="margin-top:10px"><span class="soft-number">${i+1}</span>${q}</div>`).join('')}<p class="small muted" style="margin:15px 0 0">Előre megírt döntési segédlet, nem mesterségesintelligencia-szolgáltatás.</p></div>`}
function reportModel(){const p=P(),g=p.group;return{title:p.name,format:g.format,summary:g.reportSummary||'',problem:g.problem||'',goal:g.goal||'',plan:g.action||'',actual:g.actualAction||'',result:g.immediateResult||'',support:g.resultSupport||'',limits:g.limitations||'',learning:g.learning||'',changes:p.changes.map(x=>({decision:x.decision,change:x.change})),team:p.members.map(m=>({name:m.name,place:m.place,tasks:p.tasks.filter(t=>t.owner===m.id).map(t=>({title:t.title,status:t.status}))})),evidence:p.evidence.map(v=>({title:v.title,note:v.note,kind:v.kind,date:v.date,url:v.url,fileName:v.fileName||'',permission:v.permission})),artifactUrl:g.finalUrl||'',fileId:g.finalFileId||''}}
function reportChanged(){return P().groupSubmission&&JSON.stringify(P().groupSubmission.content)!==JSON.stringify(reportModel())}
function reportBuilder(){const p=P(),g=p.group;return `${notice('<strong>A tartalom már a munkátokból épül.</strong> A probléma, a terv, az elvégzett tevékenység, az eredmény, a feladatok és a dokumentáció automatikusan bekerül a letölthető beszámolóba. A személyes reflexiók és a külső kapcsolattartók adatai nem kerülnek bele.')}${F('g','format','A végső csoportos beadandó formátuma','select',{live:true,options:[['poster','Poszter'],['photo','Fotókatalógus / képes beszámoló'],['video','Videó'],['interview','Interjú']]})}${F('g','reportSummary','Rövid bevezető a közös történethez','textarea',{placeholder:'Milyen ügyön dolgoztatok, mi történt, és miért érdemes ezt megismerni?',rows:4})}${g.format==='poster'?notice('A poszter a projekt adataiból nyomtatható HTML-ként készül el. Letöltés után böngészőből nyomtatható. Az alábbi hivatkozás vagy fájl használható helyette saját végső poszterhez.'):notice('A választott formátum tényleges videóját, interjúját vagy képes anyagát adjátok meg hivatkozásként vagy fájlként. A letölthető szöveges projektbeszámoló önmagában nem helyettesíti ezt.','orange-note')}${F('g','finalUrl','A kész végső anyag hivatkozása','url',{optional:g.format==='poster',placeholder:'https://…'})}${F('g','finalFileId','Vagy válasszatok egy már csatolt végső fájlt','select',{options:[['','Nincs kiválasztott fájl'],...p.evidence.filter(v=>v.fileId).map(v=>[v.fileId,v.fileName])],optional:true})}${button(icon('upload','small')+' Végső anyag csatolása','add-final-file','small secondary')}<hr class="divider"><h3>Összeálló közös beszámoló</h3>${reportPreview()}<div class="actions" style="margin:20px 0">${button(icon('download','small')+' Beszámoló (.html)','download-report','secondary')}${g.format==='poster'?button(icon('download','small')+' Poszter (.html)','download-poster','orange-btn'):''}</div>${C('g','realActionConfirmed','A leírt akció valóban megtörtént; a beszámoló nem csak terv.')}${C('g','reportReviewed','Átnéztük a közös anyagot, a hozzájárulások és a bizonyítékok megfelelően szerepelnek benne.')}${p.groupSubmission?notice(`<strong>Helyben rögzített közös beadás:</strong> ${dateTime(p.groupSubmission.at)}. ${reportChanged()?'Azóta változott a projektből épülő anyag; ellenőrizzétek, és rögzítsétek újra a végső változatot.':'A beadott változat a portfólióban elérhető.'}`,reportChanged()?'warn':''):''}<p class="small muted">${p.kind==='course'?'A csoportos feladat súlya a kurzustervben 40%. ':''}A gomb csak helyben rögzíti a végső változatot. Nincs egyetemi beküldés vagy automatikus pontozás.</p>`}
function reportPreview(){const r=reportModel();return`<details class="learning-block" open><summary>${e(r.title)} · beszámoló-előnézet</summary><div>${[['Röviden',r.summary],['A választott probléma',r.problem],['Mit tettünk?',r.actual],['Mit figyeltünk meg?',r.result],['Mi támasztja alá?',r.support],['Az állításaink korlátai',r.limits],['Mit tanultunk?',r.learning]].map(([l,v])=>`<h4>${l}</h4><p class="wrap">${e(v||'Még nincs kitöltve.')}</p>`).join('')}<h4>Hozzájárulások</h4>${r.team.map(m=>`<p><strong>${e(m.name)}:</strong> ${m.tasks.map(t=>e(t.title)).join('; ')||'Nincs rögzített feladat.'}</p>`).join('')}<h4>Dokumentáció</h4><p>${r.evidence.length} bejegyzés kapcsolódik a projekthez.</p></div></details>`}
function validation(id){const p=P(),g=p.group,m=ME(),errors=[],need=(v,msg)=>{if(!String(v??'').trim())errors.push(msg)},all=(scope,keys,msg)=>{if(keys.some(k=>!scope[k]))errors.push(msg)};switch(id){
case'w1-start':need(M().name,'Add meg a nevedet.');all(m,['base0','base1','base2'],'Válaszolj mindhárom kezdő önértékelési kérdésre.');need(m.needs,'Írd le, miben szeretnél támogatást kapni.');break;
case'w1-learn':all(m,['connections','inspiration','inspirationWhy'],'Írd le az összefüggést, egy ismert kezdeményezést és a belőle levont tanulságot.');break;
case'w1-challenge':all(m,['category','challenge','challengeWho','challengeWhere','challengeWhy'],'Válassz témakategóriát, és töltsd ki a saját ügyed négy kérdését.');break;
case'w1-team':all(g,['communication','rules','teamFocus'],'Rögzítsétek a kapcsolattartást, a megállapodást és a közös témát.');need(p.name,'Adj nevet a projektnek.');if(g.meetingUrl&&!safeURL(g.meetingUrl))errors.push('A csoportszoba hivatkozása teljes https:// vagy http:// cím legyen.');break;
case'w1-ethics':if(m.quiz1!=='b'||m.quiz2!=='c')errors.push('Nézd át a gyakorlóhelyzetek válaszait: időben jelezni az akadályt, és egyeztetett döntést hozni.');if(!m.agreement)errors.push('Személyesen fogadd el a közös megállapodást.');break;
case'w2-input':all(m,['observation','observationSource','idea','ideaWhy','ideaContribution'],'Adj meg megfigyelést, annak forrását, akcióötletet, várható eredményt és saját hozzájárulást.');break;
case'w2-focus':all(g,['problem','affected','connections','unknowns','goal'],'Rögzítsétek a problémát, az érintetteket, az összefüggéseket, a nyitott kérdéseket és a kívánt változást.');break;
case'w2-choose':if(!selectedOption())errors.push('Válasszatok egy konkrét akciójavaslatot.');all(g,['feasibleTime','feasibleResources','feasiblePermission','feasibleResult'],'Nézzétek át mind a négy megvalósíthatósági szempontot.');need(g.choiceReason,'Írjátok le a választás indokát.');break;
case'w2-plan':all(g,['action','actionDate','doneDefinition','resources','risk'],'Töltsétek ki az akciót, az időpontot, az elkészülési feltételt, az erőforrásokat és az előzetes egyeztetéseket.');if(!p.tasks.length)errors.push('Adj hozzá legalább egy feladatot felelőssel és határidővel.');if(g.locationMode==='many')need(g.commonCore,'Tisztázzátok, mi közös a helyi megvalósításokban.');break;

p.tasks.filter(t=>t.owner===m.id).length} feladat kész</div></div></div>`).join('')}<hr class="divider"><p class="small muted">${g.locationMode==='many'?'Több helyszín · közös akció, helyi megvalósítás':'Egy helyszín · megosztott felelősségek'}</p>${g.meetingTime?`<p class="small">Kijelölt találkozó: ${dateTime(g.meetingTime)}</p>`:''}${safeURL(g.meetingUrl)?`<a class="btn small secondary" target="_blank" rel="noopener noreferrer" href="${e(safeURL(g.meetingUrl))}">Csoportszoba megnyitása</a>`:''}</div></div></div>`}else if(ui.tab==='tasks'){content=`<div class="section-head" style="margin-top:0"><div><h2>Ki mit visz tovább?</h2><p class="small muted" style="margin:7px 0 0">Ugyanazok a feladatok, mint a heti lépésekben.</p></div>${button(icon('plus','small')+' Feladat','add-task','orange-btn')}</div><div class="kanban">${[['todo','Még előttünk áll'],['doing','Folyamatban / elakadt'],['done','Elvégezve']].map(([k,l])=>{const tasks=p.tasks.filter(t=>k==='doing'?['doing','blocked'].includes(t.status):t.status===k);return`<div class="kanban-col"><h3>${l}<span>${tasks.length}</span></h3>${tasks.map(t=>`<div class="item"><div class="item-head"><h4>${e(t.title)}</h4></div><div class="item-meta">${e(memberName(t.owner))}<br>${dateStr(t.date)}${t.place?' · '+e(t.place):''}</div>${t.status==='blocked'?'<span class="pill orange" style="margin-top:8px">Elakadt</span>':''}<div style="margin-top:12px">${button('Megnyitás','edit-task','small secondary',`data-id="${t.id}"`)}</div></div>`).join('')||'<div class="small muted">Itt még nincs feladat.</div>'}</div>`}).join('')}</div>`}else if(ui.tab==='contacts'){content=`<div class="section-head" style="margin-top:0"><div><h2>Az emberek, akik segíthetnek.</h2><p class="small muted" style="margin:8px 0 0">Konkrét kérés. Ellenőrzött elérhetőség. Következő lépés.</p></div>${button(icon('plus','small')+' Kapcsolat','add-contact','orange-btn')}</div><div class="grid two"><div>${contactList()}</div><div><div class="card orange-card"><h3>Hogyan működik a Support Route?</h3><p class="small">Előbb azonosítsd, milyen segítség hiányzik. Adj meg egy releváns személyt vagy szervezetet, és ellenőrizd az elérhetőségét a hivatalos felületén.</p><p class="small">A levélvázlat a saját projekted és kérésed adataiból készül. Ellenőrzés után kimásolhatod, és a saját leveleződből küldheted el.</p><p class="small muted">A HTML nem keres partnert és nem küld e-mailt. A státuszt te frissíted a tényleges megkeresés és válasz alapján.</p></div></div></div>`}else if(ui.tab==='evidence'){content=`<div class="section-head" style="margin-top:0"><h2>Mi támasztja alá a történetet?</h2>${button(icon('plus','small')+' Dokumentáció','add-evidence','orange-btn')}</div><div class="grid two"><div>${evidenceList()}</div><div><div class="card"><h3>Cselekvési napló</h3><p class="small muted">Tényleges tevékenységek és megfigyelések, résztvevőnként.</p>${logList()}</div></div></div>`}else content=`<div class="card">${reportBuilder()}<hr class="divider">${button('Végső ellenőrzés és beadás rögzítése '+icon('arrow','small'),'step','orange-btn','data-step="w4-report"')}</div>`;
return`<header class="page-head"><div><div class="eyebrow orange">ACTION WORKSPACE</div><h1>${e(p.name)}</h1><p>A közös projekt egy helyen. A heti feladatokban rögzített döntések és eredmények itt is tovább használhatók.</p></div>${button(icon('plus','small')+' Új projekt','new-independent','secondary')}</header><div class="tab-bar" role="tablist" aria-label="Projektmunkatér">${tabs.map(([v,l])=>`<button role="tab" aria-selected="${ui.tab===v}" class="${ui.tab===v?'active':''}" data-action="work-tab" data-tab="${v}">${l}</button>`).join('')}</div>${content}`}
function portfolioPage(){const p=P(),m=ME(),submitted=[1,2,3,4].filter(w=>m.submissions[w]&&!reflectionChanged(w)).length,groupReady=!!p.groupSubmission&&!reportChanged();return`<header class="page-head"><div><div class="eyebrow orange">SZEMÉLYES TANULÁSI ÚT</div><h1>${e(M().name)} portfóliója.</h1><p>A saját reflexióid, önértékeléseid és rögzített feladataid. Ezek nem olvadnak bele a csoport közös dokumentumába.</p></div>${button(icon('download','small')+' Saját portfólió','export-portfolio','secondary')}</header><div class="total-banner"><div class="big-circle">${submitted+(groupReady?1:0)}/5</div><div><h3>${p.kind==='course'?'Helyben rögzített beadandók':'Megőrzött tanulási eredmények'}</h3><p>Négy egyéni reflexió és egy közös beszámoló. A munkalépések kipipálása nem azonos az oktatói értékeléssel.</p></div></div><div class="grid two"><section class="card"><h2 style="font-size:27px">A saját nézőpontod változása.</h2>${selfComparison()}${m.growthExample?`<div class="quote">${e(m.growthExample)}</div>`:''}</section><section class="card"><h2 style="font-size:27px">A hozzájárulásod a projekthez.</h2><div class="mini-stats"><span><strong>${p.tasks.filter(t=>t.owner===M().id&&t.status==='done').length}</strong> elvégzett feladat</span><span><strong>${p.logs.filter(l=>l.author===M().id).length}</strong> naplóbejegyzés</span><span><strong>${p.evidence.filter(v=>v.author===M().id).length}</strong> dokumentáció</span></div><hr class="divider"><h3>Vállalt szereped</h3><p class="small wrap">${e(m.role||'Még nincs rögzítve.')}</p><h3>A kezdeti támogatási igényed</h3><p class="small wrap">${e(m.needs||'Még nincs rögzítve.')}</p>${button('Saját feladataim','step','small ghost','data-step="w3-do"')}</section></div><div class="section-head"><h2>Négy egyéni feladat.</h2><span class="small muted">${p.kind==='course'?'15% + 15% + 15% + 15%':'Saját reflexiók'}</span></div><div class="assessment-grid">${[1,2,3,4].map(w=>{const sub=m.submissions[w],changed=reflectionChanged(w);return`<article class="assessment-card"><div class="actions" style="justify-content:space-between"><span class="eyebrow">${w}. ${p.kind==='course'?'HÉT':'SZAKASZ'}</span><span class="pill ${sub&&!changed?'group':'plain'}">${sub?changed?'Módosult · új rögzítés kell':'Helyben rögzítve':'Még nincs rögzítve'}</span></div><h3>${WEEKS[w-1].title}</h3>${sub?`<p>${dateTime(sub.at)}</p><details class="learning-block"><summary>Rögzített saját válaszaim</summary><div><p class="wrap">${e(sub.content.a)}</p><p class="wrap">${e(sub.content.b)}</p></div></details>`:'<p>A heti reflexiós feladat végén tudod rögzíteni a saját változatodat.</p>'}${button('Feladat megnyitása '+icon('arrow','small'),'step','small ghost',`data-step="w${w}-reflect"`)}</article>`}).join('')}</div><div class="card" style="margin-top:18px"><div class="actions" style="justify-content:space-between"><h3 style="margin:0">Közös akció és záróbeszámoló ${p.kind==='course'?'· 40%':''}</h3><span class="pill ${groupReady?'group':'plain'}">${p.groupSubmission?groupReady?'Helyben rögzítve':'Az anyag módosult':'Még nincs rögzítve'}</span></div><p class="small muted" style="margin-top:12px">A csoportnak egy közös beadandója van. Minden tag saját egyéni feladatait ettől függetlenül rögzíti.</p><div class="actions">${button('Közös anyag megnyitása','step','small secondary','data-step="w4-report"')}${p.groupSubmission?button('Rögzített változat letöltése','download-submitted','small ghost'):''}</div></div>${p.kind==='course'?`<div class="card" style="margin-top:20px"><h2 style="font-size:26px">A kurzus teljesítési feltételei.</h2><p class="small muted">A feltöltött kurzusterv szerint. Az alábbiak nem automatikusan mért adatok.</p><div class="table-scroll"><table><thead><tr><th>Feltétel</th><th>Kurzusterv</th><th>Ebben a prototípusban</th></tr></thead><tbody><tr><td>Mind a négy hét és minden beadandó</td><td>4 egyéni + 1 csoportos</td><td>Helyi beadási állapotok</td></tr><tr><td>Részvétel</td><td>Legalább 80%, vagy jóváhagyott alternatíva</td><td>Oktatói ellenőrzés szükséges</td></tr><tr><td>Összesített eredmény</td><td>Legalább 70%</td><td>Nincs automatikus pontozás</td></tr><tr><td>Aktív csoportos részvétel</td><td>Kötelező</td><td>A vállalások és naplók támpontok, nem önálló bizonyítékok</td></tr><tr><td>Végső minősítés</td><td>Megfelelt / nem felelt meg</td><td>Az oktató dönt; nincs automatikus tanúsítvány</td></tr></tbody></table></div></div>`:''}`}
function resourcesPage(){const p=P();return`<header class="page-head"><div><div class="eyebrow orange">TANANYAG ÉS KURZUSALAP</div><h1>A forrás és a hozzáadott segédletek.</h1><p>A tanulási keret a feltöltött koncepcióból származik. A digitális kérdések, ellenőrzőlisták és eszközök javasolt megvalósítások.</p></div>${button(icon('plus','small')+' Tananyag hivatkozása','add-resource','secondary')}</header><div class="card"><span class="eyebrow">EREDETI KURZUSCÍM</span><h2 style="font-size:28px;margin-top:12px">Turning Knowledge into Action: Developing Action Competence For Sustainability Through Real-life Actions</h2><p class="small muted">Brief Concept Proposal · Proposed Short Course to be offered by the Faculty of Education</p><div class="mini-stats"><span><strong>4 hét</strong></span><span><strong>~50</strong> tanulási óra</span><span><strong>Legfeljebb 150</strong> résztvevő</span><span><strong>5 fős</strong> csoportok</span></div></div><div class="grid two" style="margin-top:22px">${WEEKS.map(w=>`<section class="card"><span class="eyebrow">WEEK 0${w.n}</span><h3 style="margin-top:10px">${e(w.en)}</h3><p class="small muted">${e(w.personal)}. ${e(w.group)}.</p>${p.resources.filter(r=>+r.week===w.n).map(r=>`<div class="resource">${icon('book')}<div style="flex:1"><a href="${e(safeURL(r.url))}" target="_blank" rel="noopener noreferrer">${e(r.title)}</a><small class="muted">Oktató által megadott forrás</small></div><button class="icon-btn" data-action="delete-resource" data-id="${r.id}" aria-label="Tananyag eltávolítása">${icon('trash','small')}</button></div>`).join('')||'<div class="instructor-notice">Teljes tananyag és olvasmány még nincs megadva. Oktatói feltöltés szükséges.</div>'}</section>`).join('')}</div><div class="card" style="margin-top:22px"><h2 style="font-size:28px">Mi adott, és mi vár véglegesítésre?</h2><details class="learning-block" open><summary>Az Action Pathway pontos lépései</summary><div>A koncepció ötlépéses módszert ír le. A 2. héten az 1–3. lépést, a 3. héten a 4. lépést, az „Act” szakaszt nevezi meg. Az első három lépés pontos címe és instrukciója, illetve az ötödik lépés megnevezése nincs mellékelve. A felület munkalépései nem az eredeti módszer új, hivatalos elnevezései.</div></details><details class="learning-block"><summary>Tananyag, témalista és etikai kvíz</summary><div>A tudományos olvasmányok, a konkrét kihívások listája, az inspiráló példák és a végleges etikai szabályok nincsenek a forrásban. Ezeket nem állítottuk elő hivatalos tananyagként. A mintakérdések, a gyakorlóhelyzetek, a levélsablonok és az elakadáskezelő útvonalak tervezési javaslatok. A három tág témakategória a forrásban szereplő társadalmi, környezeti és gazdasági területhez kapcsolódik; a később említett négy témát a dokumentum nem sorolja fel.</div></details><details class="learning-block"><summary>Óraszámok és értékelés</summary><div>A koncepció körülbelül 50 tanulási órát ír, de a megadott három órakeret 15 + 15 + 15, összesen 45 óra. Ezt nem egészítettük ki feltételezett órákkal. A heti órabeosztást véglegesíteni kell. A forrásban szerepel a megfelelt / nem felelt meg minősítés, az 5 beadandó, a 15–15–15–15–40%-os súlyozás, a 70%-os eredményküszöb és a 80%-os részvételi elvárás. A részletes pontozási rubrika nincs mellékelve. A szoftveres munkalépések nem új hivatalos beadandók.</div></details><details class="learning-block"><summary>Önértékelés és kutatási felhasználás</summary><div>A kezdő és záró önértékelés szerepel a kurzustervben, de a konkrét kérdőív nem. A prototípus három önreflexiós állítása a kurzuscélokhoz illesztett minta, nem validált mérőeszköz. A rendszer nem következtet automatikusan okozati hatásra. Kutatási felhasználás, tájékoztatás, hozzájárulás és jogosultságkezelés nincs ebben a helyi HTML-ben megvalósítva.</div></details></div>`}
function backupPage(){return`<header class="page-head"><div><div class="eyebrow orange">ADATOK ÉS MŰKÖDÉS</div><h1>A munkád maradjon meg.</h1><p>A szöveges adatok a böngésző helyi tárában, a csatolt fájlok külön helyi adatbázisban tárolódnak. A biztos megőrzéshez exportálj mentést.</p></div></header>${storageWarning?notice(e(storageWarning),'error'):''}<div class="grid two"><section class="card"><h2 style="font-size:28px">Teljes biztonsági másolat</h2><p class="small muted">Minden projekt, minden résztvevő adatai, személyes reflexiói és a hozzáférhető helyi fájlok egy JSON-mentésben. A fájl bizalmas személyes tartalmat is tartalmazhat.</p>${button(icon('download','small')+' Teljes mentés exportálása','export-backup','orange-btn')}<div class="spacer"></div><p class="small muted">A másolat visszatöltése az itt tárolt összes projektet lecseréli. Előtte mentsd a jelenlegi állapotot.</p><label class="btn secondary" for="backup-input">${icon('upload','small')} Mentés visszatöltése</label><input id="backup-input" type="file" accept=".json,application/json" class="sr-only"></section><section class="card"><h2 style="font-size:28px">Csak a szükséges rész.</h2><p class="small muted">A közös projektcsomag a közösen látható adatokat tartalmazza, a személyes önértékelések és heti reflexiók nélkül. A saját portfólió csak az aktuális résztvevő tanulási adatait viszi tovább.</p><div class="actions">${button(icon('download','small')+' Közös projektcsomag','export-project','secondary')}${button(icon('download','small')+' Saját portfólió','export-portfolio','secondary')}${button(icon('download','small')+' Beszámoló','download-report','secondary')}</div></section></div><section class="card" style="margin-top:22px"><h2 style="font-size:28px">Mit tud ez a verzió, és mit nem?</h2><div class="table-scroll"><table><tbody><tr><th>Valóban működik</th><td>Vezetett lépések; személyes és közös adatok elkülönítése; nézetváltás; közös akcióterv; feladatok; cselekvési napló; segítségkérő és megosztási szövegvázlat; csatolmányok; helyi beadási pillanatképek; beszámoló- és portfólióexport; új projektek.</td></tr><tr><th>Helyi szimuláció</th><td>A résztvevők ugyanazon böngészőben válthatók. Nincs fiók, valósidejű szerkesztés, csapatszinkron, oktatói hozzáférés-védelem vagy egyetemi beküldés. Másik ember nem látja automatikusan a mentéseidet.</td></tr><tr><th>Nincs automatikus szolgáltatás</th><td>Nincs e-mail-küldés, webes partnerkeresés, AI-hívás, közösségi publikálás, háttérben futó utánkövetés, osztályozás vagy tanúsítványkiállítás.</td></tr><tr><th>Helyi adatvédelem</th><td>A nézetek elválasztása bemutatja a tervezett működést, de nem biztonsági jogosultságkezelés. Ne használjátok éles hallgatói vagy érzékeny adatok kezelésére.</td></tr><tr><th>Megőrzés</th><td>A böngészőadatok törlése, privát mód, másik böngésző, vagy a HTML másik helyre mozgatása a helyi adatok elvesztésével vagy elérhetetlenségével járhat. Mentéssel ugyanaz az állapot másik gépen is visszatölthető.</td></tr><tr><th>Fájllimit</th><td>Egy csatolmány legfeljebb 10 MB; projektenként legfeljebb 30 MB. Nagyobb videóhoz használj saját, megfelelően hozzáférhető hivatkozást. A teljes import legfeljebb 100 MB.</td></tr></tbody></table></div></section><div class="note orange-note"><strong>Új kurzus vagy saját projekt?</strong> Hozz létre külön projektet. A korábbi csapattagokat, személyes válaszokat és csatolmányokat nem másoljuk át. ${button('Új projekt','new-independent','small secondary')}</div>`}

function openDB(){if(!idbPromise)idbPromise=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('A helyi fájladatbázis ebben a böngészőben nem érhető el. Használj szöveges bejegyzést vagy hivatkozást.'));return}const req=indexedDB.open('acthub-workspace-files-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('files',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(new Error('A böngésző nem engedi a helyi fájlmentést.'));});return idbPromise}
async function dbOp(mode,work){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files',mode),store=tx.objectStore('files'),req=work(store);req.onsuccess=()=>{const result=req.result;tx.oncomplete=()=>resolve(result)};req.onerror=()=>reject(req.error);tx.onerror=()=>reject(tx.error)})}
const dbPut=x=>dbOp('readwrite',s=>s.put(x));const dbGet=id=>dbOp('readonly',s=>s.get(id));const dbDelete=id=>dbOp('readwrite',s=>s.delete(id));

async function exportBackup(){save();toast('A helyi mentés összeállítása…');const files=await getFileBundle(state.projects);download(JSON.stringify({format:'acthub-backup',version:1,exported:now(),state,...files}),`ActHub_teljes_mentes_${localDay()}.json`,'application/json');toast(files.missing.length?`A mentés elkészült; ${files.missing.length} korábbi fájl nem volt elérhető. A szöveges adatok benne vannak.`:'A teljes mentés elkészült, a helyi csatolmányokkal együtt.')}
async function exportProject(){const p=P(),bundle=await getFileBundle([p]);const personal=Object.fromEntries(p.members.map(m=>{const x=p.personal[m.id];return[m.id,Object.fromEntries(['category','challenge','challengeWhere','challengeWho','challengeWhy','observation','observationSource','assumption','idea','ideaWhy','ideaContribution','role'].map(k=>[k,x[k]||'']))]}));download(JSON.stringify({format:'acthub-shared-project',version:1,exported:now(),project:{id:p.id,name:p.name,kind:p.kind,mode:p.mode,members:p.members,group:p.group,contributions:personal,tasks:p.tasks,contacts:p.contacts,evidence:p.evidence,logs:p.logs,options:p.options,changes:p.changes,groupSubmission:p.groupSubmission},...bundle},null,2),`ActHub_${fileName(p.name)}_kozos_projekt.json`,'application/json');toast(bundle.missing.length?'A közös csomag elkészült, de néhány helyi csatolmány hiányzott.':'Közös projektcsomag elkészült, személyes reflexiók nélkül.')}
function htmlDocument(title,body,poster=false){return`<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${e(title)} — Act Hub</title><style>*{box-sizing:border-box}body{font:15px/1.7 'Segoe UI',Arial,sans-serif;color:#243e32;background:#f4f4ec;margin:0;padding:45px}main{max-width:${poster?'1000':'850'}px;margin:auto;background:#fffef7;padding:50px;border:1px solid #d8dece;border-radius:15px}header{border-bottom:3px solid #df7544;padding-bottom:24px;margin-bottom:30px}small{letter-spacing:1.5px;font-size:10px;text-transform:uppercase}h1{font:44px/1.15 Georgia,serif;margin:14px 0 20px}h2{font:27px/1.2 Georgia,serif;margin:30px 0 12px}h3{font-size:15px}p{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#345540}article{break-inside:avoid;margin-bottom:20px}section{break-inside:avoid}footer{border-top:1px solid #ddd;padding-top:20px;margin-top:30px;font-size:11px;color:#74816c}.poster-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}.result{background:#e9efdf;padding:20px;border-radius:10px}.meta{color:#7f8976;font-size:12px}.note{font-size:12px;background:#fff0e0;padding:15px;border-radius:8px}@media(max-width:650px){body{padding:15px}main{padding:25px}h1{font-size:32px}.poster-grid{display:block}}@media print{body{background:white;padding:0}main{padding:0;border:0;max-width:none}a{color:inherit}.note{background:none}@page{size:A4;margin:18mm}}</style></head><body><main>${body}</main></body></html>`}
function reportHTML(r,poster=false){const fmt={poster:'Poszter',photo:'Fotókatalógus / képes beszámoló',video:'Videó',interview:'Interjú'}[r.format]||'Beszámoló';return htmlDocument(r.title,`<header><small>ACT HUB · KNOWLEDGE INTO ACTION</small><h1>${e(r.title)}</h1><p>${e(r.summary||'A közös akció beszámolója.')}</p><div class="meta">${e(fmt)} · Exportálva: ${dateStr(now())}</div></header>${poster?'<div class="poster-grid">':''}${[['A probléma',r.problem],['A kívánt változás',r.goal],['Mit tettünk ténylegesen?',r.actual],['Milyen közvetlen eredményt láttunk?',r.result],['Miből tudjuk?',r.support],['Mit nem bizonyít ez?',r.limits],['Mit tanultunk?',r.learning]].map(([l,v],i)=>`<section ${poster&&i===3?'class="result"':''}><h2>${l}</h2><p>${e(v||'Nincs rögzített adat.')}</p></section>`).join('')}${poster?'</div>':''}<section><h2>A csapat hozzájárulása</h2>${r.team.map(m=>`<article><h3>${e(m.name)}${m.place?' · '+e(m.place):''}</h3><p>${m.tasks.map(t=>e(t.title)+' — '+({todo:'még előttünk áll',doing:'folyamatban',blocked:'elakadt',done:'elvégezve'})[t.status]).join('\n')||'Nincs rögzített feladat.'}</p></article>`).join('')}</section><section><h2>A történet dokumentációja</h2>${r.evidence.map(v=>`<article><h3>${e(v.title)}</h3><p>${e(v.note)}</p><div class="meta">${dateStr(v.date)} · ${e(v.permission==='public'?'külső megosztásra egyeztetve':v.permission==='pending'?'egyeztetés szükséges':'csak a projekthez / kurzushoz')}</div>${v.url?`<p><a href="${e(safeURL(v.url))}" rel="noopener noreferrer">Kapcsolódó forrás</a></p>`:''}${v.fileName?`<p class="meta">Csatolt fájl: ${e(v.fileName)}. A fájl a külön projektcsomagban érhető el, nincs ebbe a szöveges exportba ágyazva.</p>`:''}</article>`).join('')||'<p>Nincs rögzített dokumentáció.</p>'}</section>${r.artifactUrl?`<section><h2>A végső anyag</h2><p><a href="${e(safeURL(r.artifactUrl))}" rel="noopener noreferrer">A kész ${e(fmt.toLowerCase())} megnyitása</a></p></section>`:''}<div class="note">Közös projektbeszámoló; személyes önértékelés, heti reflexió és kapcsolattartói adat nélkül. Nyilvános megosztás előtt ellenőrizzétek a benne szereplő anyagok felhasználhatóságát. Ez az export nem jelent egyetemi beküldést vagy tanúsítványt.</div><footer>Act Hub · Turning Knowledge into Action<br>A megfigyelt eredmények nem automatikusan bizonyított hosszú távú hatások.</footer>`,poster)}
function exportPortfolio(){const p=P(),m=ME();const body=`<header><small>ACT HUB · SZEMÉLYES PORTFÓLIÓ</small><h1>${e(M().name)} tanulási útja</h1><p>${e(p.name)}</p><div class="meta">Személyes tartalom · exportálva: ${dateStr(now())}</div></header><section><h2>Indulás és változás</h2>${SCALE.map((q,i)=>`<h3>${e(q)}</h3><p>Kezdéskor: ${e(m['base'+i]||'nincs adat')} / 5\nZáráskor: ${e(m['end'+i]||'nincs adat')} / 5</p>`).join('')}<p>${e(m.growthExample||'Nincs záró tapasztalat rögzítve.')}</p><div class="note">Önreflexiós kérdések, nem validált mérési eredmények vagy érdemjegyek.</div></section>${[1,2,3,4].map(w=>{const sub=m.submissions[w];return`<section><h2>${w}. heti saját reflexió</h2><h3>${e(REFLECTIONS[w][0])}</h3><p>${e(sub?.content.a||m[`ref${w}a`]||'Nincs adat.')}</p><h3>${e(REFLECTIONS[w][1])}</h3><p>${e(sub?.content.b||m[`ref${w}b`]||'Nincs adat.')}</p><p class="meta">${sub?'Helyben rögzített változat: '+dateTime(sub.at):'Még nem rögzített munkaváltozat.'}</p></section>`}).join('')}<section><h2>A saját megvalósításom</h2>${p.logs.filter(l=>l.author===M().id).map(l=>`<article><h3>${dateStr(l.date)}</h3><p>${e(l.action)}</p><p>${e(l.observation)}</p></article>`).join('')||'<p>Nincs naplóbejegyzés.</p>'}</section><footer>Ez a saját tanulási adataid exportja. Nem automatikus értékelés vagy tanúsítvány.</footer>`;download(htmlDocument(M().name+' portfóliója',body),`ActHub_${fileName(M().name)}_portfolio.html`,'text/html');toast('A saját portfólió letöltése elindult.')}
function exportCalendar(){const g=P().group;if(!g.followupDate||!g.nextAction){toast('Előbb add meg a folytatás lépését és a visszatekintés napját.');return}const esc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'),date=g.followupDate.replace(/-/g,''),tomorrow=new Date(g.followupDate+'T12:00:00');tomorrow.setDate(tomorrow.getDate()+1);const end=tomorrow.toISOString().slice(0,10).replace(/-/g,'');download(['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ActHub//Action Workspace//HU','BEGIN:VEVENT','UID:'+uid()+'@acthub-local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+date,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+esc(P().name+' — visszatekintés'),'DESCRIPTION:'+esc(g.nextAction+'\nFelelős: '+memberName(g.nextOwner)+'\nHelyi projektbejegyzés; nincs automatikus meghívó.'),'END:VEVENT','END:VCALENDAR'].join('\r\n'),'ActHub_visszatekintes.ics','text/calendar');toast('Naptárfájl elkészült. Nem küldtünk meghívót vagy értesítést.')}
function checkBackup(raw){if(raw?.format!=='acthub-backup'||raw.version!==1||raw.state?.app!=='acthub-workspace'||!Array.isArray(raw.state.projects)||!raw.state.projects.length||raw.state.projects.length>30)throw Error('Ez nem támogatott Act Hub teljes biztonsági mentés. A közös projektcsomag és a portfólió nem teljes mentés.');const validId=s=>typeof s==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(s);const plain=x=>x&&typeof x==='object'&&!Array.isArray(x);const projects=raw.state.projects.map(p=>{if(!validId(p.id)||!Array.isArray(p.members)||p.members.length<1||p.members.length>20||!plain(p.group)||!plain(p.personal))throw Error('A mentés projektstruktúrája hiányos.');const base=newProject(String(p.name||'Importált projekt'),p.mode==='solo'?'solo':'team',p.kind==='course'?'course':'independent');base.id=p.id;base.created=p.created||now();base.members=p.members.map(m=>{if(!validId(m.id))throw Error('Érvénytelen résztvevő-azonosító.');return{id:m.id,name:String(m.name||'Résztvevő'),place:String(m.place||'')}});base.personal=Object.fromEntries(base.members.map(m=>{const a=plain(p.personal[m.id])?p.personal[m.id]:{};return[m.id,{...a,done:plain(a.done)?a.done:{},submissions:plain(a.submissions)?a.submissions:{}}]}));base.group={...base.group,...p.group};base.groupDone=plain(p.groupDone)?p.groupDone:{};base.approvals=plain(p.approvals)?p.approvals:{};for(const key of ['tasks','contacts','evidence','logs','options','metrics','changes','resources']){if(p[key]&&!Array.isArray(p[key]))throw Error('Érvénytelen lista a mentésben: '+key);base[key]=p[key]||[];if(base[key].length>5000)throw Error('A mentés túl sok bejegyzést tartalmaz.');}for(const key of ['tasks','contacts','evidence','logs','options','resources'])for(const item of base[key]){if(!plain(item)||!validId(item.id))throw Error('Érvénytelen bejegyzés a mentésben.');}base.groupSubmission=plain(p.groupSubmission)&&plain(p.groupSubmission.content)?p.groupSubmission:null;return base});const files=Array.isArray(raw.files)?raw.files:[];if(files.length>1000)throw Error('Túl sok csatolmány a mentésben.');for(const f of files)if(!validId(f.id)||typeof f.data!=='string'||f.data.length>15*1024*1024)throw Error('Egy csatolmány adata sérült vagy túl nagy.');const activeProject=projects.some(p=>p.id===raw.state.activeProject)?raw.state.activeProject:projects[0].id,proj=projects.find(p=>p.id===activeProject),activeMember=proj.members.some(m=>m.id===raw.state.activeMember)?raw.state.activeMember:proj.members[0].id;return{state:{app:'acthub-workspace',version:1,projects,activeProject,activeMember,updated:now()},files};}
async function importBackupFile(file){if(!file)return;if(file.size>100*1024*1024){toast('A mentés nagyobb mint 100 MB; ez meghaladja a prototípus importkorlátját.');return}try{const raw=JSON.parse(await file.text()),valid=checkBackup(raw);showModal('confirm',{title:'A helyi adatok lecserélése?',body:`<p>A mentés <strong>${valid.state.projects.length} projektet</strong> és <strong>${valid.files.length} csatolmányt</strong> tartalmaz. A jelenlegi helyi projektek helyére kerülnek.</p><p class="small muted">A jelenlegi adatokat előbb a teljes mentés exportálásával őrizheted meg. Ez nem összefésülés vagy csapatszinkron.</p>`,label:'Mentés visszatöltése',callback:async()=>{try{for(const f of valid.files){const binary=atob(f.data),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);await dbPut({id:f.id,name:String(f.name||'csatolmany'),type:String(f.type||'application/octet-stream'),blob:new Blob([bytes],{type:String(f.type||'application/octet-stream')})})}}catch(err){toast('A csatolmányok importja nem sikerült. A jelenlegi projektadatokat nem cseréltük le.');return}state=valid.state;save();ui={...ui,page:'home',week:1,step:'w1-start',errors:[]};render();toast('A teljes mentés visszatöltve.')}})}catch(err){toast('Nem tölthető vissza: '+err.message)}}
function inputToState(el){if(!el.dataset.scope)return;const {scope,key,id}=el.dataset;const target=obj(scope,id);if(!target)return;if(el.type==='radio'&&!el.checked)return;target[key]=el.type==='checkbox'?el.checked:el.value;if(scope==='g'&&key==='rules'){for(const person of Object.values(P().personal)){person.agreement=false;delete person.done['w1-ethics']}}if(scope!=='d'){if(ui.page==='week'){const s=currentStep();if(s.type==='individual'&&scope==='i')delete ME().done[s.id];if(s.type==='group'&&['g','p','m'].includes(scope)){delete P().groupDone[s.id];P().approvals[s.id]={}}}queueSave()}}
document.addEventListener('input',ev=>{inputToState(ev.target)});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.id==='project-select'){if(el.value==='__new__'){renderTop();showModal('new-project');return}state.activeProject=el.value;state.activeMember=P().members[0].id;save();go('home');return}if(el.id==='member-select'){state.activeMember=el.value;save();ui.errors=[];render();toast('Most '+M().name+' saját nézetét látod. A közös projekt ugyanaz maradt.');return}if(el.id==='backup-input'){await importBackupFile(el.files[0]);el.value='';return}inputToState(el);if(el.dataset.live){if(ui.modal&&el.dataset.scope==='d')renderModal();else{save();render()}}});
document.addEventListener('submit',ev=>{if(ev.target.id==='modal-form'){ev.preventDefault();modalSubmit()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(ui.modal)closeModal();else if(ui.openSidebar){ui.openSidebar=false;renderSidebar();renderTop()}}if(ev.key==='Tab'&&ui.modal){const focusables=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]', $('.modal'));if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;try{switch(a){
case'nav':go(b.dataset.page);break;
case'week':go('week',{week:b.dataset.week});break;
case'step':go('week',{step:b.dataset.step});break;

case'add-option':showModal('option');break;
case'choose-option':{const option=allOptions().find(o=>o.id===b.dataset.id);if(!option)break;P().group.selectedOption=option.id;if(!P().group.action)P().group.action=option.title;delete P().groupDone['w2-choose'];P().approvals['w2-choose']={};save();render();toast('A választott akció frissült. Nézzétek át a megvalósíthatóságát.');break}
case'vote-option':ME().preferredOption=b.dataset.id;save();render();break;
case'approve':if(validation(b.dataset.step).length){toast('Előbb legyen kitöltött közös eredmény, amiről visszajelezhetsz.');break}P().approvals[b.dataset.step]??={};P().approvals[b.dataset.step][M().id]=b.dataset.value;save();render();toast(b.dataset.value==='yes'?'A saját jóváhagyásod rögzítve.':'Jelezted, hogy erre még visszatérnél.');break;
case'check-quiz':{const correct=ME().quiz1==='b'&&ME().quiz2==='c';$('#quiz-feedback').innerHTML=notice(correct?'Mindkét válasz az időben jelzett akadályt és az egyeztetett közös döntést támogatja.':'Gondold át: az akadály korai jelzése és a különböző nézőpontok közös mérlegelése segíti a vállalható együttműködést.',correct?'':'orange-note');break}
case'add-contact':showModal('contact');break;

case'add-evidence':showModal('evidence');break;

case'delete-evidence':{const id=b.dataset.id,v=P().evidence.find(v=>v.id===id);showModal('confirm',{title:'Eltávolítod ezt a dokumentációt?',body:'<p>A bejegyzés és a helyi csatolmány kikerül a projektből. Korábbi letöltött mentésből továbbra is visszaállítható.</p>',label:'Eltávolítás',callback:async()=>{if(v?.fileId){await dbDelete(v.fileId).catch(()=>{});if(P().group.finalFileId===v.fileId)P().group.finalFileId=''}P().evidence=P().evidence.filter(v=>v.id!==id);save();render();toast('Dokumentáció eltávolítva.')}});break}
case'add-log':showModal('log');break;

case'add-resource':showModal('resource');break;
case'delete-resource':{const id=b.dataset.id;showModal('confirm',{title:'Eltávolítod a tananyag hivatkozását?',body:'<p>A hivatkozás kikerül ebből a helyi projektből. Az eredeti külső tananyag nem változik.</p>',label:'Eltávolítás',callback:()=>{P().resources=P().resources.filter(r=>r.id!==id);save();render();}});break}

case'download-poster':download(reportHTML(reportModel(),true),`ActHub_${fileName(P().name)}_poszter.html`,'text/html');toast('A nyomtatható HTML-poszter elkészült.');break;

case'export-portfolio':exportPortfolio();break;
case'export-backup':await exportBackup();break;

case'export-calendar':exportCalendar();break;
case'build-share':{const p=P(),g=p.group;g.shareDraft=`${p.name}\n\n${g.actualAction||'[Írjátok le a megtörtént akciót.]'}\n\nEzt figyeltük meg: ${g.immediateResult||'[Közvetlen eredmény.]'}\n\nErre támaszkodunk: ${g.resultSupport||'[Megfigyelés vagy dokumentáció.]'}\n\nEzt tanultuk: ${g.learning||'[Közös tanulság.]'}\n\n${g.callToAction||'[Mit kértek az olvasótól?]'}`;save();render();toast('A vázlat a megadott projektadatokból elkészült. Ellenőrizzétek megosztás előtt.');break}

}catch(err){console.error(err);toast('A művelet nem sikerült: '+err.message)}});
