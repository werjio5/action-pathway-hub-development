case'use-help':if(!text(me().helpstep)){toast('ĂŤrd le azt az egy lĂ©pĂ©st, amit most megteszel.');break}me().next=me().helpstep;me().reason=ui.reason;me().status='stuck';delete me().done.now;persist();$('#dialog').close();ui.modal='';go(8);toast('Ez lett a kĂ¶vetkezĹ‘ sajĂˇt lĂ©pĂ©sed.');break;

async function restoreBackup(file){if(!file)return;if(file.size>14000000){toast('A mentĂ©s tĂşl nagy. Legfeljebb 14 MB-os fĂˇjlt tĂ¶lts be.');return}try{const data=JSON.parse(await file.text());if(!validData(data))throw new Error('invalid');if(state.projects.length+data.projects.length>50){toast('A mentĂ©s tĂşl sok projektet tartalmaz ehhez a munkatĂ©rhez.');return}const added=data.projects.map(p=>({...p,id:id(),name:(p.name+' Â· betĂ¶ltĂ¶tt mĂˇsolat').slice(0,200)}));state.projects.push(...added);state.active=added[0].id;persist();$('#dialog').close();ui.modal='';render(true);toast('A mentĂ©s betĂ¶ltve. A korĂˇbbi projektek is megmaradtak.')}catch(e){toast('Ez nem olvashatĂł Act Hub-mentĂ©s. A meglĂ©vĹ‘ adataid vĂˇltozatlanok.')}}
