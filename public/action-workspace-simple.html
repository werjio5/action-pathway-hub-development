let storageOK=true,loadError=false;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(validData(d))return d;loadError=true}}catch(e){storageOK=false;loadError=true}return fresh()}
function validData(d){return d?.app==='acthub-simple'&&d.version===2&&Array.isArray(d.projects)&&d.projects.length>0&&d.projects.length<=50&&d.projects.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&p.name.length<=200&&Array.isArray(p.members)&&p.members.length>0&&p.members.length<=5&&p.members.every(m=>typeof m.name==='string')&&Array.isArray(p.personal)&&p.personal.length===p.members.length&&p.personal.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.done&&typeof x.done==='object'&&Number.isInteger(x.cursor)&&x.cursor>=0&&x.cursor<16)&&p.group&&typeof p.group==='object'&&!Array.isArray(p.group)&&p.done&&typeof p.done==='object'&&Number.isInteger(p.member)&&p.member>=0&&p.member<p.members.length&&Array.isArray(p.group.pictures)&&p.group.pictures.length<=3&&p.group.pictures.every(pic=>typeof pic.data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(pic.data)&&pic.data.length<800000))&&d.projects.some(p=>p.id===d.active)}

function field(scope,key,label,placeholder='',type='textarea',large=false){const value=read(scope,key),fid=`f-${scope}-${key}`;return`<label class="field" for="${fid}"><span>${label}</span>${type==='textarea'?`<textarea id="${fid}" data-scope="${scope}" data-key="${key}" rows="${large?3:2}" class="${large?'large':''}" maxlength="4500" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input id="${fid}" data-scope="${scope}" data-key="${key}" type="${type}" value="${esc(value)}" maxlength="${type==='url'?1500:700}" placeholder="${esc(placeholder)}">`}</label>`}
function check(scope,key,label){return`<label class="check"><input type="checkbox" data-scope="${scope}" data-key="${key}" ${read(scope,key)?'checked':''}><span>${label}</span></label>`}
function scales(prefix){return`<div class="scales">${SCALE.map((t,i)=>`<fieldset class="scale"><legend>${t}</legend><div class="scale-values">${[1,2,3,4,5].map(n=>`<label class="scale-choice"><input type="radio" name="${prefix+i}" value="${n}" data-scope="p" data-key="${prefix+i}" ${Number(read('p',prefix+i))===n?'checked':''} aria-label="${n} az 5-ből"><span>${n}</span></label>`).join('')}</div></fieldset>`).join('')}<div class="scale-ends"><span>1 · Egyáltalán nem</span><span>5 · Teljesen</span></div></div>`}

const btn=(label,action,cls='',attrs='')=>`<button type="button" class="btn ${cls}" data-do="${action}" ${attrs}>${label}</button>`;

case'r2':return`${field('p','r2','A saját tanulságom',reflectionPlaceholders.r2)}<div class="hint">A közös terv megmarad. A harmadik héten már a saját vállalásodból indulunk tovább.</div>`;
case'now':return`${contextQuote(me().commit,'A vállalásod')}${!me().commit?missingLink('Előbb vállalj egy konkrét feladatot.',6):''}${choices('p','status',[['ready','Most kezdem','play'],['stuck','Elakadtam','pause'],['change','Módosítanék','edit'],['done','Megtettem','check']])}${nowBody()}`;
case'pulse':return`${project().solo?'':details('Ki hol tart?',contributions('now'))}${choices('g','status',[['going','Haladunk','arrow'],['blocked','Elakadtunk','pause'],['changed','Módosítunk','edit'],['acted','Megvalósítottuk','check']])}<div style="margin-top:20px">${field('g','next',g().status==='acted'?'Mi történt, és mit rögzítetek róla?':'Mi a közös következő lépés?','Egy feladat, egy felelős, egy időpont.','textarea')}</div>${g().status==='changed'?field('g','revision','Mi változik az akciótervben?','A módosított akció, az új körülményekkel.'):''}${g().status==='blocked'?`<div class="hint">Ne csak azt írjátok le, mi nem működik. Válasszatok egy tisztázható kérdést vagy kisebb lépést.${btn('Segíts tovább','help','small secondary')}</div>`:''}`;
case'evidence':return`${field('g','actual','A tényleges cselekvésünk','Mit tettetek? Mikor, hol és kik vettek részt? Mi maradt el?','textarea',true)}${details('Adj hozzá fotót, linket vagy jegyzetet',field('g','evidence','Mi támasztja alá a történteket?','Például: rövid feljegyzés, résztvevői visszajelzés, saját dokumentáció.')+field('g','link','Kapcsolódó anyag linkje <small>· nem kötelező</small>','https://…','url')+`<label class="file-btn">${icon('camera')} Fotó hozzáadása<input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp"></label><div id="pictures">${picturesHTML()}</div><p class="tiny muted">Legfeljebb 3 kép. Kicsinyítve, ezen a böngészőn belül mentjük. Csak olyan képet adj hozzá, amelyhez megvan a szükséges engedély; ne rögzíts felesleges személyes adatot.</p>`)}`;
case'r3':return`${field('p','r3','A saját tapasztalatom',reflectionPlaceholders.r3)}<div class="hint">Az őszinte beszámoló többet ér, mint egy szebbre írt eredmény. Azt is mondd el, amit legközelebb másképp csinálnál.</div>`;
case'result':return`${contextQuote(g().actual,'Ezt tettétek meg')}${!g().actual?missingLink('Előbb rögzítsétek, mi történt ténylegesen.',10):''}${field('g','result','Ezt a közvetlen eredményt tapasztaltuk','Mi változott? Mi alapján állítjátok ezt? Ha még nem látható, azt írjátok le.','textarea',true)}${field('g','limits','Ezt még nem tudjuk <small>· nem kötelező</small>','Milyen hatást nem lehet még megállapítani?','text')}`;
case'after':return`${scales('a')}${details('Nézd meg, honnan indultál',`<p class="tiny">${SCALE.map((x,i)=>`${esc(x)} <strong>${me()['b'+i]||'—'}/5</strong>`).join('<br><br>')}</p><p class="tiny" style="margin-top:12px">Ezek önértékelések, nem igazolt hatásmérések. Nem kötelező, hogy a záró értékeid magasabbak legyenek.</p>`)}<div style="margin-top:23px">${field('p','r4','Mit tanultál, és hol használnád legközelebb?','Egy konkrét tapasztalat és egy következő helyzet, ahol ezt használhatnád.')}</div>${details('Rövid visszajelzés a kurzusról',field('p','feedback','Mi segített, és min változtatnál? <small>· nem kötelező</small>','Mi tette könnyebbé vagy nehezebbé a cselekvést?'))}`;
case'story':return storyBody();
case'finish':return finishBody();
}}
function exampleConcern(){return({'Környezetünk':'A kollégium közös helyiségeiben üresen is égnek a lámpák.','Közösségünk':'Az új hallgatók közül sokan nem tudják, kihez fordulhatnak segítségért.','Erőforrásaink':'Sok használható holmi kerül a kukába a kollégiumban.','Más ügy':'A környékbeli közösségi programokhoz nehéz megtalálni a hozzáférhető információkat.'})[me().topic]||'Sok használható holmi kerül a kukába a kollégiumban.'}
function ethicsFeedback(){return me().ethics==='ask'?'Először tisztázd a helyzetét, és egyeztessetek egy vállalható hozzájárulást.':me().ethics==='replace'?'Rövid távon gyorsnak tűnhet, de előbb kérdezd meg, miért akadt el. A feladatokat egyeztetve osszátok újra.':''}
function missingLink(msg,index){return`<div class="hint warning">${msg}<br><button class="subtle" data-do="go" data-index="${index}">Vissza ehhez a lépéshez ${icon('arrow')}</button></div>`}
function nowBody(){const s=me().status;if(!s)return`<p class="tiny muted" style="margin-top:16px">Válassz egy állapotot. Innen a neked szükséges segítséggel folytatjuk.</p>`;if(s==='stuck')return`${obstacle()}${field('p','next','Mi az az egy lépés, amit most megteszel?','A segítség alapján válassz egy konkrét következő lépést.')}`;if(s==='change')return`<div class="hint"><strong>A tervet szabad módosítani.</strong><p>Mi a kisebb vagy másképp megvalósítható változat? Írd le, és egyeztesd a csapattal. A közös tervet a következő oldalon tudjátok frissíteni.</p></div>${field('p','next','Ezt javaslom helyette','A saját következő feladatom így változna…')}`;if(s==='done')return`<div class="completed">Akkor most őrizzük meg, ami a valóságban történt.</div>${field('p','next','Ezt tettem meg','Röviden: mi történt, és mit tapasztaltál?')}`;return`<div class="hint"><strong>Most lépj ki a tervezésből.</strong><p>Végezd el a vállalt feladatot. Amikor visszatérsz, itt jelezheted, mi történt — vagy miben kérsz segítséget.</p></div>${field('p','next','Ezzel kezdem','Mi az első kézzelfogható teendőd?','text')}`}
function feasibility(){const missing=[];if(text(g().action).length<12)missing.push('Fogalmazzátok meg egy konkrét igével, mit fogtok tenni.');if(!text(g().place))missing.push('Válasszátok ki a helyszínt vagy a helyi megvalósítások keretét.');if(!text(g().when))missing.push('Adjatok időpontot: mikorra történjen meg?');return`<div class="hint"><strong>${missing.length?'Ezt még érdemes pontosítani:':'A cselekvés, a hely és az idő már látszik.'}</strong><p>${missing.length?missing.join('<br>'):'Most ti ellenőrizzétek: rendelkezésre áll a segítség, a kapacitás és a szükséges engedély? Mi az a kisebb változat, amit akkor is meg tudtok tenni, ha valami elmarad?'}</p><p class="tiny">Ez formai segítség, nem automatikus szakmai vagy biztonsági jóváhagyás.</p></div>`}
function picturesHTML(){return`<div class="picture-strip">${g().pictures.map((pic,i)=>`<div class="picture-wrap"><img src="${esc(pic.data)}" alt="${esc(pic.name||'Az akció dokumentációja')}"><button data-do="remove-photo" data-index="${i}" aria-label="${i+1}. kép eltávolítása">×</button></div>`).join('')}</div>`}
const FORMAT={poster:'Poszter',photos:'Fotós beszámoló',video:'Videóvázlat',interview:'Interjúvázlat'};
function storyParts(){const v=g();const basics=[['Miért indultunk el?',v.challenge],['Mit tettünk?',v.actual],['Mit tapasztaltunk?',v.result],['Mire támaszkodunk?',v.evidence],['Mit nem tudunk még?',v.limits]];if(v.format==='video')return[['01 · A helyzet',v.challenge],['02 · A cselekvés képei',v.actual],['03 · Az eredmény és annak alapja',[v.result,v.evidence].filter(Boolean).join('\n')],['04 · Amit még nem tudunk',v.limits]];if(v.format==='interview')return[['Milyen problémával foglalkoztatok?',v.challenge],['Mit csináltatok ténylegesen?',v.actual],['Mi változott, és honnan tudjátok?', [v.result,v.evidence].filter(Boolean).join('\n')],['Mit érdemes még utánanézni?',v.limits]];return basics}
function reportMissing(){const fields=[['challenge','közös ügy',2],['actual','tényleges cselekvés',10],['result','eredmény és annak alapja',12]];return fields.filter(([k])=>!text(g()[k]))}
function storyBody(){const missing=reportMissing();return`${field('g','title','A történet címe <small>· nem kötelező</small>',g().action||'A mi megtehető lépésünk','text')}<div class="chips" aria-label="A beszámoló formája">${Object.entries(FORMAT).map(([k,n])=>`<button class="chip ${(g().format||'poster')===k?'selected':''}" data-do="format" data-value="${k}" aria-pressed="${g().format===k}">${n}</button>`).join('')}</div>${missing.length?`<div class="report-missing">Ehhez még hiányzik: ${missing.map(x=>`<button class="subtle" data-do="go" data-index="${x[2]}">${x[1]}</button>`).join(', ')}.</div>`:''}<div class="story-preview"><span class="eyebrow">${project().demo?'Minta · ':''}${['video','interview'].includes(g().format)?'Szerkeszthető szövegvázlat':'A mentett válaszaitokból'}</span><h3 id="story-title" style="margin-top:10px">${esc(g().title||g().action||'A mi megtehető lépésünk')}</h3>${storyParts().filter(([,v],i)=>v||i<3).map(([h,v])=>`<h4>${h}</h4><p>${v?esc(v):'<span class="placeholder">Ezt még rögzítsétek az előző lépésekben.</span>'}</p>`).join('')}${g().format==='photos'?picturesHTML():''}</div><div style="margin-top:16px">${btn(icon('download')+' Beszámoló mentése','report','secondary small')}</div><p class="tiny muted" style="margin-top:9px">${['video','interview'].includes(g().format)?'A vázlat nem kész videó vagy rögzített interjú. A végső anyagot a választott formában készítsétek el.':'A letölthető beszámoló önálló HTML-fájl. A végső formát az oktatói útmutató szerint alakítsátok ki.'}</p>${check('g','reviewed','Átnéztük: a beszámoló a tényleges cselekvést és a tapasztalatainkat mutatja be.')}${details('Szeretnétek másoknak is megmutatni?',field('g','audience','Kinek lehet hasznos a történetetek? <small>· nem kötelező</small>','Kik tudnák továbbvinni vagy használni?','text')+check('g','share','Szeretnénk később megfontolni az ActHub-felületen való megosztást.')+`<p class="tiny">Teljesen választható. Ez csak a szándék rögzítése: semmit nem küldünk el vagy teszünk közzé. A nyilvános megosztást a csapattal és az érintettekkel külön kell egyeztetni.</p>`)}`}
function finishBody(){const missing=STEPS.filter(s=>s.id!=='finish'&&!done(s));return`<div class="completed"><strong>${missing.length?'Itt tart most a munkátok.':'A saját és közös munkalépéseid rögzítve vannak.'}</strong><br>${missing.length?'A mentett válaszok megmaradnak. Az alábbiak segítenek megtalálni, ami még hiányzik.':'Nem üres lapról, hanem egy végigvitt folyamat tapasztalatával indulhatsz tovább.'}</div>${[1,2,3,4].map((w,i)=>{const k=w===4?'after':'r'+w;const ok=me().done[k];return`<div class="fin-check"><span>${icon(ok?'check':'circle')} ${w}. heti saját reflexió</span><button data-do="go" data-index="${w===4?13:(w*4-1)}">${ok?'Megnézem':'Pótolom'}</button></div>`}).join('')}<div class="fin-check"><span>${icon(project().done.story?'check':'circle')} Közös beszámoló</span><button data-do="go" data-index="14">${project().done.story?'Megnézem':'Összeállítom'}</button></div>${missing.filter(s=>!['r1','r2','r3','after','story'].includes(s.id)).length?details('A folyamatban még nyitva maradt',missing.filter(s=>!['r1','r2','r3','after','story'].includes(s.id)).map(s=>`<div class="fin-check"><span>${s.week}. hét · ${s.name}</span><button data-do="go" data-index="${STEPS.indexOf(s)}">Megnyitom</button></div>`).join('')):''}<div style="display:flex;gap:10px;flex-wrap:wrap;margin:22px 0">${btn(icon('download')+' Saját jegyzeteim','personal','small secondary')}${btn(icon('download')+' Közös beszámoló','report','small secondary')}</div><p class="tiny muted">A helyi mentés nem beküldés vagy kurzusteljesítési igazolás. Az értékelést és a beadást az egyetem kezeli.</p>${details('Ezt az ügyet vinnénk tovább',field('g','followup','A következő akciónk','Egy lépés, egy felelős, egy következő egyeztetés.'))}<div style="margin-top:25px">${btn('Egy új ügyön dolgoznék '+icon('arrow'),'new','green')}</div><p class="tiny muted" style="margin-top:11px">A régi projekt megmarad. Az újban ugyanezek az eszközök vezetnek végig.</p>`}
function noteHTML(){const p=project(),v=g(),isPersonal=current().role==='p';const ownDraft=!v.challenge&&!!me().concern;const title=v.challenge||me().concern||'Egy változás, ami neked fontos.';const rows=[['flag',v.action?'A választott akció':'A megtehető akció',v.action,'Ezt együtt találjuk meg.'],['arrow',isPersonal&&me().commit?'A te következő lépésed':'A következő lépés',isPersonal?(me().status==='done'?g().next:me().next)||me().commit||v.next:v.next||me().commit,'Egyszerre csak egy feladat.'],['check','Amit tapasztaltatok',v.result||v.actual,'A valóságban derül ki.']];return`<div class="note-card"><div class="note-top"><div class="eyebrow">${ownDraft?'A saját kiindulópontod':p.solo?'Az akciód':'A közös akciótok'}</div><div class="flourish">${icon('spark')}</div><h2 class="note-title">${esc(title.length>210?title.slice(0,207)+'…':title)}</h2>${p.demo?'<span class="demo-tag">MINTAADAT · Nem valódi eredmény</span>':''}</div><div class="note-body">${rows.map(([i,label,value,empty])=>`<div class="note-row ${value?'filled':''}">${icon(i)}<div><small>${label}</small><p class="${value?'':'placeholder'}">${esc(value?String(value).slice(0,220)+(String(value).length>220?'…':''):empty)}</p></div></div>`).join('')}</div><div class="note-footer">${icon('leaf')} ${v.actual?'Már van mire visszanéznetek.':v.action?'A terv már alakul. Most tegyétek meg.':v.challenge?'Megvan az ügy. Innen építkezünk.':'A válaszaidból fokozatosan összeáll.'}</div><button class="note-edit" data-do="overview">Megnézem az egész akciót ${icon('arrow')}</button></div><p class="note-caption">${current().week<3?'Nem kell mindent előre tudnod.<br>Csak a következő lépést találjuk meg.':'A terv változhat.<br>A tapasztalatod megmarad.'}</p>`}
function renderNote(){const el=$('#note');if(el)el.innerHTML=noteHTML();const title=g().action?'A tervetek alakul':g().challenge?'Megvan a közös ügy':'Itt alakul az akciód';$('#mobile-note').innerHTML=`<div><strong>${project().solo?'A saját akciód':title}</strong><small>${storageOK?'A válaszaid mentve ezen az eszközön.':'A mentés nem sikerült. Készíts biztonsági másolatot.'}</small></div><button data-do="note">Megnézem ${icon('arrow')}</button>`}
function renderHeader(){const p=project();$('#header').innerHTML=`<div class="top"><div class="brand" aria-label="Act Hub"><svg viewBox="0 0 40 44" fill="none" aria-hidden="true"><path d="M4 38 17 6h7l13 32H26l-6-17-6 17Z" fill="#244b3c"/><path d="M17 39c1-7 9-9 6-15-2-4-4-7-2-12" stroke="#e46c3b" stroke-width="4.5" stroke-linecap="round"/><circle cx="6" cy="6" r="2.7" fill="#e46c3b"/></svg><span class="word">Act Hub</span><span class="brand-label">${p.course?'ACTION LAB':'ACTION WORKSPACE'}</span></div><div class="top-right"><span class="save" id="save" role="status">Mentve itt</span><button class="top-btn" data-do="projects">Akcióim</button><button class="top-btn profile" data-do="team" aria-label="Résztvevő és csapat: ${esc(member().name)}"><span class="avatar">${esc(member().name.slice(0,1).toUpperCase())}</span><span class="profile-name">${esc(member().name.length>15?member().name.slice(0,15)+'…':member().name)}</span></button></div></div>`;paintSave()}
function renderWeeks(){const p=project(),s=current();$('#weeks').innerHTML=WEEK_NAMES.map((n,i)=>{const w=i+1,all=STEPS.filter(x=>x.week===w&&x.id!=='finish').every(done);return`<button class="week ${s.week===w?'active':''} ${all?'done':''}" data-do="week" data-week="${w}" ${s.week===w?'aria-current="step"':''}><span class="week-num">${all?icon('check'):'0'+w}</span><span><small>${p.course?w+'. hét':w+'. szakasz'}</small><strong>${p.solo?WEEK_SOLO[i]:n}</strong></span></button>`}).join('')}
function soloText(str){if(!project().solo)return str;return str.replaceAll('közösen','önállóan').replaceAll('közös ügyből','saját ügyből').replaceAll('közös ügyet választotok','konkrét ügyet választasz').replaceAll('a csapat helyett, hanem ','').replaceAll('A közös terv','A terved').replaceAll('Beszéljétek meg, mi fontos nektek. Egyikőtök rögzítse azt a konkrét problémát, amelyen önállóan dolgoztok.','Pontosítsd, mi a probléma és kit érint. Ezt az ügyet viszed majd végig.').replaceAll('Melyik ügyet viszitek tovább?','Melyik ügyet viszed tovább?').replaceAll('Mi az az egy dolog, amit megtesztek?','Mi az az egy dolog, amit megteszel?').replaceAll('Vessétek össze az ötleteket, és válasszatok egyet. Olyat, amit a következő héten valóban végre tudtok hajtani.','Válassz egy érdemi, megvalósítható akciót. Nem kell egy egész problémát egyszerre megoldanod.').replaceAll('Ez a ti történetetek.','Ez a te történeted.').replaceAll('válaszaitokból','válaszaidból').replaceAll('beszámolótok','beszámolód')}
function render(animate=false){const s=current(),p=project();renderHeader();renderWeeks();const role=s.role==='g'&&!p.solo?'Közösen':'Először te';const roleLabel=s.id.startsWith('r')||s.id==='after'?'Saját reflexió':s.id==='finish'?'A következő ügyed':role;$('#main').innerHTML=`<section class="focus ${animate?'animate':''}" id="focus" aria-labelledby="step-title" tabindex="-1"><div class="micro"><span>${s.week}. ${p.course?'hét':'szakasz'}</span><span class="role ${s.role==='g'&&!p.solo?'group':''}">${icon(s.role==='g'&&!p.solo?'team':'user')}${roleLabel}</span><div class="mini-steps" aria-label="A hét munkalépései">${STEPS.filter(x=>x.week===s.week).map(x=>`<button class="mini-step ${x.id===s.id?'active':''} ${done(x)?'done':''}" data-do="go" data-index="${STEPS.indexOf(x)}" title="${x.name}" aria-label="${x.name}${done(x)?' — mentve':''}" ${x.id===s.id?'aria-current="step"':''}></button>`).join('')}</div></div>${s.id==='finish'?`<div class="end-mark">${icon('leaf')}</div>`:''}<h1 id="step-title">${s.id==='finish'&&!project().done.evidence?'Innen folytathatod. Nem kell újrakezdened.':copyFor(s,'title')}</h1><p class="lead">${copyFor(s,'lead')}</p><div class="work">${body(s)}</div><div id="error" class="${ui.error?'error':'hidden'}" role="alert">${esc(ui.error)}</div>${s.id==='finish'?'':`<div class="actions"><button class="back" data-do="back" ${me().cursor===0?'disabled':''}>${icon('back')} Vissza</button>${btn(copyFor(s,'next')+' '+icon('arrow'),'next')}</div><p class="next-note">${copyFor(s,'hint')}</p>`}<div id="mobile-note" class="mobile-note"></div><div class="utility"><button data-do="help">${icon('help')} Segíts tovább</button><button data-do="learning">${icon('book')} A hét tanulnivalója</button></div></section><aside id="note" aria-label="Az akciótok alakuló összefoglalója"></aside>`;renderNote();if(animate){window.scrollTo({top:0,behavior:'instant'});$('#focus').focus({preventScroll:true})}}
function validate(s){const m=me(),v=g();const needed=(arr,ob)=>arr.every(k=>text(ob[k]));switch(s.id){case'care':return text(m.concern)?'':'Írj egy mondatot arról, min szeretnél változtatni.';case'before':return[0,1,2].every(i=>Number(m['b'+i])>=1&&Number(m['b'+i])<=5)?'':'Jelöld mindhárom állításnál, honnan indulsz.';case'team':return text(v.challenge)?'':'Fogalmazzátok meg egy mondatban a közös ügyet.';case'r1':return !text(m.r1)?'Írd le a saját gondolatodat. Egy-két mondat elég.':!m.rules?'Jelezd, hogy vállalod a közös munka alapjait.':'';case'idea':return !text(v.challenge)?'Előbb válasszatok közös ügyet az első héten.':needed(['idea','observation'],m)?'':'Írd le a megfigyelésedet és azt, mit javasolnál.';case'plan':return needed(['action','place','when'],v)?'':'Az akció, a helyszín és az időpont együtt lesz megtehető terv. Töltsd ki, ami még hiányzik.';case'commit':return !text(v.action)?'Előbb válasszatok egy közös akciót.':needed(['commit','due'],m)?'':'Írd le, mit vállalsz, és mikorra.';case'r2':case'r3':return text(m[s.id])?'':'Ments el legalább egy saját tanulságot.';case'now':return !text(m.commit)?'Előbb vállalj egy konkrét feladatot a második héten.':m.status&&text(m.next)?'':'Válassz állapotot, és írd le a tényleges vagy következő lépésedet.';case'pulse':return !v.status||!text(v.next)?'Válasszatok állapotot, és rögzítsetek egy közös következő lépést.':v.status==='changed'&&!text(v.revision)?'Írjátok le, hogyan módosítjátok a tervet.':'';case'evidence':return !text(v.actual)?'Írjátok le, mi történt valóban. A részleges megvalósítást is lehet rögzíteni.':v.link&&!safeURL(v.link)?'A kapcsolódó link http:// vagy https:// kezdetű legyen.':'';case'result':return !text(v.actual)?'Előbb rögzítsétek a tényleges cselekvést a harmadik héten.':text(v.result)?'':'Írjátok le az eredményt és annak alapját — vagy azt, hogy még nem látható változás.';case'after':return ![0,1,2].every(i=>Number(m['a'+i])>=1&&Number(m['a'+i])<=5)?'Válaszolj a három önértékelő kérdésre.':text(m.r4)?'':'Fogalmazz meg egy saját tanulságot és egy későbbi felhasználási lehetőséget.';case'story':return reportMissing().length?'Pótoljátok a jelzett részeket, mielőtt lezárjátok a beszámolót.':!v.reviewed?'Előbb nézzétek át, és jelöljétek, hogy a beszámoló megfelel a tapasztalataitoknak.':'';default:return''}}
function go(index){persist();me().cursor=Math.max(0,Math.min(STEPS.length-1,index));ui={...ui,error:'',help:false,example:false,feasibility:false};persist();render(true)}
function next(){const s=current();const error=validate(s);if(error){ui.error=error;$('#error').textContent=error;$('#error').classList.remove('hidden');$('#error').scrollIntoView({block:'nearest',behavior:'smooth'});return}if(s.role==='g')project().done[s.id]=new Date().toISOString();else me().done[s.id]=new Date().toISOString();if(s.id==='pulse'&&g().status==='changed')g().action=g().revision;const n=me().cursor+1;persist();if(s.id==='r1'||s.id==='r2'||s.id==='r3'){const w=s.week;toast(`${w}. heti saját reflexiód elmentve. Folytatjuk a következő héttel.`)}else if(s.id==='care'||s.id==='idea'||s.id==='commit')toast(project().solo?'Elmentve a projektedhez.':'A hozzájárulásod megjelent a közös munkában.');else if(s.id==='now'&&me().status==='ready')toast('Az állapotod elmentve. Az akció még előtted van.');go(n)}
function setField(scope,key,value){if(!['p','g'].includes(scope)||!/^[a-z][a-z0-9]*$/i.test(key)||['constructor','prototype','__proto__'].includes(key))return;scopes[scope]()[key]=value;const s=current();if(s.role===scope){if(scope==='g')delete project().done[s.id];else delete me().done[s.id]}if(scope==='g'&&['challenge','action','actual','result','evidence','limits','link','revision','title','format'].includes(key)){g().reviewed=false;delete project().done.story;const reviewed=document.querySelector('input[data-key="reviewed"]');if(reviewed)reviewed.checked=false}if(scope==='g'&&key==='title'&&document.querySelector('#story-title'))document.querySelector('#story-title').textContent=value||g().action||'A mi megtehető lépésünk';queueSave();renderNote();if(ui.error){ui.error='';$('#error')?.classList.add('hidden')}}
function openDialog(type,title,content){ui.modal=type;const d=$('#dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="close" data-do="close" aria-label="Bezárás">${icon('close')}</button></div><div class="dialog-content">${content}</div>`;if(!d.open)d.showModal()}
function closeDialog(){persist();$('#dialog').close();ui.modal='';render()}
function openTeam(){const p=project();openDialog('team',p.solo?'A saját projekted':'Egy csapat. Közös akció.',`<p>${p.solo?'Önállóan dolgozol. Minden gondolat és lépés ehhez a projekthez tartozik.':'Egyénileg gondolkodtok, közösen döntötök. A közös válaszokat egyszer mentitek el; a saját reflexió mindenkinél külön marad.'}</p><div class="people">${p.members.map((m,i)=>`<div class="person"><span class="avatar">${i+1}</span><input type="text" data-member="${i}" value="${esc(m.name)}" aria-label="${i+1}. résztvevő neve" maxlength="50">${btn(p.member===i?'Saját nézet':'Váltok','member','small '+(p.member===i?'green':'secondary'),`data-index="${i}"`)}</div>`).join('')}</div><div class="hint"><strong>Helyi próbamód.</strong><p>A résztvevőváltó ugyanabban a böngészőben mutatja a külön nézeteket. Nincs élő csoportszinkron, belépés vagy hozzáférésvédelem. A saját reflexiók nem kerülnek a közös beszámolóba, de ebben a fájlban a váltóval elérhetők.</p></div>`)}
function openProjects(){const p=project();openDialog('projects','A megtehető akcióid',`<p>Itt mindegyik ügyed megmarad. Egy új projekt ugyanígy vezet végig — kurzuson kívül is.</p>${state.projects.map(x=>`<button class="project-row ${x.id===p.id?'current':''}" data-do="switch-project" data-id="${esc(x.id)}"><span>${esc(x.name)}<small>${x.demo?'Kitalált minta · ':''}${x.course?'4 hetes kurzus':x.solo?'Saját akció':'Csapatprojekt'}</small></span>${icon(x.id===p.id?'check':'arrow')}</button>`).join('')}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">${btn(icon('plus')+' Új akció','new','green small')}${btn('Egy példa kipróbálása','demo','secondary small')}</div>${details('Biztonsági másolat és átvitel',`<p class="tiny">A böngésző adatainak törlése a helyi mentést is törölheti. A biztonsági másolat minden projektet, résztvevőt, személyes reflexiót és hozzáadott képet tartalmaz; ne oszd meg ellenőrzés nélkül.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:13px">${btn('Mentés fájlba','backup','small secondary')}${btn('Mentés betöltése','restore','small secondary')}</div><p class="tiny" style="margin-top:10px">Betöltéskor a meglévő projektek megmaradnak. A betöltött másolatokat külön projektként adjuk hozzá.</p>`)}`)}
function openNew(){openDialog('new','Melyik ügy jön most?',`<p>A korábbi munkád megmarad. Adj nevet az új projektnek, és induljunk az első kérdéssel.</p><label class="field"><span>Az új projekt neve</span><input id="new-name" maxlength="90" placeholder="Például: Jobb közösségi élet a kollégiumban"></label><label class="field"><span>Hogyan dolgozol?</span><select id="new-mode"><option value="solo">Egyénileg · saját akció</option><option value="team">Csapattal · közös akció</option><option value="course">Új négyhetes kurzusprojekt</option></select></label>${btn('Kezdjük az első lépéssel '+icon('arrow'),'create','green')}<p id="new-error" class="tiny" role="alert" style="margin-top:12px"></p>`)}
function openOverview(){const v=g();openDialog('overview',project().solo?'A saját akciód':'Egyben az akciótok',`<p class="tiny muted">Csak az kerül ide, amit már megfogalmaztatok. Bármelyik részt visszanyithatod.</p>${[['Ezen változtatunk',v.challenge,2],['Ezt tesszük',v.action,5],['Itt és ekkor',[v.place,v.when].filter(Boolean).join(' · '),5],['Következő közös lépés',v.next,9],['Ez történt',v.actual,10],['Ezt tapasztaltuk',v.result,12]].map(([h,value,i])=>`<div style="padding:16px 0;border-bottom:1px solid var(--line)"><div class="eyebrow" style="margin-bottom:7px">${h}</div><p style="font-size:14px;white-space:pre-wrap">${value?esc(value):'<span class="muted">Ezt még nem rögzítettétek.</span>'}</p><button class="subtle" data-do="modal-go" data-index="${i}">Pontosítom</button></div>`).join('')}${details('Személyes vállalások a közös tervben',contributions('commit'))}<div style="margin-top:20px">${btn(icon('download')+' Akcióterv mentése','plan-export','small secondary')}</div>`)}
function openHelp(){const s=current();let content;if(s.week===3){content=`<p>Nem kell egyedül kitalálnod, hogyan tovább. Válaszd ki, mi hiányzik most.</p><div class="choices">${Object.entries(HELP).map(([k,v])=>`<button class="choice" data-do="help-route" data-value="${k}">${icon(k==='team'?'team':k==='reply'?'mail':'help')}${v.name}</button>`).join('')}</div>`}else{const tips={care:['Gondolj egy valódi pillanatra.','Mi volt az a helyzet a saját környezetedben, amikor azt gondoltad: ennek nem kellene így lennie? Kinek lenne jobb, ha ez megváltozna?'],before:['Nem azt jelölöd, milyen szeretnél lenni.','A mostani érzésedből indulj ki. Az alacsony érték nem hiba, a magas nem ígéret. A válaszaid segítenek majd visszanézni.'],team:['Egy ügyet válasszatok, ne mindent egyszerre.','Nézzétek meg a saját hozzájárulásokat. Melyik probléma fontos a csapatnak, és melyikkel tudtok a kurzus keretei között érdemben foglalkozni?'],idea:['Egy mondat egy igével.','Mit változtatnál meg, kivel egyeztetnél, mit szerveznél meg? A javaslat lehet kicsi. A következő oldalon együtt mérlegelitek, megtehető-e.'],plan:['A probléma nagy lehet. Az akció legyen behatárolt.','Mit csináltok, hol, mikorra? Kerüljetek egy lépéssel közelebb a kívánt változáshoz. Ellenőrizzétek a segítséget, engedélyt és a csapat kapacitását.'],commit:['A „segítek” helyett konkrét feladatot.','Olyan vállalást írj, amelynél egyértelmű lesz, mikor végeztél. Például nem „kommunikáció”, hanem „megírom és egyeztetem a résztvevők tájékoztatóját”.'],result:['A tevékenység nem ugyanaz, mint a hatás.','A „megtartottunk egy alkalmat” cselekvés. Hogy mi változott a résztvevőknél, az külön kérdés, amit visszajelzés vagy más adat támaszthat alá. A bizonytalanságot is írjátok le.'],story:['A történet már benne van a munkátokban.','Nézzétek át az összegyűjtött szöveget. A hiányzó részt a megfelelő korábbi lépésben pótoljátok. A formátum segédlet; a beadandót az oktatói útmutatóhoz igazítsátok.']};const t=tips[s.id]||['Egy konkrét tapasztalatból indulj.','Mit tettél vagy gondoltál másképp, mint az elején? Mi segített, mi okozott nehézséget, és ezt hogyan használnád egy másik helyzetben? Egy-két saját mondat elég.'];content=`<div class="hint" style="margin-top:0"><strong>${t[0]}</strong><p>${t[1]}</p></div>${['idea','plan'].includes(s.id)?btn('Vezess el egy konkrét lépésig','shape','green small'):btn('Visszatérek a saját lépésemhez','close','green small')}`};openDialog('help','Találjuk meg a következő lépést.',content)}
function openRoute(reason){const h=HELP[reason]||HELP.time;ui.reason=reason;openDialog('route',h.title,`<p>${h.body}</p>${field('p','helpstep','Ezt fogom most megtenni',h.prompt)}${btn('Legyen ez a következő lépésem '+icon('arrow'),'use-help','green small')}${reason==='reply'?`<div style="margin-top:15px">${btn('Segíts megírni a megkeresést','support','secondary small')}</div>`:''}`)}
function requestText(){const m=me(),p=project();return`Kedves ${m.contact||'[kapcsolattartó]'}!\n\n${p.solo?'Egy kezdeményezésen dolgozom':'Egy hallgatói kezdeményezésen dolgozunk'}: ${g().action||g().challenge||'[az akció rövid leírása]'}.\n\nEbben kérjük a segítségét: ${m.ask||'[egy konkrét kérés]'}.\n${m.replyby?'Eddig lenne hasznos visszajelzést kapnunk: '+m.replyby+'.\n':''}\nMeg tudná írni, hogy ebben tud-e segíteni, vagy kihez érdemes fordulnunk?\n\nKöszönettel:\n${member().name}`}
function openSupport(){openDialog('support','Egy kérés, amire lehet válaszolni.',`<p>Először fogalmazd meg, kitől milyen konkrét segítség kell. Ellenőrzött elérhetőséget a szervezet hivatalos oldalán keress.</p>${field('p','contact','Kit keresel?','Személy, szerepkör vagy szervezet','text')}${field('p','ask','Pontosan mit kérsz?','Egy engedélyt, egy időpontot, egy információt…')}${field('p','replyby','Meddig lenne hasznos a válasz? <small>· nem kötelező</small>','','date')}<details class="quiet-details" open><summary>A megkeresés vázlata</summary><div class="details-body"><textarea id="request-preview" readonly rows="9" aria-label="A megkeresés szövege">${esc(requestText())}</textarea><div style="margin-top:12px">${btn(icon('copy')+' Szöveg másolása','copy-request','small secondary')}</div></div></details><p class="tiny muted">A szöveget a saját válaszaidból állítjuk össze. Nem keresünk automatikusan elérhetőséget, és nem küldünk üzenetet.</p>`)}
function openLearning(){const w=current().week;const source=[['A fenntarthatóság és az összefüggések megértése.','Globális példák megismerése, problémakör választása, ötfős csapat és a közös munka szabályai.','Kezdő önértékelés és első saját reflexió.'],['Miért nem elég önmagában a tudás?','Az Action Pathway első három lépése; a hét végére egy konkrét, megvalósítható közös akcióterv.','Második reflexió a tanulási folyamatról és az együttműködésről.'],['Az Action Pathway 4. lépése: Act.','A közösségi akció végrehajtása és dokumentálása fotókkal, felvételekkel, jegyzetekkel.','Harmadik reflexió a megvalósítás valóságáról és a nehézségek kezeléséről.'],['Az akció és a közvetlen eredmények bemutatása a megfelelő közönségnek.','Választott formátumú csoportos beszámoló, választható ActHub-megosztás és záró önértékelés.','Negyedik személyes feladat és a közös zárófeladat.']][w-1];openDialog('learning',`${w}. hét · A tanulás és az akció`, `<div class="eyebrow" style="margin-bottom:16px">${esc(WEEK_SOURCE[w-1])}</div>${source.map((t,i)=>`<div style="display:flex;gap:13px;margin:18px 0;font-size:14px"><span class="avatar">${i+1}</span><p>${t}</p></div>`).join('')}<div class="hint"><strong>A kurzus tananyaga és ez a munkatér együtt működik.</strong><p>Az oktató által biztosított tananyagokat és hivatalos feladatokat a kurzusfelületen találod. Itt a saját és közös gondolatokból építitek fel, valósítjátok meg és dokumentáljátok az akciót.</p></div><p class="tiny muted">Forrás: a megadott „BRIEF CONCEPT PROPOSAL”, Course Content és Assessment and Completion. Az itteni kérdések és segédletek felülettervezési javaslatok. Az Action Pathway ötlépéses módszerének nem mellékelt részletes tartalmát nem helyettesítik.</p>${btn('Vissza a saját lépésemhez','close','green small')}`)}
function openInfo(){openDialog('info','Egyszerre egy megtehető lépés.',`<p><strong>Egyéni gondolat → közös döntés → valódi cselekvés.</strong> A négy hét végigvezet, a válaszaidból pedig fokozatosan összeáll az akciótok.</p><p><strong>Mi működik?</strong> Külön résztvevői válaszok, közös projekt, helyi automatikus mentés, újrahasználható eszközök, letölthető tervek és beszámolók.</p><p><strong>Mi nem kapcsolódik még?</strong> Nincs szerver, élő szinkron, bejelentkezés, hivatalos beadás, e-mail-küldés, automatikus értékelés vagy közzététel. A résztvevőváltó bemutatófunkció, nem hozzáférésvédelem.</p><p><strong>Tananyag.</strong> A szerkezet a megadott „Turning Knowledge into Action: Developing Action Competence For Sustainability Through Real-life Actions” rövid kurzusjavaslatára épül. A felület kérdései, segédletei és a rövid önértékelés tervezési javaslatok, nem hivatalos vagy validált mérőeszközök. A hivatalos olvasmányokat és az Action Pathway teljes leírását az oktató biztosítja.</p><p><strong>Értékelés.</strong> A javaslat négy egyéni feladatot (15–15%) és egy csoportos feladatot (40%) ír le. Az összes feladat benyújtása, az előírt részvétel, az aktív csoportmunka és az összesített értékelés külön egyetemi ellenőrzést igényel. Az itteni pipák csak a helyi munkalépéseket jelzik.</p><p><strong>Adatmentés.</strong> A böngésző adataiban tárolunk. Az Akcióim menüben készíts biztonsági másolatot. A megosztott beszámoló nem tartalmazza a személyes reflexiókat; a teljes biztonsági másolat igen.</p><div style="display:flex;gap:10px;flex-wrap:wrap">${btn('Egy példa kipróbálása','demo','small secondary')}${btn('Vissza a saját akciómhoz','close','small green')}</div>`)}
function safeURL(s){try{const u=new URL(s);return['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return''}}
function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_|_$/g,'').slice(0,65)||'acthub';
function reportHTML(){const p=project(),v=g(),link=safeURL(v.link);const title=v.title||v.action||p.name;return`<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>body{margin:0;background:#f7f5ee;color:#244638;font:16px/1.7 'Segoe UI',Arial,sans-serif}main{max-width:850px;margin:40px auto;padding:48px;background:#fffefa;border:1px solid #e1e3d8}h1{font:36px/1.2 Georgia,serif;margin:20px 0 28px}h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:28px 0 8px;color:#596e4b}p{white-space:pre-wrap;overflow-wrap:anywhere}small{font-size:11px;color:#69795b}.grid{display:flex;gap:12px;flex-wrap:wrap}.grid img{max-width:100%;max-height:360px;border-radius:8px}a{color:inherit}footer{border-top:1px solid #dde1d1;padding-top:20px;margin-top:35px;font-size:11px}@media(max-width:600px){main{padding:25px;margin:0;border:0}h1{font-size:28px}}@media print{body{background:white}main{border:0;padding:0;margin:0;max-width:none}img{break-inside:avoid}h2{break-after:avoid}}</style></head><body><main><small>ACT HUB · ${esc(FORMAT[v.format]||'Beszámoló')}${p.demo?' · KITALÁLT MINTA':''}</small><h1>${esc(title)}</h1><small>${esc([v.place,v.when].filter(Boolean).join(' · '))}</small>${storyParts().filter(([,x],i)=>x||i<3).map(([h,x])=>`<h2>${esc(h)}</h2><p>${esc(x||'[Még nincs rögzítve]')}</p>`).join('')}${v.format==='photos'&&v.pictures.length?`<h2>Dokumentáció</h2><div class="grid">${v.pictures.map(x=>`<img src="${esc(x.data)}" alt="${esc(x.name||'Dokumentáció')}">`).join('')}</div>`:''}${link?`<h2>Kapcsolódó anyag</h2><p><a href="${esc(link)}" rel="noopener noreferrer">${esc(link)}</a></p>`:''}${v.followup?`<h2>A következő lépés</h2><p>${esc(v.followup)}</p>`:''}<footer>A munkatérben rögzített válaszokból összeállított ${['video','interview'].includes(v.format)?'szövegvázlat':'beszámoló'}. Nem automatikus hatásigazolás vagy egyetemi beküldés. A végső beadandót az oktatói útmutató szerint kell elkészíteni. ${p.demo?'A dokumentum kitalált mintaadatokat tartalmaz.':''}</footer></main></body></html>`}
function exportPersonal(){const m=me();const t=`ACT HUB · SZEMÉLYES JEGYZETEK\n${project().name}\nRésztvevő: ${member().name}\n${project().demo?'KITALÁLT MINTA\n':''}\nKIINDULÓPONT\n${SCALE.map((x,i)=>x+' '+(m['b'+i]||'—')+'/5').join('\n')}\n\n1. HÉT\n${m.r1||'[Nincs rögzítve]'}\n\n2. HÉT\n${m.r2||'[Nincs rögzítve]'}\n\n3. HÉT\n${m.r3||'[Nincs rögzítve]'}\n\n4. HÉT\n${m.r4||'[Nincs rögzítve]'}\n\nZÁRÓ ÖNÉRTÉKELÉS\n${SCALE.map((x,i)=>x+' '+(m['a'+i]||'—')+'/5').join('\n')}\n\nKURZUSVISSZAJELZÉS\n${m.feedback||'[Nincs rögzítve]'}\n\nSAJÁT VÁLLALÁS\n${m.commit||'—'}\n${m.due||''}\n\nEz saját jegyzet, nem egyetemi beküldés. A pontszámok önértékelések, nem igazolt kompetenciamérés.\n`;download(t,slug(project().name)+'_sajat_jegyzetek.txt','text/plain;charset=utf-8')}
function exportPlan(){const p=project(),v=g();let t=`ACT HUB · AKCIÓTERV\n${p.name}\n${p.demo?'KITALÁLT MINTA\n':''}\nÜGY\n${v.challenge||'—'}\n\nAKCIÓ\n${v.action||'—'}\n\nHOL ÉS MIKOR\n${v.place||'—'} · ${v.when||'—'}\n\nKÍVÁNT VÁLTOZÁS\n${v.intended||'—'}\n\nMEGOSZTOTT VÁLLALÁSOK\n${p.personal.map((m,i)=>m.done.commit?`${p.members[i].name}: ${m.commit||'—'} (${m.due||'—'})`:null).filter(Boolean).join('\n')||'Még nincs mentett vállalás.'}\n\nKÖVETKEZŐ KÖZÖS LÉPÉS\n${v.next||'—'}\n`;download(t,slug(p.name)+'_akcioterv.txt','text/plain;charset=utf-8')}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('A szöveg a vágólapra került.')}catch(e){const a=$('#request-preview');if(a){a.focus();a.select();toast('A szöveget kijelöltem. Másold a Ctrl/Cmd+C billentyűvel.')}else toast('A másolás ebben a böngészőben nem érhető el.')}}
function showDemo(){let p=state.projects.find(x=>x.demo);if(!p){p=newProject('Minta · Adjunk új esélyt a holmiknak');p.demo=true;const nm=['Én','Anna','Máté','Lili','Dániel'];p.members=nm.map(name=>({name}));Object.assign(p.group,{challenge:'Használható tárgyak kerülnek a kukába a kollégiumi kiköltözéskor.',action:'Egy délutáni cserepontot szervezünk a kollégiumban a még használható holmiknak.',place:'Kollégium · közös helyiség',when:'2026-10-23',intended:'A felajánlott holmik közül minél több kerüljön új gazdához.',meeting:'Keddi rövid közös egyeztetés a kurzus Zoom-szobájában.',next:'Anna egyezteti a helyszínhasználatot; utána véglegesítjük a tájékoztatót.',status:'going',actual:'MINTA: megtartottuk a cserepontot. A helyszínen összeírtuk az átadott tárgyakat, és rövid visszajelzést kértünk a résztvevőktől.',result:'MINTA: több felajánlott tárgy új gazdához került. Az átadások feljegyzése és a résztvevők visszajelzése alapján ezt közvetlenül megfigyelhettük.',evidence:'MINTA: saját helyszíni feljegyzés és rövid résztvevői visszajelzések. Valódi adat vagy melléklet ebben a mintában nincs.',limits:'Azt nem tudjuk, hogy a tárgyakat mennyi ideig használják tovább. Környezeti hatást nem számoltunk.',title:'Egy új gazda. Egy tárgy, ami nem a kukában végzi.'});p.personal.forEach((m,i)=>Object.assign(m,{concern:'Használható dolgok vesznek el a kiköltözéskor.',b0:2,b1:3,b2:2,a0:4,a1:4,a2:4,idea:['Szervezzünk egy egyszeri cserepontot a kiköltözőknek.','Először kérdezzük meg, milyen tárgyakat adnának tovább.','Készítsünk jól látható tájékoztatót a cserepontról.','Egyeztessünk a kollégiumi vezetéssel a helyszínről.','Dokumentáljuk, mi kerül új gazdához.'][i],observation:'MINTA: a kiköltözéskor a tároló mellett több használható holmi maradt.',commit:['Megírom és egyeztetem a cserepont rövid tájékoztatóját.','Egyeztetem a közös helyiség használatát.','Előkészítem a tárgyak átvételének menetét.','Egyeztetem a helyszíni segítők beosztását.','Összeállítom az egyszerű dokumentálási lapot.'][i],due:'2026-10-21',status:'ready',next:'Elkészítem a szöveg első változatát.',rules:true,r1:'MINTA: a tárgyak újrahasználata környezeti és közösségi kérdés is. A kommunikációban szeretnék részt venni.',r2:'MINTA: az egyszeri alkalom mellett döntöttünk, mert ezt a csapatunk ténylegesen meg tudja szervezni.',r3:'MINTA: rövidebb tájékoztatóra volt szükség, mint terveztük. A helyi visszajelzés alapján módosítottam.',r4:'MINTA: megtanultam kisebb, elvégezhető feladatokra bontani az ötletet. Egy új hallgatói kezdeményezésben is használnám.',cursor:5,done:{care:true,before:true,r1:true,idea:true}}));p.done={team:true};state.projects.push(p)}state.active=p.id;me().cursor=5;persist();$('#dialog').close();ui.modal='';render(true);toast('Kitalált mintaprojekt. A saját munkád megmaradt az Akcióim között.')}
async function addPhoto(file){if(!file)return;if(g().pictures.length>=3){toast('Legfeljebb 3 képet adhatsz hozzá.');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>12000000){toast('JPG, PNG vagy WebP képet válassz, legfeljebb 12 MB méretben.');return}const p=project();try{const url=URL.createObjectURL(file),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.76);URL.revokeObjectURL(url);if(p.group.pictures.length>=3)return;p.group.pictures.push({name:file.name.slice(0,200),data});p.group.reviewed=false;delete p.done.story;persist();if(project().id===p.id){const holder=$('#pictures');if(holder)holder.innerHTML=picturesHTML()}toast(storageOK?'A kép kicsinyítve, helyben elmentve.':'A kép betöltve, de a böngészőmentés nem sikerült. Készíts biztonsági másolatot.')}catch(e){toast('Ezt a képet nem sikerült megnyitni. Próbálj másik JPG vagy PNG képet.')}}

function copyFor(s,key){
 if(!project().solo)return s[key];
 const c={
 care:{hint:'A saját kiindulópontod következik.'},
 before:{hint:'Utána pontosítod az ügyedet.'},
 team:{title:'Melyik ügyet viszed tovább?',lead:'Pontosítsd a saját megfigyelésedet. Mi az a konkrét probléma, amelyen ebben a projektben dolgozni fogsz?',next:'Ezt az ügyet viszem tovább',hint:'A saját célodat röviden össze is kapcsolod a tanultakkal.'},
 r1:{lead:'Egy-két saját mondat elég. Miért fontos az ügyed, és mit értettél meg a tanult összefüggésekből?',next:'Továbblépek a tervezésre',hint:'Következik: a saját ügyből megtehető akció.'},
 idea:{lead:'Ne az egész problémát oldd meg: keress egy értelmes, megtehető lépést. Egy saját megfigyelésből indulj.',next:'Ezt az ötletet viszem tovább',hint:'Utána pontosítod a kiválasztott akciót.'},
 plan:{title:'Mi az az egy dolog, amit megteszel?',lead:'Válassz egy érdemi, megvalósítható akciót. Legyen világos, mit fogsz csinálni, hol és mikorra.',next:'Ezt fogom megvalósítani',hint:'A saját következő feladatod következik.'},

 pulse:{title:'Mi viszi most előre az akciódat?',lead:'Nézz rá az egész akcióra. Ha szükséges, változtass a terven; nem kell ragaszkodni ahhoz, ami nem működik.',next:'Rögzítem az akció következő lépését',hint:'Utána azt írod le, ami a valóságban történt.'},
 evidence:{lead:'Ne azt írd, amit terveztél, hanem amit valóban megtettél. A részleges vagy sikertelen próbálkozást is érdemes pontosan rögzíteni.',next:'Elmentem a tapasztalatot',hint:'Utána a saját tanulságodat fogalmazod meg.'},
 r3:{next:'Továbblépek az eredményhez',hint:'Következik: az eredmény és a történeted.'},
 result:{title:'Mi változott, és honnan tudod?',lead:'Válaszd külön, amit megtettél, és azt, ami ennek nyomán megváltozott. Az is érvényes válasz, hogy a változás még nem látható.',next:'Ezt tudom megmutatni'},
 after:{hint:'Már csak a történeted összeállítása van hátra.'},
 story:{title:'Ez a te történeted.',lead:'Nem kell üres lapról kezdened. A beszámoló a már elmentett válaszaidból áll össze.',next:'Átnéztem a beszámolót',hint:'A beszámolót elmentheted és tovább használhatod.'},
 finish:{lead:'Nézd meg, mi van készen. A munkád megmarad, és ugyanígy egy következő ügyet is végigvihetsz.'}
 };
 return c[s.id]?.[key]??soloText(s[key]);
}
const SHAPE={
 direct:{label:'Mi is tudunk változtatni rajta',title:'Mi az, amit közvetlenül megváltoztattok?',body:'Induljatok abból, amihez már van hozzáférésetek. Egy helyszín, egy alkalom vagy egy meglévő szokás is jó lépték lehet.',prompt:'A saját környezetünkben ezt változtatjuk meg…'},
 decision:{label:'Valaki más döntése is kell',title:'Kitől milyen konkrét változást kértek?',body:'Ne általános támogatást kérjetek. Nevezzétek meg a döntést vagy változtatást, és azt a szereplőt, aki erről érdemben dönthet. A megkereséshez később szövegvázlatot is kapsz.',prompt:'Ezzel a konkrét javaslattal keressük meg az illetékest…'},
 understand:{label:'Még egy fontos dolgot meg kell értenünk',title:'Kit kérdeztek meg, és miről?',body:'Az érintettek tapasztalata segíthet jobb akciót választani. Fogalmazzatok meg egy tisztázandó kérdést és egy megkereshető szereplőt. Ez az akció előkészítése; az érdemi cselekvést a válaszok alapján véglegesítsétek.',prompt:'Ezt szeretnénk megtudni, ezért őt kérdezzük meg…'}
};
function openShape(){openDialog('shape','Merre lehet elindulni?',`${contextQuote(g().challenge,'A választott ügy')}<p>Nem kell a legnagyobb megoldást megtalálni. Melyik út áll most közelebb hozzád?</p><div style="display:flex;flex-direction:column;gap:10px">${Object.entries(SHAPE).map(([k,x])=>`<button class="choice" data-do="shape-route" data-value="${k}">${icon(k==='direct'?'edit':k==='decision'?'team':'help')}${x.label}</button>`).join('')}</div><p class="tiny muted" style="margin-top:17px">Ezek gondolkodást segítő utak, nem előre kiválasztott vagy rangsorolt megoldások.</p>`)}
function openShapeQuestion(){const h=SHAPE[me().shaperoute]||SHAPE.direct;openDialog('shape-question',h.title,`<p>${h.body}</p>${field('p','shapeaction','Az első konkrét lépés',h.prompt,'textarea',true)}${btn('Ebből építsük tovább az akciót '+icon('arrow'),'use-shape','green')}<div style="margin-top:13px"><button class="subtle" data-do="shape">Másik irányt nézek</button></div>`)}

// Event delegation keeps the single-file interface lightweight and keyboard-friendly.
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.scope&&el.type!=='radio'&&el.type!=='checkbox'){setField(el.dataset.scope,el.dataset.key,el.value);if(ui.modal==='support'&&$('#request-preview'))$('#request-preview').value=requestText()}if(el.dataset.member!==undefined){project().members[Number(el.dataset.member)].name=el.value.slice(0,50)||'Résztvevő';queueSave()}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.scope&&['checkbox','radio'].includes(el.type))setField(el.dataset.scope,el.dataset.key,el.type==='checkbox'?el.checked:el.value);if(el.id==='photo-file')addPhoto(el.files[0]);if(el.id==='backup-file'){restoreBackup(el.files[0]);el.value=''}});
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-do]');if(!b)return;const a=b.dataset.do;switch(a){
case'next':next();break;case'back':go(me().cursor-1);break;case'go':go(Number(b.dataset.index));break;case'modal-go':$('#dialog').close();ui.modal='';go(Number(b.dataset.index));break;
case'week':{const w=Number(b.dataset.week),steps=STEPS.filter(s=>s.week===w),s=steps.find(s=>!done(s))||steps[0];go(STEPS.indexOf(s));break}
case'topic':setField('p','topic',b.dataset.value);render();break;case'example':ui.example=true;render();break;case'use-example':setField('p','concern',exampleConcern());render();$('#f-p-concern').focus();break;
case'choice':{setField(b.dataset.scope,b.dataset.key,b.dataset.value);if(b.dataset.key==='ethics'){const detailsWas=true;render();const feedback=$('#ethics-feedback');if(feedback)feedback.closest('details').open=true}else render();break}
case'reason':ui.reason=b.dataset.value;setField('p','reason',ui.reason);render();break;case'feasibility':ui.feasibility=!ui.feasibility;render();break;
case'team':openTeam();break;case'member':{project().member=Number(b.dataset.index);persist();$('#dialog').close();ui.modal='';render(true);toast(member().name+' saját nézete. A közös projekt változatlan.');break}
case'projects':openProjects();break;case'new':openNew();break;
case'create':{const name=text($('#new-name').value),mode=$('#new-mode').value;if(!name){$('#new-error').textContent='Adj rövid nevet az új ügyednek.';$('#new-name').focus();break}if(state.projects.length>=45){toast('Túl sok projekt van ebben a böngészőben. Előbb készíts biztonsági másolatot.');break}const p=newProject(name,mode==='solo',mode==='course');state.projects.push(p);state.active=p.id;persist();$('#dialog').close();ui.modal='';render(true);break}
case'switch-project':state.active=b.dataset.id;persist();$('#dialog').close();ui.modal='';render(true);break;
case'note':openDialog('note','Az akciód így áll össze.',noteHTML());break;case'overview':openOverview();break;case'close':closeDialog();break;case'help':openHelp();break;case'help-route':openRoute(b.dataset.value);break;
case'use-help':if(!text(me().helpstep)){toast('Írd le azt az egy lépést, amit most megteszel.');break}me().next=me().helpstep;me().reason=ui.reason;me().status='stuck';delete me().done.now;persist();$('#dialog').close();ui.modal='';go(8);toast('Ez lett a következő saját lépésed.');break;
case'support':openSupport();break;case'copy-request':copyText(requestText());break;case'learning':openLearning();break;case'shape':openShape();break;case'shape-route':me().shaperoute=b.dataset.value;persist();openShapeQuestion();break;case'use-shape':{if(!text(me().shapeaction)){toast('Írd le a választott konkrét lépést.');break}if(current().id==='plan'){g().action=me().shapeaction;g().reviewed=false;delete project().done.plan;delete project().done.story}else{me().idea=me().shapeaction;delete me().done.idea}persist();$('#dialog').close();ui.modal='';render();toast('Az ötleted bekerült a munkatérbe. Innen pontosíthatod tovább.');break}case'info':openInfo();break;
case'format':setField('g','format',b.dataset.value);render();break;
case'report':download(reportHTML(),slug(project().name)+'_beszamolo.html','text/html;charset=utf-8');toast('A beszámoló mentése elindult. Semmit nem küldtünk el.');break;
case'personal':exportPersonal();break;case'plan-export':exportPlan();break;
case'remove-photo':g().pictures.splice(Number(b.dataset.index),1);g().reviewed=false;delete project().done.story;persist();if($('#pictures'))$('#pictures').innerHTML=picturesHTML();else render();break;
case'backup':persist();download(JSON.stringify(state,null,2),'ActHub_biztonsagi_masolat.json','application/json');break;case'restore':$('#backup-file').click();break;case'demo':showDemo();break;
}});
async function restoreBackup(file){if(!file)return;if(file.size>14000000){toast('A mentés túl nagy. Legfeljebb 14 MB-os fájlt tölts be.');return}try{const data=JSON.parse(await file.text());if(!validData(data))throw new Error('invalid');if(state.projects.length+data.projects.length>50){toast('A mentés túl sok projektet tartalmaz ehhez a munkatérhez.');return}const added=data.projects.map(p=>({...p,id:id(),name:(p.name+' · betöltött másolat').slice(0,200)}));state.projects.push(...added);state.active=added[0].id;persist();$('#dialog').close();ui.modal='';render(true);toast('A mentés betöltve. A korábbi projektek is megmaradtak.')}catch(e){toast('Ez nem olvasható Act Hub-mentés. A meglévő adataid változatlanok.')}}
$('#dialog').addEventListener('cancel',()=>{persist();ui.modal='';render()});
$('#dialog').addEventListener('click',ev=>{if(ev.target===$('#dialog')){const r=ev.target.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)closeDialog()}});
render();
if(loadError)setTimeout(()=>toast('A korábbi mentés nem olvasható vagy a böngészőtár nem elérhető. Ments biztonsági másolatot az Akcióim menüben.'),700);
