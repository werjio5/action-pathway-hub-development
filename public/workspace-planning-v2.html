<script>
'use strict';
/* Standalone, local-only prototype. No remote requests, AI service or Google account connection.
   Event timestamps describe interface use, not thinking time or verified real-world impact. */
const STORAGE_KEY='acthub.action-workspace.v2';
const VERSION='Action Pathway · prototype 2.0';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const uid=()=>globalThis.crypto?.randomUUID?.()||'ap-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
const iso=()=>new Date().toISOString();
const dateInput=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const inDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dateInput(d)};
const parseDay=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?new Date(v+'T12:00:00'):null;
const dateLabel=v=>{const d=parseDay(v);return d&&!isNaN(d)?d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'Date not set'};
const stamp=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const shorten=(v,n=95)=>{v=String(v||'').trim();return v.length>n?v.slice(0,n-1).trimEnd()+'…':v};
const safeURL=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const exampleProject=()=>({name:'Less waste. More possibility.',challenge:'Good food is left over at our campus café, while students are looking for affordable meals.',knowledge:'We noticed untouched food at closing time. We still need to understand how much is left over and why.',learningGoal:'Become more confident starting a conversation with a potential partner.',goal:'Find a practical way for one campus café to reduce avoidable food waste.',success:'Compare what is left over before and during a small trial, and ask café staff what worked.',people:'The campus café manager',ask:'Understand what happens at closing time and whether a small trial would be possible.',affected:'Students and the café team',actionType:'conversation',action:'Have one short conversation with the café manager before designing a small trial.',deliverable:'A clear picture of the current problem and a decision about a possible next test.'});
function freshState(){return {schema:2,version:VERSION,projectId:uid(),createdAt:iso(),example:false,phase:'workshop',step:0,completed:[],project:{name:'',challenge:'',knowledge:'',learningGoal:'',goal:'',success:'',people:'',ask:'',affected:'',actionType:'conversation',action:'',deliverable:''},move:{title:'',owner:'',due:''},status:'ready',blocker:null,updates:[],files:[],revisions:[],workshopSnapshot:null,workshopFinishedAt:null,lastConfirmedAt:null,pauseNote:'',finishNote:'',facilitatorQuestion:'',events:[],timings:{},telemetry:true}}
let storageOK=true;
function normalise(raw){
 if(!raw||raw.schema!==2||!raw.project||!raw.move)throw Error('This is not an Action Workspace v2 project file.');
 const n=freshState();
 for(const key of Object.keys(n.project)) n.project[key]=String(raw.project[key]??n.project[key]).slice(0,8000);
 for(const key of Object.keys(n.move)) n.move[key]=String(raw.move[key]??'').slice(0,3000);
 for(const k of ['projectId','createdAt','workshopFinishedAt','lastConfirmedAt','pauseNote','finishNote','facilitatorQuestion']) n[k]=typeof raw[k]==='string'?raw[k]:n[k];
 n.example=!!raw.example;n.telemetry=raw.telemetry!==false;
 n.phase=raw.phase==='workspace'&&n.workshopFinishedAt?'workspace':'workshop';
 n.step=Number.isInteger(raw.step)?Math.min(5,Math.max(0,raw.step)):0;
 n.completed=Array.isArray(raw.completed)?[...new Set(raw.completed.filter(i=>Number.isInteger(i)&&i>=0&&i<6))]:[];
 n.status=['ready','active','stuck','paused','finished'].includes(raw.status)?raw.status:'ready';
 n.blocker=['people','reply','scope','team','resources','direction'].includes(raw.blocker)?raw.blocker:null;
 for(const k of ['updates','files','revisions','events'])n[k]=Array.isArray(raw[k])?raw[k].filter(x=>x&&typeof x==='object').slice(-1200):[];
 n.timings=raw.timings&&typeof raw.timings==='object'&&!Array.isArray(raw.timings)?raw.timings:{};
 n.workshopSnapshot=raw.workshopSnapshot&&typeof raw.workshopSnapshot==='object'?raw.workshopSnapshot:null;
 return n;
}
let state;
try{const raw=localStorage.getItem(STORAGE_KEY);state=raw?normalise(JSON.parse(raw)):freshState()}catch{storageOK=false;state=freshState()}
let currentVisit=null,toastTimer,restoreFocus=null,saveTimer,previewTimer;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true}catch{storageOK=false}const el=$('#save-copy');if(el)el.textContent=storageOK?'Saved on this device':'Not saved · export a copy'}
function log(type,data={}){if(!state.telemetry)return;state.events.push({id:uid(),at:iso(),type,phase:state.phase,step:state.phase==='workshop'?state.step+1:null,version:state.version,projectId:state.projectId,example:state.example,...data});if(state.events.length>1200)state.events.shift();save()}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function get(path){return path.split('.').reduce((a,k)=>a?.[k],state)||''}
function set(path,value){const [root,key]=path.split('.');if(['project','move'].includes(root)&&Object.hasOwn(state[root],key))state[root][key]=value}
function trackStep(){const key=state.phase==='workshop'?state.step:null;if(currentVisit&&currentVisit.step===key)return;endVisit();if(key===null||!state.telemetry)return;currentVisit={step:key,visibleMs:0,last:performance.now(),visible:!document.hidden};const old=state.timings[key]||{};state.timings[key]={visits:(old.visits||0)+1,visibleMs:old.visibleMs||0,helpOpens:old.helpOpens||0,firstOpenedAt:old.firstOpenedAt||iso(),firstCompletedAt:old.firstCompletedAt||null};log('step_opened',{step:key+1})}
function accrue(){if(currentVisit){const now=performance.now();if(currentVisit.visible)currentVisit.visibleMs+=now-currentVisit.last;currentVisit.last=now}}
function endVisit(){if(!currentVisit)return;accrue();const {step,visibleMs}=currentVisit;currentVisit=null;state.timings[step]=state.timings[step]||{};state.timings[step].visibleMs=(state.timings[step].visibleMs||0)+Math.round(visibleMs);log('step_view_closed',{step:step+1,visibleElapsedMs:Math.round(visibleMs)});save()}
document.addEventListener('visibilitychange',()=>{accrue();if(currentVisit)currentVisit.visible=!document.hidden;save()});
window.addEventListener('pagehide',()=>{endVisit();save()});
const stepNames=['Challenge','Change','People','Action','First move','Review'];
const stepIcons=['target','flag','people','spark','route','check'];
const requiredByStep=[['project.name','project.challenge'],['project.goal','project.success'],['project.people','project.ask','project.affected'],['project.action','project.deliverable'],['move.title','move.owner','move.due']];
function isStepValid(n){return n===5?requiredByStep.every((_,i)=>isStepValid(i)):requiredByStep[n].every(k=>String(get(k)).trim().length>0)}
function allValid(){return requiredByStep.every((_,i)=>isStepValid(i))}
function unlocked(n){return true}
function field(label,path,{type='text',placeholder='',hint='',optional=false,rows=3}={}){
 const id=path.replace('.','-'),value=get(path),req=optional?'':'required';
 return `<div class="field"><label for="${id}">${label}${optional?' <span class="optional">(optional)</span>':''}</label>${type==='textarea'?`<textarea id="${id}" data-bind="${path}" rows="${rows}" maxlength="3500" ${req} placeholder="${esc(placeholder)}" ${hint?`aria-describedby="hint-${id}"`:''}>${esc(value)}</textarea>`:`<input id="${id}" data-bind="${path}" type="${type}" value="${esc(value)}" maxlength="500" ${req} placeholder="${esc(placeholder)}" ${hint?`aria-describedby="hint-${id}"`:''}>`}${hint?`<p class="hint" id="hint-${id}">${hint}</p>`:''}</div>`
}
function modalField(label,name,value='',{type='text',placeholder='',optional=false,rows=3,hint=''}={}){const id='modal-'+name;return `<div class="field"><label for="${id}">${label}${optional?' <span class="optional">(optional)</span>':''}</label>${type==='textarea'?`<textarea id="${id}" name="${name}" rows="${rows}" maxlength="5000" ${optional?'':'required'} placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input id="${id}" name="${name}" type="${type}" value="${esc(value)}" maxlength="500" ${optional?'':'required'} placeholder="${esc(placeholder)}">`}${hint?`<p class="hint">${hint}</p>`:''}</div>`}
function logo(){return `<div class="brand" aria-label="Act Hub"><svg class="brand-mark" viewBox="0 0 44 46" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="#ec6d41"/><path d="M5 40 20 6h7l14 34H30L23 20l-8 20Z" fill="#27332f"/><path d="M20 40c-1-8 11-8 6-16" fill="none" stroke="#ec6d41" stroke-width="4.5" stroke-linecap="round"/></svg><div><span class="wordmark">Act Hub</span><span class="brand-sub">KNOWLEDGE INTO ACTION</span></div></div>`}
function header(){const w=state.phase==='workshop';return `<header class="header"><div class="header-inner">${logo()}<nav class="phases" aria-label="Your two phases"><button class="phase ${w?'active':''} ${state.workshopFinishedAt?'done':''}" data-act="review-workshop" ${w?'aria-current="step"':''}><span class="phase-num">${state.workshopFinishedAt?icon('check'):'1'}</span>Workshop</button><span class="phase-arrow" aria-hidden="true">→</span><button class="phase ${!w?'active':''}" data-act="go-workspace" ${!w?'aria-current="step"':''} title="Explore the workspace anytime"><span class="phase-num">${state.workshopFinishedAt?'2':icon('lock')}</span>Workspace</button></nav><div class="save-state" role="status"><span class="save-dot"></span><span id="save-copy">${storageOK?'Saved on this device':'Not saved · export a copy'}</span></div></div></header>`}
function footer(){return `<footer class="page-footer"><div class="footer-left"><span>ACT HUB · ACTION PATHWAY</span><span class="footer-sep">/</span><button class="footer-link" data-act="about">${icon('lock')}Local prototype · your data</button></div><div class="footer-right"><button class="footer-link" data-act="demo">${icon('play')}Try an example</button><span class="footer-sep">·</span><button class="footer-link" data-act="new">Start fresh</button></div></footer>`}
function render({scroll=false}={}){
 $('#app').innerHTML=header()+`<main id="main" class="app-main" tabindex="-1">${state.phase==='workshop'?renderWorkshop():renderWorkspace()}</main>`+footer();
 trackStep();save();if(scroll){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
}
function renderWorkshop(){let current=state.step;return `<section aria-label="Guided workshop"><div class="intro"><div><div class="eyebrow">${state.workshopFinishedAt?'Your workshop plan':'Your project starts here'}</div><h1>${current===5?'A clear plan.<br><span class="serif accent">A place to begin.</span>':'A good idea deserves<br><span class="serif accent">a first step.</span>'}</h1></div><p class="intro-note">${state.workshopFinishedAt?'Revisit your starting point. Your project updates stay with you.':'Build your project, one decision at a time.<br><strong>When your plan is ready, your workspace opens.</strong>'}</p></div><ol class="stepper" aria-label="Workshop steps">${stepNames.map((name,i)=>`<li><button class="step-button ${i===current?'current':state.completed.includes(i)?'complete':''}" data-act="step" data-step="${i}" ${!unlocked(i)?'disabled':''} ${i===current?'aria-current="step"':''}><span class="number">${state.completed.includes(i)&&i!==current?icon('check'):String(i+1).padStart(2,'0')}</span><span>${name}</span></button></li>`).join('')}</ol><div class="workshop-card"><div class="workshop-main"><div class="eyebrow step-kicker">${String(current+1).padStart(2,'0')} / 06 · ${stepNames[current]}</div><form id="workshop-form" novalidate>${workshopFields(current)}<div class="workshop-bottom">${current<5?`<button type="button" class="help-trigger" data-act="workshop-help">${icon('help')}Help me with this step</button>`:'<span class="hint">Your plan can evolve. This is a starting point.</span>'}<div class="button-row">${current>0?`<button type="button" class="btn text" data-act="prev">Back</button>`:''}<button type="submit" class="btn ${current===5?'orange':''}">${current===5?(state.workshopFinishedAt?'Back to our workspace':'Open our workspace'):'Save & continue'}${icon('arrow')}</button></div></div></form></div><aside class="workshop-aside" aria-label="Your emerging project"><div class="preview-heading">${icon('book')}<span class="eyebrow">Your project, taking shape</span></div><div id="live-preview">${preview()}</div><div class="preview-foot">${icon('check')}Your answers become your plan.<br>No extra document to write afterwards.</div></aside></div><div class="workshop-footnote"><span>${state.example?'Example project · edit anything to explore the flow.':'Work through this together. One shared answer per team is enough.'}</span><span>Saved as you go. Come back whenever you need.</span></div></section>`}
function workshopFields(i){const titles=['What do you want to change?','What would a useful change look like?','Who needs to be part of this?','What is the smallest useful thing you could try?','Make it easy to begin.','This is your starting point.'];const descriptions=['Choose one issue, in one place, affecting real people. A working answer is enough.','Name the change you hope to make, and how you could recognise it.','Start with one helpful person or role — and include the people affected.','You do not need a complete solution. Choose an action that helps you learn or move forward.','Give the first move an owner and a date. Keep it small enough to actually do.','Read it together. Does the first move make sense for the change you want?'];let content='';
 if(i===0)content=field('Give your project a working name','project.name',{placeholder:'e.g. Less waste. More possibility.'})+field('What problem have you noticed?','project.challenge',{type:'textarea',placeholder:'What is happening, where, and who does it affect?'})+`<details class="inline-details"><summary>${icon('plus')}Connect this to what you know <span class="optional">(optional)</span></summary><div class="fields">${field('What have you noticed or learned?','project.knowledge',{type:'textarea',placeholder:'A research finding, an observation, a conversation…',optional:true,rows:2})}${field('Something you would like to get better at','project.learningGoal',{placeholder:'e.g. Starting a conversation with a potential partner',optional:true})}</div></details>`;
 if(i===1)content=field('The change we want to see','project.goal',{type:'textarea',placeholder:'In this place, we want…'})+field('How will you know it helped?','project.success',{type:'textarea',rows:2,placeholder:'What could you observe, compare or ask people about?',hint:'Keep the ambition separate from evidence that it happened.'});
 if(i===2)content=field('Who could help you take the first step?','project.people',{placeholder:'A person, organisation or role — a role is enough for now.'})+field('What would you ask or learn from them?','project.ask',{type:'textarea',rows:2,placeholder:'We would like to understand… / We could ask them for…'})+field('Who is affected and should be heard?','project.affected',{placeholder:'Whose experience should shape your project?'});
 if(i===3)content=`<div class="field"><span class="field-label">What kind of first action fits?</span><div class="choice-row" role="group" aria-label="First action type">${[['conversation','message','Have a conversation'],['test','spark','Try something small'],['together','people','Bring people together'],['other','route','Something else']].map(([v,ic,label])=>`<button type="button" class="choice" data-act="action-type" data-value="${v}" aria-pressed="${state.project.actionType===v}">${icon(ic)}${label}</button>`).join('')}</div></div>`+field('Describe your first action','project.action',{type:'textarea',placeholder:'What could you do in one place, with a few people, to make a start?'})+field('What will this first action produce?','project.deliverable',{placeholder:'e.g. A decision, feedback, a small test result or a shared understanding.'});
 if(i===4)content=field('What is the next thing you will actually do?','move.title',{type:'textarea',rows:2,placeholder:'Start with a verb: ask, contact, compare, organise, test…',hint:'Not the whole project. Just the next move.'})+`<div class="input-row">${field('Who will take it?','move.owner',{placeholder:'A name or agreed role'})}${field('By when?','move.due',{type:'date'})}</div>`+`<div class="sheet-message" style="margin:0">${icon('route')} A clear next move beats a perfect long-term plan.</div>`;
 if(i===5)content=reviewContent()+`<div class="ready-note">${icon('check')}<span>Everything stays together: the plan you made, your next move, and what you learn along the way.</span></div>`;
 return `<h2>${titles[i]}</h2><p class="step-description">${descriptions[i]}</p><div class="fields">${content}</div>`
}
function reviewContent(){const p=state.project,m=state.move;const rows=[['target','The challenge',p.challenge,0],['flag','The change',p.goal,1],['people','The people',p.people+' · '+p.affected,2],['spark','The first action',p.action,3],['route','Our next move',m.title+(m.owner?' — '+m.owner:'')+(m.due?' · '+dateLabel(m.due):''),4]];return `<div class="review-list">${rows.map(([ic,label,text,i])=>`<div class="review-item">${icon(ic)}<div><h3>${label}</h3><p>${esc(text||'Not added yet')}</p></div><button type="button" class="edit-link" data-act="step" data-step="${i}" aria-label="Edit ${label.toLowerCase()}">Edit</button></div>`).join('')}</div>`}
function preview(){const p=state.project,m=state.move;const rows=[['The change',p.goal],['With',p.people],['First action',p.action],['Next move',m.title]];if(!p.name&&!p.challenge)return `<div class="preview-empty"><svg class="route-art" viewBox="0 0 240 130" aria-hidden="true"><path d="M30 105h75c45 0 8-54 62-54h35" fill="none" stroke="#d5deca" stroke-width="17" stroke-linecap="round"/><path d="M30 105h75c45 0 8-54 62-54h35" fill="none" stroke="#ec6d41" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6"/><circle cx="30" cy="105" r="8" fill="#ec6d41"/><path d="M197 53V16m0 2c12-7 16 9 29 1v23c-13 8-17-8-29-1" fill="none" stroke="#315d46" stroke-width="2" stroke-linecap="round"/><circle cx="66" cy="24" r="8" fill="#e4b77d"/><path d="M101 45h14m-7-7v14" stroke="#98ab88" stroke-width="1.5"/></svg><h3>A small beginning.<br>A real-world difference.</h3><p>Your project will take shape here as you move through the workshop.</p></div>`;return `<h3 class="live-name">${esc(p.name||'Our project')}</h3>${rows.map(([label,value])=>`<div class="preview-line ${value?'':'blank'}"><div class="tiny">${label}</div><p>${esc(value?shorten(value,100):'We will get to this together.')}</p></div>`).join('')}<div style="height:24px"></div>`}
function advance(){if(state.step<5){if(!state.completed.includes(state.step))state.completed.push(state.step);if(state.timings[state.step]&&!state.timings[state.step].firstCompletedAt)state.timings[state.step].firstCompletedAt=iso();log('step_completed',{step:state.step+1});state.step++;render({scroll:true});return}if(!state.workshopFinishedAt){if(state.timings[5])state.timings[5].firstCompletedAt=iso();log('step_completed',{step:6})}endVisit();if(!state.workshopFinishedAt){state.workshopFinishedAt=iso();state.workshopSnapshot=JSON.parse(JSON.stringify({project:state.project,move:state.move}));state.completed=[0,1,2,3,4,5];state.status='ready';log('workshop_completed');toast('Your plan is ready. This is where you move it forward.')}state.phase='workspace';render({scroll:true})}
const blockerNames={people:'Finding the right person',reply:'Waiting for a reply',scope:'The step feels too big',team:'Time or team coordination',resources:'Missing resources',direction:'Rethinking the approach'};
const milestoneNames={step:'A move completed',contact:'A first contact made',reply:'A reply received',meeting:'A conversation happened',test:'A small test happened',delivery:'An action delivered',learning:'Something useful learned'};
function compassData(){const u=state.updates.at(-1),hasMove=!!state.move.title;let where=state.updates.length?(milestoneNames[u?.milestone]||'Progress recorded'):'Your plan is ready',whereNote=state.updates.length?'From your team’s latest update.':'The workshop is complete.',missing=!hasMove?'A clear next move':state.updates.length?'The next step in practice':'Your first real-world step',missingNote=!hasMove?'Choose one action, an owner and a date.':'No result recorded for this move yet.',next='Take the move below',nextNote=hasMove?`Start with ${state.move.owner||'an agreed owner'}.`:'Choose what makes sense now.';
 if(!hasMove){next='Choose together';nextNote='A suggestion is available below.'}
 if(state.status==='stuck'){where='You have hit a blocker';whereNote=blockerNames[state.blocker]||'You asked for help.';missing={people:'One useful contact',reply:'A response or a new route',scope:'A smaller first step',team:'An achievable team plan',resources:'One essential resource',direction:'A workable approach'}[state.blocker]||'A way forward';missingNote='Focus on this, not the whole project.';next='Unblock one thing';nextNote='Open support below.'}
 if(state.status==='paused'){where='Paused by your team';whereNote='Your work is still here.';missing='A decision to restart';missingNote='No activity is assumed while paused.';next='Resume when ready';nextNote='Keep or change your next move.'}
 if(state.status==='finished'){where='Closed by your team';whereNote='The work remains in your story.';missing='Nothing to schedule';missingNote='You can reopen this project.';next='Keep what you learned';nextNote='Export a brief or revisit the story.'}
 return [["Where you are",where,whereNote],["What’s missing",missing,missingNote],["What’s next",next,nextNote]]}
function renderWorkspace(){const p=state.project,m=state.move,last=state.updates.at(-1);const status=state.status;let nextContent='';
 if(status==='paused')nextContent=`<div class="move-body"><div><div class="move-topline"><span class="eyebrow">A deliberate pause</span></div><h2 class="move-title">You can pause without losing your way.</h2><p class="move-description">${esc(state.pauseNote||'Your plan, notes and next move are saved. Pick them up when the time is right.')}</p>${m.title?`<p class="small muted">Next move kept: ${esc(m.title)}</p>`:''}</div><div class="move-art">${icon('pause')}</div></div><div class="move-footer"><span class="tiny">A pause is a decision, not a failure.</span><div class="button-row"><button class="btn" data-act="resume">Resume our project ${icon('arrow')}</button><button class="btn light" data-act="edit-plan">Adjust the plan</button></div></div>`;
 else if(status==='finished')nextContent=`<div class="move-body"><div><div class="move-topline"><span class="eyebrow">A chapter complete</span><span class="tag">Closed by your team</span></div><h2 class="move-title">Keep the learning.<br>Take the next possibility with you.</h2><p class="move-description">${esc(state.finishNote||'Your work and your learning are part of the project story. Closing a project does not claim a verified impact.')}</p></div><div class="move-art">${icon('flag')}</div></div><div class="move-footer"><span class="tiny">${state.updates.length} team update${state.updates.length===1?'':'s'} recorded</span><div class="button-row"><button class="btn" data-act="story">See our story ${icon('arrow')}</button><button class="btn light" data-act="brief">Export a brief</button><button class="btn text" data-act="resume">Reopen</button></div></div>`;
 else if(!m.title)nextContent=`<div class="move-body"><div><div class="move-topline"><span class="eyebrow">One thing at a time</span><span class="tag">Ready for a next move</span></div><h2 class="move-title">What makes sense to do next?</h2><p class="move-description">You have recorded what happened. Choose one small next step — or pause if you need to.</p></div><div class="move-art">${icon('route')}</div></div><div class="move-footer"><span class="tiny">Nothing is assigned automatically.</span><div class="button-row"><button class="btn" data-act="next">Choose our next move ${icon('arrow')}</button><button class="btn light" data-act="stuck">We’re stuck</button><button class="btn text" data-act="status">Pause or finish</button></div></div>`;
 else nextContent=`${status==='stuck'?`<div class="blocker-banner">${icon('help')}You marked a blocker: ${esc(blockerNames[state.blocker]||'Help needed')}</div>`:''}<div class="move-body"><div><div class="move-topline"><span class="eyebrow">Your next move</span><span class="tag ${status==='stuck'?'warn':''}">${status==='stuck'?'Support when you need it':'One thing to focus on'}</span></div><h2 class="move-title">${esc(m.title)}</h2><div class="move-meta"><span class="meta-item"><span class="owner-avatar">${esc(initials(m.owner))}</span>${esc(m.owner||'Owner not set')}</span><span class="meta-item">${icon('calendar')}${m.due?'By '+dateLabel(m.due):'Date not set'}</span>${m.due?'<button class="calendar-btn" data-act="calendar">Add to calendar</button>':''}</div></div><div class="move-art">${icon(status==='stuck'?'route':'arrow')}</div></div><div class="move-footer"><span class="tiny">How is it going?</span><div class="button-row">${status==='stuck'?`<button class="btn" data-act="support" data-reason="${esc(state.blocker||'scope')}">Find a way forward ${icon('arrow')}</button><button class="btn light" data-act="done">We’ve done this</button>`:`<button class="btn" data-act="done">${icon('check')}We’ve done this</button><button class="btn light" data-act="stuck">We’re stuck</button>`}<button class="btn text" data-act="change">${icon('edit')}Change the plan</button></div></div>`;
 return `<section class="workspace" aria-label="Your project workspace"><div class="workspace-heading"><div><div class="eyebrow">Your action workspace ${state.example?'<span class="example-badge">Example project</span>':''}</div><h1>${esc(p.name||'Our project')}</h1><p>${esc(p.goal)}</p></div><button class="btn light" data-act="project" aria-label="Open our project and files">${icon('book')}<span>Our project</span></button></div><div class="compass" aria-label="Where you are, what is missing, what is next">${compassData().map(([label,val,note],i)=>`<div class="compass-part"><div class="compass-label"><span>0${i+1}</span>${label}</div><div class="compass-value">${esc(val)}</div><div class="compass-note">${esc(note)}</div></div>`).join('')}</div><div class="move-card ${status==='finished'?'finish-card':''}">${nextContent}</div><div class="workspace-under"><div class="under-block"><h3>The bigger picture</h3><p>${esc(p.action)}</p><button class="text-link" data-act="project">${icon('book')}Our plan, people & files ${icon('chevron')}</button></div><div class="under-block"><h3>${last?'Latest from your team':'Your starting point'}</h3><p>${last?esc(shorten(last.note,180)):'You built a plan together. The next chapter starts with your first move.'}<span class="date">${last?stamp(last.at):'Workshop completed · '+stamp(state.workshopFinishedAt)}</span></p><button class="text-link" data-act="story">${icon('route')}Our story & learning ${icon('chevron')}</button></div></div><div class="workspace-tail"><span>${state.lastConfirmedAt?'Last status confirmed by your team · '+stamp(state.lastConfirmedAt):'Project progress comes from your updates, not from page visits.'}</span><button class="subtle-link" data-act="status">Pause or finish this project</button></div></section>`
}
function initials(v){return String(v||'Team').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function openSheet(title,intro,body,label='Your project',back=''){
 const dialog=$('#sheet');if(!dialog.open)restoreFocus=document.activeElement;
 $('#sheet-title').textContent=title;$('#sheet-intro').textContent=intro;$('#sheet-body').innerHTML=body;$('#sheet-label').textContent=label;$('#sheet-back').innerHTML=back;
 if(!dialog.open)dialog.showModal();document.body.style.overflow='hidden';dialog.scrollTop=0;
}
$('#sheet').addEventListener('close',()=>{document.body.style.overflow=''});
function closeSheet(){$('#sheet').close();if(restoreFocus?.isConnected)restoreFocus.focus({preventScroll:true})}
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet()}});
const stepHelp=[
 {title:'Make the problem specific.',lead:'Start with something you have actually noticed. You do not have to solve the whole issue.',steps:['Name one place or setting.','Describe what is happening, without jumping to a solution.','Name the people affected.'],sample:'Good food is left over at our campus café, while students are looking for affordable meals.'},
 {title:'Describe a change you could notice.',lead:'Separate the change you want from the action you might take.',steps:['What would be different for the people involved?','Make the change small enough to explore.','Choose something you can observe, compare or ask about.'],sample:'Find a practical way for one campus café to reduce avoidable food waste. Compare leftovers before and during a small trial.'},
 {title:'Start with roles, not a directory.',lead:'You need one useful first contact, not a perfect map of everyone.',steps:['Who experiences the issue directly?','Who makes a relevant decision or runs the service?','What would you ask one of them to understand or unlock?'],sample:'The campus café manager could explain closing-time routines. Students and café staff should help shape any trial.'},
 {title:'Try something that teaches you something.',lead:'A first action can be a conversation. Keep it small, real and reversible.',steps:['Choose the biggest thing you do not know yet.','Find a small way to learn about it in the real world.','Name what you should have afterwards: feedback, a decision or a test result.'],sample:'Have a short conversation with the café manager before designing a trial. Leave with a clearer understanding of the problem.'},
 {title:'One action. One owner. One date.',lead:'A next move should be obvious enough that someone can start without another planning meeting.',steps:['Begin with a verb: ask, contact, compare, test.','Agree who will take this move.','Choose a date that fits their actual availability.'],sample:'Ask the campus café manager for a 20-minute conversation. Anna will send the message next week.'}
];
function showWorkshopHelp(){const i=Math.min(4,state.step),h=stepHelp[i];if(state.timings[i])state.timings[i].helpOpens=(state.timings[i].helpOpens||0)+1;log('help_opened',{topic:'workshop_step',step:i+1});openSheet(h.title,h.lead,`<div class="suggestion"><div class="eyebrow">A simple way through</div><ol>${h.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div><div class="template"><div class="eyebrow">Example, not an answer for your project</div><p class="small">${esc(h.sample)}</p></div><div class="button-row"><button class="btn" data-act="close">Try it with our project ${icon('arrow')}</button></div><div class="divider"></div><details class="inline-details"><summary>${icon('plus')}Still unsure? Prepare a question for your facilitator.</summary><div class="fields">${modalField('Your question','question',state.facilitatorQuestion,{type:'textarea',optional:true,placeholder:'The part we are unsure about is…'})}<button class="btn light small" data-act="copy-question">${icon('copy')}Save & copy the question</button><p class="hint">Copy it into the channel you already use. This prototype does not send messages.</p></div></details>`,'Workshop support · '+stepNames[i]);}
function showStuck(){log('help_opened',{topic:'workspace_blocker'});openSheet('What is getting in the way?','Choose the closest situation. You will only see the help that fits.',`<div class="option-list">${[['people','people','We don’t know who to contact','Find a useful role and a clearer first ask.'],['reply','mail','Nobody is replying','Try a smaller ask or a different route.'],['scope','route','The next step feels too big','Turn it into something easier to begin.'],['team','clock','We’re short on time or coordination','Find one owner and a manageable move.'],['resources','folder','We’re missing something we need','Separate essentials from things that can wait.'],['direction','refresh','The original idea isn’t working','Change the approach without losing your learning.']].map(([id,ic,title,copy])=>option('support',id,ic,title,copy)).join('')}</div><p class="quiet">Choosing a situation records your team’s blocker. Opening this panel alone does not mark your project as stuck.</p>`,'Get unstuck')}
function option(act,value,ic,title,copy){return `<button class="option-button" data-act="${act}" data-reason="${value}">${icon(ic)}<span class="option-copy"><strong>${title}</strong><span>${copy}</span></span>${icon('chevron','chev')}</button>`}
function supportProposal(reason){const p=state.project;switch(reason){case 'people':return `Find one named contact for ${p.people||'the role we need'} and check how to reach them.`;case 'reply':return `Send one short follow-up to ${p.people||'our first contact'}, with one clear question.`;case 'scope':return `Speak with one person from ${p.affected||'the affected group'} to test the most important assumption.`;case 'team':return 'Agree who can take one 15-minute task this week, and set a realistic date.';case 'resources':return `Ask ${p.people||'one potential partner'} what existing resources could support a small first test.`;case 'direction':return 'Review what we have learned and choose a smaller or different first action.';default:return 'Choose one small next move together.'}}
function showSupport(reason){if(!Object.hasOwn(blockerNames,reason))reason='scope';state.status='stuck';state.blocker=reason;state.lastConfirmedAt=iso();log('blocker_selected',{reason});save();render();
 const data={people:['You do not need a long list.','Start with the person closest to the first decision your project needs.',['The people affected: '+(state.project.affected||'name them in your plan'), 'A useful first role: '+(state.project.people||'the person responsible for the relevant service'), 'Your reason to ask: '+(state.project.ask||'what do you need to understand or unlock?')]],reply:['Make the ask easier to answer.','A missing reply does not tell you why someone has not responded. Try one respectful follow-up with a specific, small request.',['Keep the message short.','Ask for one answer or a short conversation.','Leave room for them to suggest another person.']],scope:['Keep the purpose. Shrink the step.','You can keep your ambition while making the next move much smaller.',['One person instead of a whole group.','One place instead of a whole campus.','One question before a complete solution.']],team:['A smaller commitment can restart things.','Re-plan around the time your team actually has, not the time you hoped to have.',['Ask who has capacity for a short task.','Agree one owner — not “everyone”.','Choose a realistic date, or deliberately pause.']],resources:['What is essential for the first test?','You may not need the resources for the whole project yet. Identify what the smallest useful move really requires.',['Name the one thing you cannot proceed without.','Check what your team already has or can borrow.','Ask one relevant partner before making the plan bigger.']],direction:['Changing course is part of the work.','Keep what you learned. Change the part that no longer makes sense.',['What assumption turned out to be wrong?','Does the intended change still matter?','Could a different first action help you learn more?']]};const [title,intro,steps]=data[reason];
 openSheet(title,intro,`<div class="suggestion"><div class="eyebrow">Focus on this</div><ol>${steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div><div class="template"><div class="eyebrow">A possible next move</div><p class="small">${esc(supportProposal(reason))}</p></div><div class="button-row"><button class="btn" data-act="use-support" data-reason="${reason}">${reason==='direction'?'Revise our approach':'Make this our next move'}${icon('arrow')}</button>${['people','reply','resources'].includes(reason)?`<button class="btn light" data-act="outreach" data-reason="${reason}">${icon('mail')}Draft a message</button>`:''}</div><div class="divider"></div><button class="text-link" data-act="unblocked">${icon('check')}We can continue with our existing plan</button><p class="quiet">These are starting points, not verified partner recommendations. Your team chooses what to do.</p>`,'Support · '+blockerNames[reason],`<button class="back-link" data-act="stuck">${icon('back')}Other situations</button>`)}
function outreachText(reason){const p=state.project;return `${reason==='reply'?'Hello again,':'Hello,'}\n\nWe are working on “${p.name||'our project'}”. ${p.goal||'We are exploring a small local action.'}\n\n${reason==='reply'?'I wanted to follow up on our earlier message. ':''}${p.ask?'We would like to '+p.ask.charAt(0).toLowerCase()+p.ask.slice(1):'We would value your perspective before we decide what to try.'}\n\nWould you be open to a short conversation? If someone else is a better person to ask, a suggestion would be very helpful.\n\nThank you,\n${state.move.owner||'Our project team'}`}
function showOutreach(reason='people'){log('helper_used',{helper:'message_template',reason});openSheet('A message you can make your own.','This draft uses your project notes. Check the facts, name and request before sending it through your usual email tool.',`<div class="template"><div class="eyebrow">Starter template · not sent</div><label for="outreach-draft" class="sr-only">Edit your outreach message</label><textarea id="outreach-draft" style="min-height:330px">${esc(outreachText(reason))}</textarea></div><div class="button-row"><button class="btn" data-act="copy-message">${icon('copy')}Copy message</button><button class="btn light" data-act="use-support" data-reason="${reason}">Set this as our next move</button></div><p class="quiet">Copying a draft is not recorded as a message sent. Add a project update when you have actually contacted someone.</p>`,'Help with your next move',`<button class="back-link" data-act="support" data-reason="${reason}">${icon('back')}Back to the suggestion</button>`)}
function showUpdate(complete=true){openSheet(complete?'What happened?':'Add a project update.','A short, honest note is enough. Keep the learning, not just the good news.',`<form id="update-form"><input type="hidden" name="complete" value="${complete?'yes':'no'}"><div class="fields">${complete&&state.move.title?`<div class="sheet-message" style="margin:0"><span class="eyebrow">The move you are completing</span><p style="margin-top:6px">${esc(state.move.title)}</p></div>`:''}${modalField('What did you do, and what came out of it?','note','',{type:'textarea',placeholder:'For example: We spoke with the café manager. They asked us to first measure leftovers for two days.'})}<div class="field"><label for="milestone">Which description fits best?</label><select name="milestone" id="milestone">${Object.entries(milestoneNames).map(([v,label])=>`<option value="${v}">${label}</option>`).join('')}</select><p class="hint">This is your team’s record, not independent verification.</p></div><details class="inline-details"><summary>${icon('plus')}Keep a link or a learning note <span class="optional">(optional)</span></summary><div class="fields">${modalField('Link to the work or result','evidence','',{type:'url',optional:true,placeholder:'https://…',hint:'A document, event page, shared file or other useful record.'})}${modalField('What did you learn, or do more confidently?','learning','',{type:'textarea',optional:true,rows:2,placeholder:'What would you repeat or do differently next time?'})}</div></details></div><div class="button-row"><button type="submit" class="btn">${complete?'Save & choose the next move':'Save update'}${icon('arrow')}</button><button type="button" class="btn text" data-act="close">Cancel</button></div></form>`,'Your progress')}
function defaultNext(){const last=state.updates.at(-1),p=state.project;switch(last?.milestone){case 'contact':return `Check for a reply from ${p.people||'our contact'} and decide whether to follow up.`;case 'reply':return `Agree one small next step with ${p.people||'our contact'}.`;case 'meeting':return 'Write down what we learned and agree the smallest useful test.';case 'test':return 'Review the test results with the people involved and decide what to change.';case 'delivery':return 'Review what happened and document what we learned.';default:return 'Agree one small follow-up based on what we just learned.'}}
function showNext(proposal='',fromSupport=false){const title=proposal||state.move.title;openSheet(fromSupport?'Make the suggestion your own.':state.move.title?'Adjust your next move.':'What will you do next?',fromSupport?'This is a starting point. Adjust it so it fits your team and the situation.':'Choose one move you can realistically take. Nothing is assigned automatically.',`<form id="next-form"><input type="hidden" name="fromSupport" value="${fromSupport?'yes':'no'}">${!title?`<div class="template"><div class="eyebrow">A suggestion based on your last update</div><p class="small">${esc(defaultNext())}</p><button type="button" class="text-link" style="margin-top:12px" data-act="fill-next">Use this as a starting point ${icon('arrow')}</button></div>`:''}<div class="fields">${modalField('Our next move','title',title,{type:'textarea',rows:3,placeholder:'Start with one concrete action…'})}<div class="input-row">${modalField('Owner','owner',state.move.owner,{placeholder:'A name or agreed role'})}${modalField('By when?','due',proposal?inDays(7):(state.move.due||inDays(7)),{type:'date'})}</div></div><div class="button-row"><button type="submit" class="btn">Set our next move ${icon('arrow')}</button><button type="button" class="btn text" data-act="close">${state.move.title?'Cancel':'Decide later'}</button></div></form><div class="divider"></div><button class="text-link" data-act="edit-plan">${icon('edit')}The bigger plan needs changing</button>`,'Keep moving')}
function showChange(){openSheet('What needs to change?','Change only what needs changing. Your earlier work and updates stay in the project story.',`<div class="option-list">${option('next','','route','Only our next move','Change the action, owner or date.')}${option('edit-plan','','edit','Our goal, people or approach','Keep the purpose clear as you learn.')}${option('status','','pause','Our pace or project status','Pause deliberately, or close this chapter.')}</div>`,'Adjust your project')}
function showEditPlan(){const p=state.project;openSheet('Keep the learning. Change the plan.','This updates your working plan. Your original workshop plan is kept as a starting-point snapshot.',`<form id="edit-plan-form"><div class="fields">${modalField('Project name','name',p.name)}${modalField('The change we want','goal',p.goal,{type:'textarea',rows:2})}${modalField('Our first or current action','action',p.action,{type:'textarea',rows:2})}<details class="inline-details"><summary>${icon('plus')}Change the people or success indicator</summary><div class="fields">${modalField('Our first contact or role','people',p.people)}${modalField('What we want to ask or learn','ask',p.ask,{type:'textarea',rows:2})}${modalField('People who should be heard','affected',p.affected)}${modalField('How we will recognise useful change','success',p.success,{type:'textarea',rows:2})}</div></details>${modalField('Why are you changing it?','reason','',{type:'textarea',optional:true,rows:2,placeholder:'What did you learn that changed your thinking?'})}</div><div class="button-row"><button type="submit" class="btn">Save changes ${icon('check')}</button><button type="button" class="btn text" data-act="close">Cancel</button></div></form>`,'Adjust the bigger picture')}
function showStatus(){openSheet('Give your project an honest status.','No activity is not the same as failure. Your team decides whether to continue, pause or finish.',`<div class="option-list">${option('resume','','play','We are continuing','Keep the plan and carry on from the next move.')}${option('pause-form','','pause','We are taking a pause','Keep everything, without pretending the project is active.')}${option('finish-form','','flag','We are finishing here','Record why you are closing this chapter.')}</div>`,'Your project status')}
function statusForm(type){const pause=type==='pause';openSheet(pause?'Make room for a pause.':'Close this chapter thoughtfully.',pause?'You can resume at any time. Your plan and next move stay intact.':'Finishing does not require a success story. Record what happened and keep what you learned.',`<form id="status-form"><input type="hidden" name="kind" value="${type}"><div class="fields">${modalField(pause?'A note for when you come back':'Why are you finishing, and what should you remember?','note',pause?state.pauseNote:state.finishNote,{type:'textarea',optional:pause,placeholder:pause?'For example: We will revisit this when the next semester starts.':'We completed the action, changed direction, or decided not to continue because…'})}</div><div class="button-row"><button type="submit" class="btn">${pause?'Pause our project':'Finish this project'}${icon(pause?'pause':'flag')}</button><button type="button" class="btn text" data-act="close">Cancel</button></div></form>`,'Your project status')}
function showProject(){const p=state.project;log('project_opened');openSheet(p.name||'Our project','The plan you made together. Keep your files in the tools you already use.',`<div class="plan-section"><div class="eyebrow">The challenge</div><p>${esc(p.challenge)}</p>${p.knowledge?`<p class="muted small">What we know: ${esc(p.knowledge)}</p>`:''}</div><div class="plan-section"><div class="eyebrow">The change we want</div><p>${esc(p.goal)}</p><p class="muted">How we will recognise it: ${esc(p.success)}</p></div><div class="plan-section"><div class="eyebrow">The people</div><p>${esc(p.people)}<br><span class="muted">Our ask: ${esc(p.ask)}</span></p><p><span class="muted">People who should be heard:</span> ${esc(p.affected)}</p></div><div class="plan-section"><div class="eyebrow">Our action</div><p>${esc(p.action)}</p><p class="muted">What it should produce: ${esc(p.deliverable)}</p></div><div class="button-row"><button class="btn light small" data-act="edit-plan">${icon('edit')}Edit the plan</button><button class="btn light small" data-act="copy-summary">${icon('copy')}Copy a summary</button><button class="btn light small" data-act="brief">${icon('download')}Export a brief</button></div><div class="subsection"><h3>Files, in one easy place.</h3><p class="quiet">Link your existing Google Docs, Drive folders or other web files. This prototype stores the link; it does not access or synchronise the file.</p></div><div id="file-list">${fileList()}</div><details class="inline-details file-form" ${!state.files.length?'open':''}><summary>${icon('plus')}Add a file or resource link</summary><form id="file-form"><div class="fields">${modalField('What is it?','label','',{placeholder:'e.g. Our shared notes'})}${modalField('Link','url','',{type:'url',placeholder:'https://…'})}</div><div class="button-row"><button type="submit" class="btn light small">${icon('plus')}Save link</button></div></form></details><div class="divider"></div><button class="text-link" data-act="story">${icon('route')}Open our story & learning ${icon('arrow')}</button>`,'Our project')}
function fileList(){return state.files.length?state.files.map(f=>{const url=safeURL(f.url);return `<div class="file-row">${icon('link')}${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(f.label||'Saved link')}<span class="file-host">${esc(new URL(url).hostname)}</span></a>`:`<span class="small">${esc(f.label)} · link unavailable</span>`}<button data-act="remove-file" data-id="${esc(f.id)}" aria-label="Remove ${esc(f.label)}">${icon('close')}</button></div>`}).join(''):'<p class="quiet">No links yet. Add only what is useful for the project.</p>'}
function journalItems(){const rows=[...state.updates.map(u=>({...u,kind:'update'})),...state.revisions.map(r=>({...r,kind:'revision'}))];if(state.workshopFinishedAt)rows.push({id:'start',at:state.workshopFinishedAt,kind:'start',note:state.workshopSnapshot?.move?.title||'Your team completed the workshop plan.'});return rows.sort((a,b)=>new Date(b.at)-new Date(a.at))}
function showStory(){log('story_opened');const entries=journalItems();openSheet('The work. The learning. The story.','Built from your team’s notes. These are recorded experiences, not independent proof of impact or a skill score.',`<div class="button-row" style="margin-top:0;margin-bottom:28px"><button class="btn small" data-act="add-update">${icon('plus')}Add an update</button><button class="btn light small" data-act="brief">${icon('download')}Export a brief</button></div>${state.project.learningGoal?`<div class="sheet-message"><span class="eyebrow">What we wanted to get better at</span><p style="margin-top:7px">${esc(state.project.learningGoal)}</p></div>`:''}<ol class="journal">${entries.map(r=>`<li class="journal-item"><span class="timestamp">${stamp(r.at)}</span><h3>${r.kind==='start'?'Our starting point':r.kind==='revision'?'We changed the plan':esc(milestoneNames[r.milestone]||'A project update')}</h3><p>${esc(r.note||'Plan updated.')}</p>${r.moveTitle?`<p style="margin-top:6px">Move: ${esc(r.moveTitle)}</p>`:''}${r.learning?`<div class="learning"><strong>What we learned</strong>${esc(r.learning)}</div>`:''}${safeURL(r.evidence)?`<a href="${esc(safeURL(r.evidence))}" target="_blank" rel="noopener noreferrer">Open the linked record ${icon('external')}</a>`:''}</li>`).join('')||'<p class="muted small">Your story starts when your workshop plan is ready.</p>'}</ol>`,'Our story & learning')}
function showAbout(){openSheet('Your work stays on this device.','This is a clickable, standalone prototype — not a connected multi-user platform.',`<div class="plan-section"><div class="eyebrow">What works here</div><p>Your workshop answers, project status, updates, reflections and file links are saved in this browser. You can export a project backup or a readable brief.</p></div><div class="plan-section"><div class="eyebrow">What is not connected</div><p>There is no server, email service, AI model, shared team account or Google Drive sync. A file link opens in its original service. Copying this HTML file does not copy your saved project data.</p></div><div class="plan-section"><div class="eyebrow">Workshop feedback, locally</div><p>When enabled, this prototype also stores step opens, completions, help requests and interface-visible elapsed time. This is not thinking time, a diagnosis of difficulty, or a skill score. Nothing is sent to Act Hub.</p><label class="check-label" style="margin-top:14px"><input type="checkbox" id="telemetry-toggle" ${state.telemetry?'checked':''}><span>Store future interaction events locally.<br><span class="hint">Disabling this does not delete events already recorded. You can clear them below.</span></span></label></div><div class="button-row"><button class="btn light small" data-act="backup">${icon('download')}Export project backup</button><button class="btn light small" data-act="import">${icon('folder')}Import a backup</button><button class="btn text small" data-act="clear-events">Clear interaction events</button></div><p class="quiet">To transfer your project, export this backup, then import it in another copy of this prototype. Export before clearing browser storage. Avoid adding sensitive personal information.</p><div class="danger-zone"><button class="danger-btn" data-act="new">Reset this local project</button></div>`,'About this prototype')}
function confirmNew(example=false){openSheet(example?'Explore with a sample project.':'Start a new project? ',example?'We will fill the workshop with a fictional campus food-waste example. You still move through every step before the workspace opens.':'This removes the current project from this browser and returns you to the start of the workshop.',`<div class="sheet-message">${state.project.name||state.updates.length?'This replaces the current local project. Export a backup first if you want to keep it.':'You can edit every answer and try all the interactions.'}</div><div class="button-row"><button class="btn ${example?'':'light'}" data-act="reset-confirm" data-example="${example?'yes':'no'}">${example?'Load the example':'Start fresh'}${icon('arrow')}</button><button class="btn light" data-act="backup">Export current project</button><button class="btn text" data-act="close">Cancel</button></div>`,'Prototype controls')}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function slug(){return (state.project.name||'our-project').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,65)||'our-project'}
function summaryText(){const p=state.project,m=state.move;return `${p.name||'Our project'}\nAction Pathway · Act Hub${state.example?' · Example project':''}\n\nTHE CHALLENGE\n${p.challenge}\n\nTHE CHANGE WE WANT\n${p.goal}\nHow we will recognise it: ${p.success}\n\nTHE PEOPLE\n${p.people}\nOur ask: ${p.ask}\nPeople who should be heard: ${p.affected}\n\nOUR ACTION\n${p.action}\nWhat it should produce: ${p.deliverable}\n\nNEXT MOVE\n${m.title||'Not set'}\nOwner: ${m.owner||'Not set'} · Date: ${m.due||'Not set'}\n\nSTATUS\n${state.status}\n\nTEAM UPDATES\n${state.updates.map(u=>`${stamp(u.at)}: ${u.note}${u.learning?'\nLearning: '+u.learning:''}${safeURL(u.evidence)?'\nRecord: '+u.evidence:''}`).join('\n\n')||'No project updates recorded yet.'}`}
async function copyText(text){let success=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);success=true}}catch{}if(!success){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';const host=$('#sheet').open?$('#sheet'):document.body;host.append(ta);ta.select();try{success=document.execCommand('copy')}catch{}ta.remove()}toast(success?'Copied. Paste it into the tool you already use.':'Clipboard unavailable here. Select and copy the text instead.');return success}
function exportBrief(){log('brief_exported');const p=state.project;const rows=journalItems();const style=`*{box-sizing:border-box}body{max-width:820px;padding:48px 32px;margin:auto;background:#f6f4ef;color:#27332f;font:15px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}h1{font-size:38px;line-height:1.2;letter-spacing:-1px;margin:16px 0 25px}h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#315d46;margin-top:32px}p{white-space:pre-wrap;overflow-wrap:anywhere}.brand{font-size:23px;font-weight:700}.muted{color:#6a746e;font-size:12px}section{border-top:1px solid #dedfd6;padding-top:6px}a{color:#315d46}button{background:#27332f;border:0;color:#fff;border-radius:8px;padding:10px 16px;cursor:pointer}article{border-left:2px solid #bcccb1;padding-left:18px;margin:23px 0}.next{background:#fff;padding:22px;border:1px solid #dedfd6;border-radius:12px}@media print{body{padding:0;background:#fff}button{display:none}section,article{break-inside:avoid}}`;
 const body=`<div class="brand">Act Hub <span style="color:#ec6d41">/</span> Action Pathway</div><p class="muted">Project brief · exported ${stamp(iso())}${state.example?' · FICTIONAL EXAMPLE PROJECT':''}</p><h1>${esc(p.name||'Our project')}</h1><button onclick="window.print()">Print this brief</button>${[['The challenge',p.challenge],['What we know',p.knowledge],['The change we want',p.goal],['How we will recognise useful change',p.success],['The people',p.people+'\nOur ask: '+p.ask+'\nPeople who should be heard: '+p.affected],['Our action',p.action+'\nWhat it should produce: '+p.deliverable]].filter(x=>x[1]).map(([h,t])=>`<section><h2>${h}</h2><p>${esc(t)}</p></section>`).join('')}<section><h2>Next move · ${esc(state.status)}</h2><div class="next"><p>${esc(state.move.title||'No next move set.')}</p><p class="muted">${esc(state.move.owner)} · ${esc(state.move.due||'No date set')}</p></div></section><section><h2>Our story & learning</h2><p class="muted">Based on the team’s own notes. Not independent verification of impact or an assessment of individual skills.</p>${rows.map(r=>`<article><div class="muted">${stamp(r.at)}</div><p>${esc(r.note||'Plan updated.')}</p>${r.learning?`<p><strong>Learning</strong><br>${esc(r.learning)}</p>`:''}${safeURL(r.evidence)?`<a href="${esc(safeURL(r.evidence))}" target="_blank" rel="noopener noreferrer">Linked record</a>`:''}</article>`).join('')}</section>${state.files.length?`<section><h2>Project files</h2>${state.files.filter(f=>safeURL(f.url)).map(f=>`<p><a href="${esc(safeURL(f.url))}" target="_blank" rel="noopener noreferrer">${esc(f.label)}</a></p>`).join('')}</section>`:''}<p class="muted" style="margin-top:40px">A snapshot of the project at export time. Shared file permissions are managed in the original file service.</p>`;
 download(slug()+'-brief.html','<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(p.name||'Our project')+' · Act Hub</title><style>'+style+'</style></head><body>'+body+'</body></html>','text/html;charset=utf-8');toast('Your project brief has been exported.')}
function exportCalendar(){if(!state.move.title||!parseDay(state.move.due)){toast('Set a next move and a date first.');return}const dt=state.move.due.replaceAll('-','');const end=parseDay(state.move.due);end.setDate(end.getDate()+1);const escapeICS=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const raw=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Act Hub//Action Workspace//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uid()+'@acthub.local','DTSTAMP:'+iso().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+dateInput(end).replaceAll('-',''),'SUMMARY:'+escapeICS(state.move.title),'DESCRIPTION:'+escapeICS('Project: '+state.project.name+'\nOwner: '+state.move.owner+'\n'+state.project.goal),'END:VEVENT','END:VCALENDAR'];const folded=raw.map(line=>{let out=[],part='',len=0;for(const char of line){const bytes=new TextEncoder().encode(char).length;if(len+bytes>73){out.push(part);part=' ';len=1}part+=char;len+=bytes}out.push(part);return out.join('\r\n')}).join('\r\n')+'\r\n';download(slug()+'-next-move.ics',folded,'text/calendar;charset=utf-8');log('calendar_exported');toast('Calendar file exported. Open it in your calendar app.')}
/* All interface changes run through the same state. No simulated “saved” or “sent” actions. */
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-bind]')){set(el.dataset.bind,el.value);const saved=$('#save-copy');if(saved)saved.textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(save,180);clearTimeout(previewTimer);previewTimer=setTimeout(()=>{if($('#live-preview'))$('#live-preview').innerHTML=preview()},180)}});
document.addEventListener('change',e=>{if(e.target.id==='telemetry-toggle'){endVisit();state.telemetry=e.target.checked;save();if(state.telemetry)trackStep();toast(state.telemetry?'Local interaction recording enabled.':'Future interaction recording disabled.')}});
document.addEventListener('click',e=>{const button=e.target.closest('[data-act]');if(!button||button.disabled)return;const act=button.dataset.act;switch(act){
 case 'close':closeSheet();break;
 case 'step':{const i=Number(button.dataset.step);if(unlocked(i)){state.step=i;render({scroll:true})}break}
 case 'prev':state.step=Math.max(0,state.step-1);render({scroll:true});break;
 case 'review-workshop':closeSheet();state.phase='workshop';state.step=5;render({scroll:true});break;
 case 'go-workspace':state.phase='workspace';render({scroll:true});break;
 case 'action-type':state.project.actionType=button.dataset.value;document.querySelectorAll('[data-act="action-type"]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));log('action_type_selected',{value:button.dataset.value});save();break;
 case 'workshop-help':showWorkshopHelp();break;
 case 'copy-question':{const value=$('#modal-question').value.trim();if(!value){toast('Write your question first.');return}state.facilitatorQuestion=value;log('facilitator_question_prepared');save();copyText(value);break}
 case 'project':showProject();break;
 case 'story':showStory();break;
 case 'stuck':showStuck();break;
 case 'support':showSupport(button.dataset.reason||state.blocker||'scope');break;
 case 'use-support':button.dataset.reason==='direction'?showEditPlan():showNext(supportProposal(button.dataset.reason),true);break;
 case 'unblocked':state.status=state.updates.length?'active':'ready';state.blocker=null;state.lastConfirmedAt=iso();log('blocker_cleared');save();closeSheet();render();toast('You are continuing with your plan.');break;
 case 'outreach':showOutreach(button.dataset.reason);break;
 case 'copy-message':copyText($('#outreach-draft').value);log('message_draft_copied');break;
 case 'done':showUpdate(true);break;
 case 'add-update':showUpdate(false);break;
 case 'next':showNext();break;
 case 'fill-next':$('#modal-title').value=defaultNext();$('#modal-title').focus();break;
 case 'change':showChange();break;
 case 'edit-plan':showEditPlan();break;
 case 'status':showStatus();break;
 case 'pause-form':statusForm('pause');break;
 case 'finish-form':statusForm('finish');break;
 case 'resume':state.status=state.updates.length?'active':'ready';state.blocker=null;state.lastConfirmedAt=iso();log('status_changed',{status:state.status});save();closeSheet();render();toast('Your project is open. Continue at your own pace.');break;
 case 'remove-file':state.files=state.files.filter(f=>f.id!==button.dataset.id);save();$('#file-list').innerHTML=fileList();toast('Link removed from this project.');break;
 case 'copy-summary':copyText(summaryText());log('summary_copied');break;
 case 'brief':exportBrief();break;
 case 'calendar':exportCalendar();break;
 case 'about':showAbout();break;
 case 'demo':confirmNew(true);break;
 case 'new':confirmNew(false);break;
 case 'reset-confirm':endVisit();state=freshState();if(button.dataset.example==='yes'){state.example=true;state.project=exampleProject();state.move={title:'Ask the campus café manager for a 20-minute conversation.',owner:'Anna',due:inDays(7)}}save();closeSheet();render({scroll:true});toast(state.example?'Example loaded. Continue through the workshop to open the workspace.':'Your new project is ready to begin.');break;
 case 'backup':accrue();save();download(slug()+'-workspace.json',JSON.stringify(state,null,2),'application/json');toast('Project backup exported.');break;
 case 'import':$('#import-file').click();break;
 case 'clear-events':currentVisit=null;state.events=[];state.timings={};save();toast('Previously stored interaction events cleared.');break;
 }});
document.addEventListener('submit',e=>{const form=e.target;if(!['workshop-form','next-form','update-form','edit-plan-form','status-form','file-form'].includes(form.id))return;e.preventDefault();const fd=new FormData(form);const v=n=>String(fd.get(n)||'').trim();
 if(form.id==='workshop-form'){save();advance();return}
 if(form.id==='next-form'){const next={title:v('title'),owner:v('owner'),due:v('due')};if(!next.title||!next.owner||!parseDay(next.due)){toast('Give the move an action, owner and valid date.');return}const before={...state.move};state.move=next;if(JSON.stringify(before)!==JSON.stringify(next))state.revisions.push({id:uid(),at:iso(),note:'Next move set: '+next.title+' — '+next.owner+' · '+next.due,beforeMove:before,afterMove:next});state.status=state.updates.length?'active':'ready';state.blocker=null;state.lastConfirmedAt=iso();log('next_move_set',{fromSupport:v('fromSupport')==='yes'});save();closeSheet();render();toast('One clear next move. Ready when you are.');return}
 if(form.id==='update-form'){const evidence=v('evidence');if(evidence&&!safeURL(evidence)){toast('Use a valid http or https link.');return}if(!v('note')){toast('Add a short note about what happened.');return}const complete=v('complete')==='yes';state.updates.push({id:uid(),at:iso(),note:v('note'),milestone:v('milestone'),evidence:safeURL(evidence),learning:v('learning'),moveTitle:complete?state.move.title:'',owner:state.move.owner,completedMove:complete,source:'team_report'});if(complete){state.move={...state.move,title:'',due:''};state.status='active';state.blocker=null}else if(state.status==='ready')state.status='active';state.lastConfirmedAt=iso();log('project_update_recorded',{completedMove:complete,milestone:v('milestone'),hasEvidence:!!evidence,hasLearning:!!v('learning')});save();render();if(complete){showNext();toast('Progress saved. Your learning stays in the story.')}else{showStory();toast('Your update is in the project story.')}return}
 if(form.id==='edit-plan-form'){const before={...state.project};for(const key of ['name','goal','action','people','ask','affected','success']){if(!v(key)){toast('Keep the key parts of the plan filled in.');return}}for(const key of ['name','goal','action','people','ask','affected','success'])state.project[key]=v(key);const changed=JSON.stringify(before)!==JSON.stringify(state.project);if(changed)state.revisions.push({id:uid(),at:iso(),note:v('reason')||'We revised our working plan.',before,after:{...state.project}});if(state.blocker==='direction'){state.status=state.updates.length?'active':'ready';state.blocker=null}log('plan_changed',{changed});save();render();closeSheet();toast('Plan updated. Check that the next move still fits.');return}
 if(form.id==='status-form'){const pause=v('kind')==='pause';state.status=pause?'paused':'finished';state.blocker=null;state.lastConfirmedAt=iso();state[pause?'pauseNote':'finishNote']=v('note');state.revisions.push({id:uid(),at:iso(),note:(pause?'We paused this project. ':'We closed this project. ')+v('note')});log('status_changed',{status:state.status});save();closeSheet();render();toast(pause?'Project paused. Everything is kept.':'Project closed. Your work stays in the story.');return}
 if(form.id==='file-form'){const url=safeURL(v('url'));if(!url){toast('Use a full http or https web link.');return}if(!v('label')){toast('Add a name for this link.');return}state.files.push({id:uid(),label:v('label'),url,at:iso()});log('file_link_added');save();$('#file-list').innerHTML=fileList();form.reset();toast('Link saved. Access is managed in the original service.');return}
});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>4*1024*1024)throw Error('This backup is too large. Use a file smaller than 4 MB.');const next=normalise(JSON.parse(await file.text()));openSheet('Replace this local project?','Importing a backup replaces the project currently saved in this browser.',`<div class="sheet-message">Import: <strong>${esc(next.project.name||'Untitled project')}</strong><br>${next.updates.length} recorded updates · ${next.workshopFinishedAt?'Workshop complete':'Workshop in progress'}</div><div class="button-row"><button class="btn" id="confirm-import">Import project ${icon('arrow')}</button><button class="btn light" data-act="backup">Export current project</button><button class="btn text" data-act="close">Cancel</button></div>`,'Project backup');$('#confirm-import').addEventListener('click',()=>{endVisit();state=next;save();closeSheet();render({scroll:true});toast('Project restored from your backup.')})}catch(err){toast(err.message||'Could not read this project backup.')}finally{e.target.value=''}});
render();
</script>
</body>
</html>
